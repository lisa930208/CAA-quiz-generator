<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASA Part-66 / CAA 模擬測驗系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-sky-500 text-white p-2 rounded-lg shadow-md">
                <i class="fa-solid fa-plane-departure text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-slate-100 tracking-wide">EASA Part-66 / CAA 模擬測驗系統</h1>
                <p class="text-xs text-slate-400">Aircraft Maintenance License Practice Platform</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <label for="module-select" class="text-xs text-slate-400 hidden sm:block">選擇單元：</label>
            <select id="module-select" onchange="switchModule(this.value)" class="bg-slate-700 text-slate-100 text-sm font-medium px-4 py-2 rounded-lg border border-slate-600 focus:outline-none focus:ring-2 focus:ring-sky-500 transition">
                <option value="M05-01">Module 05.01 - Electronic Instrument Systems</option>
                <option value="M05-02">Module 05.02 - Numbering Systems</option>
            </select>
        </div>
    </header>

    <!-- 主體內容區 -->
    <div class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-8 flex flex-col justify-center">
        
        <!-- 儀表板卡片 -->
        <div class="bg-slate-800 rounded-2xl border border-slate-700/60 shadow-2xl overflow-hidden flex flex-col">
            
            <!-- 資訊與進度頭部 -->
            <div class="bg-slate-800/50 p-6 border-b border-slate-700/80 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <span id="module-badge" class="inline-block bg-sky-500/20 text-sky-400 text-xs font-semibold px-3 py-1 rounded-full border border-sky-500/30 mb-2">
                        Module 05.01
                    </span>
                    <h2 id="module-title" class="text-xl font-bold text-slate-100">Electronic Instrument Systems</h2>
                </div>
                <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-end">
                    <div class="text-right">
                        <span class="text-xs text-slate-400 block">目前進度</span>
                        <span class="text-sm font-bold text-sky-400"><span id="current-idx">1</span> / <span id="total-cnt">33</span></span>
                    </div>
                    <div class="w-24 bg-slate-700 rounded-full h-2.5 overflow-hidden">
                        <div id="progress-bar" class="bg-sky-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- 測驗內容卡片 -->
            <div id="quiz-container" class="p-6 md:p-8 flex-1 flex flex-col justify-between">
                <div>
                    <div class="mb-6">
                        <p id="question-text" class="text-base md:text-lg font-medium leading-relaxed text-slate-100">
                            載入題目中...
                        </p>
                    </div>

                    <!-- 選項按鈕組 -->
                    <div id="options-container" class="space-y-3 mb-6">
                        <!-- 動態插入選項 -->
                    </div>

                    <!-- 獨立解析區塊 -->
                    <div id="explanation-box" class="hidden bg-slate-900/90 border-l-4 border-sky-500 p-5 rounded-r-xl text-sm transition-all animate-fadeIn">
                        <div class="flex items-center space-x-2 text-sky-400 font-semibold mb-2">
                            <i class="fa-solid fa-lightbulb"></i>
                            <span>題目解析 Explanation</span>
                        </div>
                        <p id="explanation-text" class="text-slate-300 leading-relaxed pl-1"></p>
                    </div>
                </div>

                <!-- 底部按鈕欄 -->
                <div class="flex justify-between items-center pt-6 border-t border-slate-700/80 mt-6">
                    <button id="prev-btn" onclick="prevQuestion()" class="flex items-center space-x-2 px-5 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium transition disabled:opacity-30 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>上一題</span>
                    </button>
                    <button id="next-btn" onclick="nextQuestion()" class="flex items-center space-x-2 px-6 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-sm font-medium transition shadow-lg shadow-sky-600/30">
                        <span>下一題</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>

            <!-- 測驗結束結算畫面 -->
            <div id="result-container" class="hidden p-10 text-center flex-1 flex flex-col justify-center items-center">
                <div class="w-16 h-16 bg-sky-500/20 text-sky-400 rounded-full flex items-center justify-center text-3xl mb-4 border border-sky-500/30">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <h3 class="text-2xl font-bold text-slate-100 mb-2">測驗完成！</h3>
                <p class="text-slate-400 text-sm mb-6">您在此章節的答題成績如下：</p>
                <div class="bg-slate-900/80 border border-slate-700 px-8 py-4 rounded-2xl mb-8">
                    <span class="text-4xl font-extrabold text-sky-400" id="score-text">0</span>
                    <span class="text-slate-400 text-lg"> / <span id="result-total">33</span></span>
                </div>
                <button onclick="restartQuiz()" class="px-6 py-3 bg-sky-600 hover:bg-sky-500 text-white rounded-xl font-medium transition shadow-lg shadow-sky-600/30">
                    <i class="fa-solid fa-rotate-right mr-2"></i>重新測驗此章節
                </button>
            </div>

        </div>
    </div>

    <!-- 載入外部題目資料檔 -->
    <script src="bank.js"></script>

    <!-- 主控程式邏輯 -->
    <script>
        let currentModuleKey = "M05-01";
        let currentIndex = 0;
        let userAnswers = {};

        function initApp() {
            if (typeof allQuestionBanks === 'undefined') {
                console.error("無法讀取 bank.js，請確認檔案名稱與路徑！");
                return;
            }
            for (let key in allQuestionBanks) {
                userAnswers[key] = new Array(allQuestionBanks[key].questions.length).fill(null);
            }
            loadQuestion();
        }

        function getCurrentQuestions() {
            return allQuestionBanks[currentModuleKey].questions;
        }

        function loadQuestion() {
            const questions = getCurrentQuestions();
            const q = questions[currentIndex];
            const currentAnswers = userAnswers[currentModuleKey];

            document.getElementById("module-badge").textContent = currentModuleKey;
            document.getElementById("module-title").textContent = allQuestionBanks[currentModuleKey].title;
            document.getElementById("current-idx").textContent = currentIndex + 1;
            document.getElementById("total-cnt").textContent = questions.length;
            
            // 更新進度條
            const percent = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById("progress-bar").style.width = `${percent}%`;

            document.getElementById("question-text").textContent = q.question;
            const container = document.getElementById("options-container");
            container.innerHTML = "";

            q.options.forEach((opt) => {
                const letter = opt.charAt(0).toLowerCase();
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-4 rounded-xl bg-slate-700/50 hover:bg-slate-700 border border-slate-600/60 transition flex items-center justify-between text-slate-200 text-sm md:text-base";
                btn.innerHTML = `<span>${opt}</span>`;

                if (currentAnswers[currentIndex] !== null) {
                    btn.disabled = true;
                    if (letter === q.answer.toLowerCase()) {
                        btn.className = "w-full text-left p-4 rounded-xl bg-emerald-600/20 border-2 border-emerald-500 text-emerald-300 font-medium flex items-center justify-between text-sm md:text-base";
                    } else if (letter === currentAnswers[currentIndex]) {
                        btn.className = "w-full text-left p-4 rounded-xl bg-rose-600/20 border-2 border-rose-500 text-rose-300 font-medium flex items-center justify-between text-sm md:text-base";
                    }
                } else {
                    btn.onclick = () => selectOption(letter);
                }
                container.appendChild(btn);
            });

            const expBox = document.getElementById("explanation-box");
            if (currentAnswers[currentIndex] !== null) {
                document.getElementById("explanation-text").textContent = q.explanation || "暫無詳細解析。";
                expBox.classList.remove("hidden");
            } else {
                expBox.classList.add("hidden");
            }

            document.getElementById("prev-btn").disabled = currentIndex === 0;
            document.getElementById("next-btn").querySelector("span").textContent = currentIndex === questions.length - 1 ? "查看結果" : "下一題";
        }

        function selectOption(letter) {
            userAnswers[currentModuleKey][currentIndex] = letter;
            loadQuestion();
        }

        function nextQuestion() {
            const questions = getCurrentQuestions();
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showResult();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function showResult() {
            const questions = getCurrentQuestions();
            const answers = userAnswers[currentModuleKey];
            let score = 0;
            questions.forEach((q, idx) => {
                if (answers[idx] === q.answer.toLowerCase()) score++;
            });

            document.getElementById("quiz-container").classList.add("hidden");
            document.getElementById("result-container").classList.remove("hidden");
            document.getElementById("score-text").textContent = score;
            document.getElementById("result-total").textContent = questions.length;
        }

        function switchModule(key) {
            currentModuleKey = key;
            currentIndex = 0;
            document.getElementById("result-container").classList.add("hidden");
            document.getElementById("quiz-container").classList.remove("hidden");
            loadQuestion();
        }

        function restartQuiz() {
            userAnswers[currentModuleKey] = new Array(getCurrentQuestions().length).fill(null);
            currentIndex = 0;
            document.getElementById("result-container").classList.add("hidden");
            document.getElementById("quiz-container").classList.remove("hidden");
            loadQuestion();
        }

        window.onload = initApp;
    </script>
</body>
</html>
