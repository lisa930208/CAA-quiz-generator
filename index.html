<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EASA Part-66 航空維修題庫中心</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #0284c7;
            --primary-hover: #0ea5e9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            min-height: 100vh;
        }
        /* 側邊欄樣式 */
        aside {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .brand {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }
        .module-btn {
            width: 100%;
            text-align: left;
            background: transparent;
            color: var(--text-main);
            border: 1px solid transparent;
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .module-btn:hover {
            background-color: var(--bg-hover);
        }
        .module-btn.active {
            background-color: #0284c720;
            border-color: var(--primary);
            color: #38bdf8;
        }
        .module-btn .mod-code {
            font-weight: bold;
            font-size: 13px;
        }
        .module-btn .mod-name {
            font-size: 12px;
            color: var(--text-muted);
        }
        .module-btn.active .mod-name {
            color: #cbd5e1;
        }

        /* 主內容區樣式 */
        main {
            margin-left: 280px;
            flex: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background-color: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 35px;
            border: 1px solid var(--border-color);
        }
        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        h1 {
            font-size: 22px;
            margin-top: 5px;
        }
        .badge {
            background-color: var(--primary);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        /* 進度條 */
        .progress-bar-container {
            background-color: var(--border-color);
            border-radius: 999px;
            height: 8px;
            width: 100%;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-bar {
            background-color: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }
        .question-text {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .option-btn {
            width: 100%;
            text-align: left;
            background-color: #33415550;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
        }
        .option-btn:hover:not(:disabled) {
            background-color: var(--bg-hover);
            border-color: #475569;
        }
        .option-btn:disabled {
            cursor: default;
        }
        .correct {
            background-color: #16a34a30 !important;
            border-color: #22c55e !important;
            color: #4ade80 !important;
        }
        .wrong {
            background-color: #dc262630 !important;
            border-color: #ef4444 !important;
            color: #f87171 !important;
        }
        .explanation {
            background-color: var(--bg-main);
            border-left: 4px solid var(--primary);
            padding: 16px;
            border-radius: 6px;
            margin: 20px 0;
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
        }
        .hidden { display: none !important; }
        
        .footer-nav {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            margin-top: 25px;
        }
        .nav-btn {
            background-color: var(--bg-hover);
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .nav-btn:hover:not(:disabled) { background-color: #475569; }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .primary-btn { background-color: var(--primary); }
        .primary-btn:hover { background-color: var(--primary-hover); }

        .result-box {
            text-align: center;
            padding: 30px 0;
        }
        .result-card {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            display: flex;
            justify-content: space-around;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .stat-val {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
        }
        .stat-lbl {
            font-size: 13px;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside { width: 100%; height: auto; position: relative; }
            main { margin-left: 0; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- 側邊欄導覽 -->
    <aside>
        <div class="brand">
            ✈️ EASA 題庫中心
        </div>
        <div class="nav-section-title">測驗章節列表</div>
        <div id="sidebar-modules">
            <!-- 透過 JS 動態產生章節按鈕 -->
        </div>
    </aside>

    <!-- 主測驗區 -->
    <main>
        <div class="container">
            <header>
                <div>
                    <span class="badge" id="mod-badge">Module 05.01</span>
                    <h1 id="mod-title">載入中...</h1>
                </div>
                <div id="quiz-progress-text" style="color: var(--text-muted); font-size: 14px;">
                    第 <span id="current-idx">1</span> / <span id="total-cnt">33</span> 題
                </div>
            </header>

            <!-- 進度條 -->
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div class="stats-row">
                <span>目前得分：<strong id="live-score" style="color: #4ade80;">0</strong></span>
                <span id="mode-indicator" style="color: #38bdf8;">一般測驗模式</span>
            </div>

            <!-- 題目進行區 -->
            <div id="quiz-container">
                <div class="question-text" id="question-text">載入中...</div>
                <div id="options-container"></div>

                <div id="explanation-box" class="explanation hidden">
                    <strong style="color: #38bdf8; display: block; margin-bottom: 5px;">📖 解析 (Explanation):</strong>
                    <p id="explanation-text" style="margin: 0;"></p>
                </div>

                <div class="footer-nav">
                    <button id="prev-btn" class="nav-btn" onclick="prevQuestion()">上一題</button>
                    <button id="next-btn" class="nav-btn primary-btn" onclick="nextQuestion()">下一題</button>
                </div>
            </div>

            <!-- 結算畫面 -->
            <div id="result-container" class="result-box hidden">
                <h2 style="font-size: 28px; color: #38bdf8; margin-bottom: 10px;">🎉 章節測驗完成！</h2>
                <p style="color: var(--text-muted); margin-bottom: 20px;">您已完成本章節所有題目的作答。</p>
                
                <div class="result-card">
                    <div class="stat-item">
                        <span class="stat-val" id="res-score">0</span>
                        <span class="stat-lbl">答對題數</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-val" id="res-total">33</span>
                        <span class="stat-lbl">總題數</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-val" id="res-rate">0%</span>
                        <span class="stat-lbl">正確率</span>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; justify-content: center; margin-top: 25px;">
                    <button class="nav-btn primary-btn" onclick="restartQuiz()">重新測驗本章</button>
                    <button id="review-wrong-btn" class="nav-btn hidden" style="background-color: #dc2626;" onclick="startWrongReview()">錯題重練 (<span id="wrong-count">0</span>)</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 完整的雙章節題庫資料
        const allQuestionBanks = {
            "M05-01": {
                code: "Module 05.01",
                name: "Electronic Instrument Systems",
                questions: [
                    { id: "M05-01", question: "1. What are the basic elements for 'Classic T' format?", options: ["A. Direction, altitude and height.", "B. Airspeed, pitch and roll.", "C. Airspeed, attitude, altitude and direction."], answer: "C", explanation: "Classic T 的四大基本儀表核心元素為：Airspeed (空速)、Attitude (姿態)、Altitude (高度) 與 Direction (方向)。" },
                    { id: "M05-02", question: "2. Typical displays on an EHSI are.", options: ["A. Engine indications.", "B. VOR, Map, Plan and weather radar.", "C. VOR, Plan, Map and Attitude."], answer: "B", explanation: "EHSI 典型顯示包含 VOR、Map、Plan 及氣象雷達 (weather radar)。" },
                    { id: "M05-03", question: "3. An EADI display showing a moving runway moves down during the final stages of an approach. The aircraft must.", options: ["A. fly down.", "B. fly up.", "C. hold descent path."], answer: "A", explanation: "在進場最後階段上升跑道會向上移直到觸及飛機符號。若上升跑道開始向下移，代表飛機正在爬升，因此必須向下飛行。" },
                    { id: "M05-04", question: "4. During an instrument approach, the glideslope pointer reflects below the glideslope centre mark. This means the aircraft is positioned.", options: ["A. above the glideslope.", "B. below the glideslope.", "C. to the left of the localiser."], answer: "A", explanation: "指針在中心標記下方，代表滑道在飛機下方，也就是飛機位於滑道上方。" },
                    { id: "M05-05", question: "5. Engine parameters are displayed on.", options: ["A. ECAM.", "B. EHSI.", "C. FMSCDU."], answer: "A", explanation: "引擎參數可以透過選取 Engine 頁面顯示在 ECAM 上。" },
                    { id: "M05-06", question: "6. What is the fixed feature of an ADI?", options: ["A. The glideslope pointer.", "B. The aircraft symbol.", "C. The lateral deviation bar."], answer: "B", explanation: "ADI 儀表正中央繪製的小飛機符號為固定特徵。" },
                    { id: "M05-07", question: "7. On an EADI, the Flight Director command bars show.", options: ["A. the path with respect to the horizon.", "B. the required path with respect to the actual path.", "C. the actual path with respect to the required path."], answer: "B", explanation: "飛行導引指令桿顯示的是相對於實際飛行路徑的需求路徑。" },
                    { id: "M05-08", question: "8. What instrument includes a display of a rising runway?", options: ["A. ECAM.", "B. EHSI.", "C. EADI."], answer: "C", explanation: "上升跑道顯示於 EADI（電子姿態儀指示器）上。" },
                    { id: "M05-09", question: "9. What functions are available on the EHSI?", options: ["A. Full arc and Wx only.", "B. Full arc, Wx and Map Mode.", "C. Full Arc only."], answer: "B", explanation: "EHSI 提供 Full arc、Wx 及 Map Mode 等顯示功能。" },
                    { id: "M05-10", question: "10. With radio coupled autopilot, what are the inputs?", options: ["A. ADF and VOR.", "B. ILS and VOR.", "C. ADF and ILS."], answer: "B", explanation: "無線電耦合自動駕駛儀主要接收 ILS 與 VOR 訊號輸入。" },
                    { id: "M05-11", question: "11. An EADI display of flight director commands are coloured.", options: ["A. cyan.", "B. magenta.", "C. red."], answer: "B", explanation: "EADI 飛行導引指令桿顏色為洋紅色 (magenta)。" },
                    { id: "M05-12", question: "12. EFIS systems have two control panels, their purpose is.", options: ["A. one to control the type of EFIS display and the other to select the source of the information being displayed.", "B. one for the EADI display and one for the EHSI display.", "C. to provide display control by one control panel whilst the other provides a standby."], answer: "A", explanation: "一個控制面板控制顯示類型，另一個選擇資訊來源。" },
                    { id: "M05-13", question: "13. What would you expect to see displayed on an EADI display?", options: ["A. Compass heading, selected heading and VOR.", "B. Course information, weather radar, way point alert and bearing pointers.", "C. Flight director command bars, slip indicator, rate to altitude & autoland."], answer: "C", explanation: "EADI 顯示飛行導引指令桿、側滑指示器、高度速率及自動降落等資訊。" },
                    { id: "M05-14", question: "14. An EFIS ADI display will show along with pitch and roll.", options: ["A. flight director bars, autoland, compass rose, altitude.", "B. decision height, autoland, rad alt , altitude.", "C. flight director bars, autoland, altitude, range to altitude, decision height."], answer: "B", explanation: "EFIS ADI 除俯仰與滾轉外，還會顯示決斷高度、自動降落、無線電高度與高度。" },
                    { id: "M05-15", question: "15. If the glideslope pointer is below the centre mark the aircraft is.", options: ["A. below the glideslope.", "B. on the glideslope.", "C. above the glideslope."], answer: "C", explanation: "滑道指針在中心標記下方時，代表飛機位於滑道上方。" },
                    { id: "M05-16", question: "16. On an EFIS system the weather radar is displayed on.", options: ["A. the FMC CDU.", "B. the EADI.", "C. the EHSI."], answer: "C", explanation: "氣象雷達顯示於 EHSI 上。" },
                    { id: "M05-17", question: "17. EADI displays show.", options: ["A. pitch, roll and waypoints.", "B. pitch and roll attitudes.", "C. heading and weather radar."], answer: "B", explanation: "EADI 主要顯示俯仰與滾轉姿態。" },
                    { id: "M05-18", question: "18. On an EHSI in weather radar mode, a severe storm would be shown as.", options: ["A. orange areas with black or yellow surrounds.", "B. red areas with black surrounds", "C. blue areas with white background."], answer: "B", explanation: "劇烈風暴在氣象雷達模式中以紅色區域帶有黑色外框表示。" },
                    { id: "M05-19", question: "19. During flight (non fault conditions) the EICAS system displays on the lower CRT.", options: ["A. flight phase page.", "B. secondary engine parameters.", "C. synoptic display."], answer: "B", explanation: "在正常飛行條件下，EICAS 下方 CRT 螢幕顯示次要引擎參數。" },
                    { id: "M05-20", question: "20. Radio altitude is displayed on an EFIS system.", options: ["A. on the Electronic Horizontal Situation Indicator.", "B. on the Electronic Attitude Direction Indicator.", "C. on the RMI."], answer: "B", explanation: "無線電高度顯示在電子姿態儀指示器 (EADI) 上。" },
                    { id: "M05-21", question: "21. An EFIS system ADI displays pitch, roll.", options: ["A. autoland, altitude, compass rose and flight director bars.", "B. autoland, decision height, range to altitude and flight director bars and slip indicator.", "C. autoland, rad alt, decision height and slip indicator."], answer: "B", explanation: "EFIS ADI 顯示自動降落、決斷高度、高度範圍、飛行導引指令桿與側滑指示器。" },
                    { id: "M05-22", question: "22. An electronic flight instrument display consists of.", options: ["A. Mode control panel, Raster and Stroke generator display, microprocessor and Data inputs.", "B. ADC, Altimeter, VSI and ASI.", "C. ADI, HSI and Symbol generator."], answer: "A", explanation: "電子飛行儀表顯示系統包含模式控制面板、光柵與筆劃產生器顯示器、微處理器及資料輸入。" },
                    { id: "M05-23", question: "23. The EFIS system consists of.", options: ["A. EHSI, Mode control panel, EADI.", "B. EADI, EHSI, Symbol generators.", "C. Mode control Panel, RDMI, EHSI."], answer: "B", explanation: "EFIS 系統由 EADI、EHSI 以及符號產生器組成。" },
                    { id: "M05-24", question: "24. ILS indications on PFD/ND are shown in.", options: ["A. cyan.", "B. magenta.", "C. green."], answer: "B", explanation: "PFD/ND 上的 ILS 導引指示以洋紅色顯示。" },
                    { id: "M05-25", question: "25. A weather radar image can be displayed on the ND on all modes except.", options: ["A. arc.", "B. nav rose.", "C. plan."], answer: "C", explanation: "氣象雷達影像可以顯示在導航顯示器的多種模式，但不適用於 Plan 模式。" },
                    { id: "M05-26", question: "26. In a typical commercial aircraft Head Up Guidance System.", options: ["A. the type of information shown on the attitude director indicator is displayed on a transparent plate.", "B. all instrument information is displayed on the windshield.", "C. only emergency indications or warnings are displayed to the pilot."], answer: "A", explanation: "平視導引系統將姿態儀資訊投射顯示在正前方的透明板上。" },
                    { id: "M05-27", question: "27. A modern Electronic Horizontal Situation Indicator will display the following:.", options: ["A. Waypoints, ILS Steering Information, Distance to go and Magnetic Heading.", "B. ILS Steering Information, Flight director information and Glide Slope Deviation.", "C. Ground speed, Magnetic Heading, Way points and Localiser."], answer: "A", explanation: "現代 EHSI 顯示航點、ILS 導引資訊、剩餘距離與磁航向。" },
                    { id: "M05-28", question: "28. Cockpit panels have a matt colour finish. The purpose is.", options: ["A. so that pilots feel more comfortable during daytime.", "B. so that the amount of glare is reduced to minimum.", "C. so that dust and dirt are less evident on panels."], answer: "B", explanation: "駕駛艙面板採用消光處理是為了將反光降至最低。" },
                    { id: "M05-29", question: "29. A complete EFIS installation in an aircraft is made up of.", options: ["A. either of the above.", "B. right (captain) and left (co-pilot).", "C. left (captain) and right (co-pilot)."], answer: "A", explanation: "左右座配置因機型而異，視具體安裝而定。" },
                    { id: "M05-30", question: "30. On a modern 'glass cockpit' aircraft, engine information will be displayed on.", options: ["A. FMS.", "B. EFIS.", "C. ECAM."], answer: "C", explanation: "在現代玻璃座艙飛機中，引擎資訊顯示在 ECAM 上。" },
                    { id: "M05-31", question: "31. What does EFIS mean?", options: ["A. Electronic Fire Indication Signal.", "B. Electronic Flight Instrument System.", "C. Electronic Flight Information System."], answer: "B", explanation: "EFIS 全稱為 Electronic Flight Instrument System。" },
                    { id: "M05-32", question: "32. What does EICAS mean?", options: ["A. Electronic indicator and control alerting system.", "B. Engine indicating and Crew alerting system.", "C. Electronic indicator and crew alerting system."], answer: "B", explanation: "EICAS 全稱為 Engine indicating and Crew alerting system。" },
                    { id: "M05-33", question: "33. What does ECAM mean?", options: ["A. Engine Centralised Aircraft Management System.", "B. Engine Centralised Aircraft Monitoring System.", "C. Electronic Centralised Aircraft Monitoring System."], answer: "C", explanation: "ECAM 全稱為 Electronic Centralised Aircraft Monitoring System。" }
                ]
            },
            "M05-02": {
                code: "Module 05.02",
                name: "Numbering Systems",
                questions: [
                    { id: "M05-02-01", question: "1. Convert 011101 Base2 to octal.", options: ["a) 25.", "b) 35.", "c) 33."], answer: "b", explanation: "Divide binary into groups of three from right: 011 (3) and 101 (5) -> 35 octal." },
                    { id: "M05-02-02", question: "2. The binary number 11010111 expressed as a decimal is.", options: ["a) 215.", "b) 223.", "c) 207."], answer: "a", explanation: "128 + 64 + 16 + 4 + 2 + 1 = 215." },
                    { id: "M05-02-03", question: "3. The octal number 1001 expressed as a decimal is.", options: ["a) 9.", "b) 65.", "c) 513."], answer: "c", explanation: "512 + 1 = 513." },
                    { id: "M05-02-04", question: "4. What is 345 in binary?", options: ["a) 100111001.", "b) 101011001.", "c) 110011001."], answer: "b", explanation: "Decimal 345 converted to binary is 101011001." },
                    { id: "M05-02-05", question: "5. What is hex 110 in decimal?", options: ["a) 282.", "b) 272.", "c) 32."], answer: "b", explanation: "256 + 16 = 272." },
                    { id: "M05-02-06", question: "6. Convert the binary word 1100 to decimal.", options: ["a) 11.", "b) 16.", "c) 12."], answer: "c", explanation: "8 + 4 = 12." },
                    { id: "M05-02-07", question: "7. If a data message is made up of 1s and 0s, it is.", options: ["a) analogue.", "b) binary.", "c) digital."], answer: "c", explanation: "Digital is 1s and 0s, either binary or grey code." },
                    { id: "M05-02-08", question: "8. Convert the binary word 1110 to decimal.", options: ["a) 12.", "b) 14.", "c) 15."], answer: "b", explanation: "8 + 4 + 2 = 14." },
                    { id: "M05-02-09", question: "9. Convert the binary number 110010 to decimal.", options: ["a) 80.", "b) 50.", "c) 34."], answer: "b", explanation: "32 + 16 + 2 = 50." },

        // 應用程式狀態
        let currentModuleKey = "M05-01";
        let currentIndex = 0;
        let score = 0;
        let isReviewMode = false;
        let activeQuestions = [];
        let userAnswers = {};
        let wrongQuestionIndices = [];

        // 初始化狀態
        function initQuizState() {
            for (let key in allQuestionBanks) {
                userAnswers[key] = new Array(allQuestionBanks[key].questions.length).fill(null);
            }
        }
        initQuizState();

        // 渲染側邊欄章節按鈕
        function renderSidebar() {
            const sidebar = document.getElementById("sidebar-modules");
            sidebar.innerHTML = "";
            for (let key in allQuestionBanks) {
                const mod = allQuestionBanks[key];
                const btn = document.createElement("button");
                btn.className = `module-btn ${key === currentModuleKey && !isReviewMode ? 'active' : ''}`;
                btn.onclick = () => switchModule(key);
                btn.innerHTML = `
                    <span class="mod-code">${mod.code}</span>
                    <span class="mod-name">${mod.name}</span>
                `;
                sidebar.appendChild(btn);
            }
        }

        // 切換章節
        function switchModule(key) {
            currentModuleKey = key;
            isReviewMode = false;
            currentIndex = 0;
            activeQuestions = allQuestionBanks[currentModuleKey].questions;
            
            renderSidebar();
            document.getElementById("mode-indicator").textContent = "一般測驗模式";
            document.getElementById("quiz-container").classList.remove("hidden");
            document.getElementById("result-container").classList.add("hidden");
            
            loadQuestion();
        }

        // 載入題目
        function loadQuestion() {
            const q = activeQuestions[currentIndex];
            const mod = allQuestionBanks[currentModuleKey];
            const currentAnswers = userAnswers[currentModuleKey];

            document.getElementById("mod-badge").textContent = mod.code;
            document.getElementById("mod-title").textContent = mod.name;
            document.getElementById("current-idx").textContent = currentIndex + 1;
            document.getElementById("total-cnt").textContent = activeQuestions.length;
            
            // 計算進度條
            const progressPercent = ((currentIndex) / activeQuestions.length) * 100;
            document.getElementById("progress-bar").style.width = `${progressPercent}%`;

            // 即時計算目前分數
            let currentLiveScore = 0;
            activeQuestions.forEach((item, idx) => {
                if (currentAnswers[idx] === item.answer.toLowerCase()) currentLiveScore++;
            });
            document.getElementById("live-score").textContent = currentLiveScore;

            document.getElementById("question-text").textContent = q.question;
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            q.options.forEach((opt) => {
                const optionLetter = opt.charAt(0).toLowerCase();
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt;

                if (currentAnswers[currentIndex] !== null) {
                    btn.disabled = true;
                    if (optionLetter === q.answer.toLowerCase()) {
                        btn.classList.add("correct");
                    } else if (optionLetter === currentAnswers[currentIndex]) {
                        btn.classList.add("wrong");
                    }
                } else {
                    btn.onclick = () => selectOption(optionLetter, q.answer.toLowerCase());
                }
                optionsContainer.appendChild(btn);
            });

            const explanationBox = document.getElementById("explanation-box");
            if (currentAnswers[currentIndex] !== null) {
                document.getElementById("explanation-text").textContent = q.explanation || "暫無解析說明。";
                explanationBox.classList.remove("hidden");
            } else {
                explanationBox.classList.add("hidden");
            }

            document.getElementById("prev-btn").disabled = currentIndex === 0;
            document.getElementById("next-btn").textContent = currentIndex === activeQuestions.length - 1 ? "查看成績" : "下一題";
        }

        function selectOption(selected, correct) {
            userAnswers[currentModuleKey][currentIndex] = selected;
            loadQuestion();
        }

        function nextQuestion() {
            if (currentIndex < activeQuestions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        // 顯示結算成績
        function showResults() {
            document.getElementById("progress-bar").style.width = `100%`;
            document.getElementById("quiz-container").classList.add("hidden");
            document.getElementById("result-container").classList.remove("hidden");

            const currentAnswers = userAnswers[currentModuleKey];
            let correctCount = 0;
            wrongQuestionIndices = [];

            activeQuestions.forEach((q, idx) => {
                if (currentAnswers[idx] === q.answer.toLowerCase()) {
                    correctCount++;
                } else {
                    wrongQuestionIndices.push(idx);
                }
            });

            const total = activeQuestions.length;
            const rate = Math.round((correctCount / total) * 100);

            document.getElementById("res-score").textContent = correctCount;
            document.getElementById("res-total").textContent = total;
            document.getElementById("res-rate").textContent = `${rate}%`;

            const reviewBtn = document.getElementById("review-wrong-btn");
            if (wrongQuestionIndices.length > 0) {
                reviewBtn.classList.remove("hidden");
                document.getElementById("wrong-count").textContent = wrongQuestionIndices.length;
            } else {
                reviewBtn.classList.add("hidden");
            }
        }

        function restartQuiz() {
            userAnswers[currentModuleKey] = new Array(allQuestionBanks[currentModuleKey].questions.length).fill(null);
            isReviewMode = false;
            currentIndex = 0;
            activeQuestions = allQuestionBanks[currentModuleKey].questions;
            
            document.getElementById("mode-indicator").textContent = "一般測驗模式";
            document.getElementById("quiz-container").classList.remove("hidden");
            document.getElementById("result-container").classList.add("hidden");
            loadQuestion();
        }

        // 啟動錯題重練模式
        function startWrongReview() {
            if (wrongQuestionIndices.length === 0) return;
            isReviewMode = true;
            // 僅篩選出答錯的題目
            activeQuestions = wrongQuestionIndices.map(idx => allQuestionBanks[currentModuleKey].questions[idx]);
            // 為錯題建立暫時的作答記錄
            userAnswers["REVIEW"] = new Array(activeQuestions.length).fill(null);
            
            // 暫時替換當前回答指標到 REVIEW 空間
            currentModuleKey_backup = currentModuleKey;
            // 這裡我們直接用一個獨立的 reviewAnswers 陣列來處理錯題
            window.reviewAnswers = new Array(activeQuestions.length).fill(null);
            
            // 覆寫部分行為來支援錯題模式
            currentIndex = 0;
            document.getElementById("mode-indicator").textContent = "🔴 錯題重練模式";
            document.getElementById("quiz-container").classList.remove("hidden");
            document.getElementById("result-container").classList.add("hidden");
            
            loadReviewQuestion();
        }

        function loadReviewQuestion() {
            const q = activeQuestions[currentIndex];
            const mod = allQuestionBanks[currentModuleKey];

            document.getElementById("mod-badge").textContent = "錯題特訓";
            document.getElementById("current-idx").textContent = currentIndex + 1;
            document.getElementById("total-cnt").textContent = activeQuestions.length;
            document.getElementById("progress-bar").style.width = `${((currentIndex) / activeQuestions.length) * 100}%`;

            document.getElementById("question-text").textContent = q.question;
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            q.options.forEach((opt) => {
                const optionLetter = opt.charAt(0).toLowerCase();
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt;

                if (window.reviewAnswers[currentIndex] !== null) {
                    btn.disabled = true;
                    if (optionLetter === q.answer.toLowerCase()) {
                        btn.classList.add("correct");
                    } else if (optionLetter === window.reviewAnswers[currentIndex]) {
                        btn.classList.add("wrong");
                    }
                } else {
                    btn.onclick = () => {
                        window.reviewAnswers[currentIndex] = optionLetter;
                        loadReviewQuestion();
                    };
                }
                optionsContainer.appendChild(btn);
            });

            const explanationBox = document.getElementById("explanation-box");
            if (window.reviewAnswers[currentIndex] !== null) {
                document.getElementById("explanation-text").textContent = q.explanation || "暫無解析說明。";
                explanationBox.classList.remove("hidden");
            } else {
                explanationBox.classList.add("hidden");
            }

            document.getElementById("prev-btn").disabled = currentIndex === 0;
            document.getElementById("next-btn").textContent = currentIndex === activeQuestions.length - 1 ? "完成特訓" : "下一題";
            
            // 覆寫下一步按鈕行為給錯題模式
            document.getElementById("next-btn").onclick = () => {
                if (currentIndex < activeQuestions.length - 1) {
                    currentIndex++;
                    loadReviewQuestion();
                } else {
                    switchModule(currentModuleKey); // 返回原本章節
                }
            };
        }

        // 初始化執行
        activeQuestions = allQuestionBanks[currentModuleKey].questions;
        renderSidebar();
        loadQuestion();
    </script>
