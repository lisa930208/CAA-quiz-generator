    <!-- 題庫與主程式邏輯 -->
    <script>
        const allQuestionBanks = {
            "M05-01": {
                title: "Electronic Instrument Systems",
                questions: [
                    { id: "M05-01", question: "1. What are the basic elements for 'Classic T' format?", options: ["A. Direction, altitude and height.", "B. Airspeed, pitch and roll.", "C. Airspeed, attitude, altitude and direction."], answer: "C", explanation: "Classic T 的四大基本儀表核心元素為：Airspeed (空速)、Attitude (姿態)、Altitude (高度) 與 Direction (方向)。" },
                    { id: "M05-02", question: "2. Typical displays on an EHSI are.", options: ["A. Engine indications.", "B. VOR, Map, Plan and weather radar.", "C. VOR, Plan, Map and Attitude."], answer: "B", explanation: "EHSI 典型顯示包含 VOR、Map、Plan 及氣象雷達 (weather radar)。" },
                    { id: "M05-03", question: "3. An EADI display showing a moving runway moves down during the final stages of an approach. The aircraft must.", options: ["A. fly down.", "B. fly up.", "C. hold descent path."], answer: "A", explanation: "在進場最後階段上升跑道會向上移直到觸及飛機符號。若上升跑道開始向下移，代表飛機正在爬升，因此必須向下飛行。" },
                    { id: "M05-04", question: "4. During an instrument approach, the glideslope pointer reflects below the glideslope centre mark. This means the aircraft is positioned.", options: ["A. above the glideslope.", "B. below the glideslope.", "C. to the left of the localiser."], answer: "A", explanation: "指針在中心標記下方，代表滑道在飛機下方，也就是飛機位於滑道上方。" },
                    { id: "M05-05", question: "5. Engine parameters are displayed on.", options: ["A. ECAM.", "B. EHSI.", "C. FMSCDU."], answer: "A", explanation: "引擎參數可以透過選取 Engine 頁面顯示在 ECAM 上。" },
                    { id: "M05-06", question: "6. What is the fixed feature of an ADI?", options: ["A. The glideslope pointer.", "B. The aircraft symbol.", "C. The lateral deviation bar."], answer: "B", explanation: "ADI 儀表正中央繪製的小飛機符號為固定特徵。" },
                    { id: "M05-07", question: "7. On an EADI, the Flight Director command bars show.", options: ["A. the path with respect to the horizon.", "B. the required path with respect to the actual path.", "C. the actual path with respect to the required path."], answer: "B", explanation: "飛行導引指令桿顯示的是相對於實際飛行路徑的需求路徑。" },
                    { id: "M05-08", question: "8. What instrument includes a display of a rising runway?", options: ["A. ECAM.", "B. EHSI.", "C. EADI."], answer: "C", explanation: "上升跑道顯示於 EADI（電子姿態儀指示器）上。" },
                    { id: "M05-09", question: "9. What functions are available on the EHSI?", options: ["A. Full arc and Wx only.", "B. Full arc, Wx and Map Mode.", "C. Full Arc only."], answer: "B", explanation: "EHSI 提供 Full arc、Wx 及 Map Mode 等顯示功能。" },
                    { id: "M05-10", question: "10. With radio coupled autopilot, what are the inputs?", options: ["A. ADF and VOR.", "B. ILS and VOR.", "C. ADF and ILS."], answer: "B", explanation: "無線電耦合自動駕駛儀主要接收 ILS 與 VOR 訊號輸入。" },
                    { id: "M05-11", question: "11. An EADI display of flight director commands are coloured.", options: ["A. cyan.", "B. magenta.", "C. red."], answer: "B", explanation: "EADI 飛行導引指令桿顏色為洋紅色 (magenta)。" },
                    { id: "M05-12", question: "12. EFIS systems have two control panels, their purpose is.", options: ["A. one to control the type of EFIS display and the other to select the source of the information being displayed.", "B. one for the EADI display and one for the EHSI display.", "C. to provide display control by one control panel whilst the other provides a standby."], answer: "A", explanation: "一個控制面板控制顯示類型，另一個選擇資訊來源。" },
                    { id: "M05-13", question: "13. What would you expect to see displayed on an EADI display?", options: ["A. Compass heading, selected heading and VOR.", "B. Course information, weather radar, way point alert and bearing pointers.", "C. Flight director command bars, slip indicator, rate to altitude & autoland."], answer: "C", explanation: "EADI 顯示飛行導引指令桿、側滑指示器、高度速率及自動降落等資訊。" },
                    { id: "M05-14", question: "14. An EFIS ADI display will show along with pitch and roll.", options: ["A. flight director bars, autoland, compass rose, altitude.", "B. decision height, autoland, rad alt , altitude.", "C. flight director bars, autoland, altitude, range to altitude, decision height."], answer: "B", explanation: "EFIS ADI 除俯仰與滾轉外，還會顯示決斷高度、自動降落、無線電高度與高度。" },
                    { id: "M05-15", question: "15. If the glideslope pointer is below the centre mark the aircraft is.", options: ["A. below the glideslope.", "B. on the glideslope.", "C. above the glideslope."], answer: "C", explanation: "滑道指針在中心標記下方時，代表飛機位於滑道上方。" },
                    { id: "M05-16", question: "16. On an EFIS system the weather radar is displayed on.", options: ["A. the FMC CDU.", "B. the EADI.", "C. the EHSI."], answer: "C", explanation: "氣象雷達顯示於 EHSI 上。" },
                    { id: "M05-17", question: "17. EADI displays show.", options: ["A. pitch, roll and waypoints.", "B. pitch and roll attitudes.", "C. heading and weather radar."], answer: "B", explanation: "EADI 主要顯示俯仰與滾轉姿態。" },
                    { id: "M05-18", question: "18. On an EHSI in weather radar mode, a severe storm would be shown as.", options: ["A. orange areas with black or yellow surrounds.", "B. red areas with black surrounds", "C. blue areas with white background."], answer: "B", explanation: "劇烈風暴在氣象雷達模式中以紅色區域帶有黑色外框表示。" },
                    { id: "M05-19", question: "19. During flight (non fault conditions) the EICAS system displays on the lower CRT.", options: ["A. flight phase page.", "B. secondary engine parameters.", "C. synoptic display."], answer: "B", explanation: "在正常飛行條件下，EICAS 下方 CRT 螢幕顯示次要引擎參數。" },
                    { id: "M05-20", question: "20. Radio altitude is displayed on an EFIS system.", options: ["A. on the Electronic Horizontal Situation Indicator.", "B. on the Electronic Attitude Direction Indicator.", "C. on the RMI."], answer: "B", explanation: "無線電高度顯示在電子姿態儀指示器 (EADI) 上。" },
                    { id: "M05-21", question: "21. An EFIS system ADI displays pitch, roll.", options: ["A. autoland, altitude, compass rose and flight director bars.", "B. autoland, decision height, range to altitude and flight director bars and slip indicator.", "C. autoland, rad alt, decision height and slip indicator."], answer: "B", explanation: "EFIS ADI 顯示自動降落、決斷高度、高度範圍、飛行導引指令桿與側滑指示器。" },
                    { id: "M05-22", question: "22. An electronic flight instrument display consists of.", options: ["A. Mode control panel, Raster and Stroke generator display, microprocessor and Data inputs.", "B. ADC, Altimeter, VSI and ASI.", "C. ADI, HSI and Symbol generator."], answer: "A", explanation: "電子飛行儀表顯示系統包含模式控制面板、光柵與筆劃產生器顯示器、微處理器及資料輸入。" },
                    { id: "M05-23", question: "23. The EFIS system consists of.", options: ["A. EHSI, Mode control panel, EADI.", "B. EADI, EHSI, Symbol generators.", "C. Mode control Panel, RDMI, EHSI."], answer: "B", explanation: "EFIS 系統由 EADI、EHSI 以及符號產生器組成。" },
                    { id: "M05-24", question: "24. ILS indications on PFD/ND are shown in.", options: ["A. cyan.", "B. magenta.", "C. green."], answer: "B", explanation: "PFD/ND 上的 ILS 導引指示以洋紅色顯示。" },
                    { id: "M05-25", question: "25. A weather radar image can be displayed on the ND on all modes except.", options: ["A. arc.", "B. nav rose.", "C. plan."], answer: "C", explanation: "氣象雷達影像可以顯示在導航顯示器的多種模式，但不適用於 Plan 模式。" },
                    { id: "M05-26", question: "26. In a typical commercial aircraft Head Up Guidance System.", options: ["A. the type of information shown on the attitude director indicator is displayed on a transparent plate.", "B. all instrument information is displayed on the windshield.", "C. only emergency indications or warnings are displayed to the pilot."], answer: "A", explanation: "平視導引系統將姿態儀資訊投射顯示在正前方的透明板上。" },
                    { id: "M05-27", question: "27. A modern Electronic Horizontal Situation Indicator will display the following:.", options: ["A. Waypoints, ILS Steering Information, Distance to go and Magnetic Heading.", "B. ILS Steering Information, Flight director information and Glide Slope Deviation.", "C. Ground speed, Magnetic Heading, Way points and Localiser."], answer: "A", explanation: "現代 EHSI 顯示航點、ILS 導引資訊、剩餘距離與磁航向。" },
                    { id: "M05-28", question: "28. Cockpit panels have a matt colour finish. The purpose is.", options: ["A. so that pilots feel more comfortable during daytime.", "B. so that the amount of glare is reduced to minimum.", "C. so that dust and dirt are less evident on panels."], answer: "B", explanation: "駕駛艙面板採用消光處理是為了將反光降至最低。" },
                    { id: "M05-29", question: "29. A complete EFIS installation in an aircraft is made up of.", options: ["A. either of the above.", "B. right (captain) and left (co-pilot).", "C. left (captain) and right (co-pilot)."], answer: "A", explanation: "左右座配置因機型而異，視具體安裝而定。" },
                    { id: "M05-30", question: "30. On a modern 'glass cockpit' aircraft, engine information will be displayed on.", options: ["A. FMS.", "B. EFIS.", "C. ECAM."], answer: "C", explanation: "在現代玻璃座艙飛機中，引擎資訊顯示在 ECAM 上。" },
                    { id: "M05-31", question: "31. What does EFIS mean?", options: ["A. Electronic Fire Indication Signal.", "B. Electronic Flight Instrument System.", "C. Electronic Flight Information System."], answer: "B", explanation: "EFIS 全稱為 Electronic Flight Instrument System。" },
                    { id: "M05-32", question: "32. What does EICAS mean?", options: ["A. Electronic indicator and control alerting system.", "B. Engine indicating and Crew alerting system.", "C. Electronic indicator and crew alerting system."], answer: "B", explanation: "EICAS 全稱為 Engine indicating and Crew alerting system。" },
                    { id: "M05-33", question: "33. What does ECAM mean?", options: ["A. Engine Centralised Aircraft Management System.", "B. Engine Centralised Aircraft Monitoring System.", "C. Electronic Centralised Aircraft Monitoring System."], answer: "C", explanation: "ECAM 全稱為 Electronic Centralised Aircraft Monitoring System。" }
                ]
            },
            "M05-02": {
                title: "Numbering Systems",
                questions: [
                    { id: "M05-02-01", question: "1. Convert 011101 Base2 to octal.", options: ["a) 25.", "b) 35.", "c) 33."], answer: "b", explanation: "The OCTAL code has 8 digits, 0 - 7. To convert binary to octal divide the binary number into groups of three starting from the right." },
                    { id: "M05-02-02", question: "2. The binary number 11010111 expressed as a decimal is.", options: ["a) 215.", "b) 223.", "c) 207."], answer: "a", explanation: "Convert binary 11010111 to decimal: 128 + 64 + 16 + 4 + 2 + 1 = 215." },
                    { id: "M05-02-03", question: "3. The octal number 1001 expressed as a decimal is.", options: ["a) 9.", "b) 65.", "c) 513."], answer: "c", explanation: "Octal 1001 = (1 * 8^3) + (0 * 8^2) + (0 * 8^1) + (1 * 8^0) = 512 + 1 = 513." },
                    { id: "M05-02-04", question: "4. What is 345 in binary?", options: ["a) 100111001.", "b) 101011001.", "c) 110011001."], answer: "b", explanation: "Decimal 345 converted to binary is 101011001." },
                    { id: "M05-02-05", question: "5. What is hex 110 in decimal?", options: ["a) 282.", "b) 272.", "c) 32."], answer: "b", explanation: "Hex 110 = (1 * 256) + (1 * 16) + (0 * 1) = 256 + 16 = 272." },
                    { id: "M05-02-06", question: "6. Convert the binary word 1100 to decimal.", options: ["a) 11.", "b) 16.", "c) 12."], answer: "c", explanation: "Binary 1100 = 8 + 4 = 12." },
                    { id: "M05-02-07", question: "7. If a data message is made up of 1s and 0s, it is.", options: ["a) analogue.", "b) binary.", "c) digital."], answer: "c", explanation: "Digital is 1s and 0s, either binary or grey code." },
                    { id: "M05-02-08", question: "8. Convert the binary word 1110 to decimal.", options: ["a) 12.", "b) 14.", "c) 15."], answer: "b", explanation: "Binary 1110 = 8 + 4 + 2 = 14." },
                    { id: "M05-02-09", question: "9. Convert the binary number 110010 to decimal.", options: ["a) 80.", "b) 50.", "c) 34."], answer: "b", explanation: "Binary 110010 = 32 + 16 + 2 = 50." },
                    { id: "M05-02-10", question: "10. Convert the hexadecimal number D into decimal.", options: ["a) 13.", "b) 15.", "c) 14."], answer: "a", explanation: "Hex D represents decimal 13." },
                    { id: "M05-02-11", question: "11. Convert decimal 15 into binary.", options: ["a) 1111.", "b) 1101.", "c) 1110."], answer: "a", explanation: "Decimal 15 = 8 + 4 + 2 + 1 = 1111 in binary." },
                    { id: "M05-02-12", question: "12. Convert 448 to hex.", options: ["a) 22 Base16.", "b) 36 Base16.", "c) 24 Base16."], answer: "c", explanation: "448 in decimal converted to hex is 24 Base16." },
                    { id: "M05-02-13", question: "13. Convert decimal 15 into hexadecimal.", options: ["a) G.", "b) E.", "c) F."], answer: "c", explanation: "Decimal 15 is represented as F in hexadecimal." },
                    { id: "M05-02-14", question: "14. What is 345 in binary?", options: ["a) 100111001.", "b) 110011001.", "c) 101011001."], answer: "c", explanation: "Decimal 345 converted to binary is 101011001." },
                    { id: "M05-02-15", question: "15. Convert 1D to binary.", options: ["a) 11101.", "b) 29.", "c) 101001."], answer: "a", explanation: "Hex 1 = 0001, Hex D (13) = 1101, combined as 11101." },
                    { id: "M05-02-16", question: "16. Convert 2C hex to octal.", options: ["a) 35.", "b) 44.", "c) 54."], answer: "c", explanation: "Hex 2C = 44 decimal = 54 octal." },
                    { id: "M05-02-17", question: "17. A hexadecimal is a number to base.", options: ["a) 2.", "b) 16.", "c) 8."], answer: "b", explanation: "Hexadecimal is a base-16 number system." },
                    { id: "M05-02-18", question: "18. 1012 converted to decimal is.", options: ["a) 52.", "b) 210.", "c) 510."], answer: "c", explanation: "101 Base 2 = 5." },
                    { id: "M05-02-19", question: "19. The binary coded decimal number 10011000 expressed as a decimal number is.", options: ["a) 1528.", "b) 9810.", "c) 1522."], answer: "b", explanation: "BCD 1001 = 9, 1000 = 8, representing 98." },
                    { id: "M05-02-20", question: "20. The decimal number 7 expressed as a binary number is.", options: ["a) 101 Base 2.", "b) 111 Base 2.", "c) 7 Base 2."], answer: "b", explanation: "Decimal 7 in binary is 111." },
                    { id: "M05-02-21", question: "21. Convert 011101 binary to octal.", options: ["a) 25.", "b) 35.", "c) 33."], answer: "b", explanation: "Group into 011 (3) and 101 (5), giving 35 octal." },
                    { id: "M05-02-22", question: "22. Binary Number: 110010 is.", options: ["a) 80.", "b) 50.", "c) 34."], answer: "b", explanation: "Binary 110010 = 32 + 16 + 2 = 50." },
                    { id: "M05-02-23", question: "23. Binary addition of 1101 + 101101 is.", options: ["a) 58.", "b) 70.", "c) 61."], answer: "a", explanation: "13 + 45 = 58 in decimal." },
                    { id: "M05-02-24", question: "24. The binary number 11010111 is expressed as a decimal is.", options: ["a) 107.", "b) 215.", "c) 53."], answer: "b", explanation: "128 + 64 + 16 + 4 + 2 + 1 = 215." },
                    { id: "M05-02-25", question: "25. The octal number 1001 expressed as a decimal is.", options: ["a) 713.", "b) 613.", "c) 513."], answer: "c", explanation: "512 + 1 = 513." },
                    { id: "M05-02-26", question: "26. What is 011100001 Base2 in Octal?", options: ["a) 225 Base 8.", "b) 281 Base 10.", "c) 341 Base 8."], answer: "c", explanation: "011 = 3, 100 = 4, 001 = 1 -> 341 Base 8." },
                    { id: "M05-02-27", question: "27. The binary number 1010100011100101 Base2 in hexadecimal is.", options: ["a) 22BC Base 16.", "b) FFFF Base 16.", "c) A8E5 Base 16."], answer: "c", explanation: "1010=A, 1000=8, 1110=E, 0101=5 -> A8E5 Base 16." },
                    { id: "M05-02-28", question: "28. 0011011000101001 when transferred to computer language this information can be a representation of.", options: ["a) binary, octal or decimal numbers.", "b) hex, octal and binary numbers.", "c) hex, octal and decimal numbers."], answer: "c", explanation: "Binary IS 'computer language' not a representation. Therefore any answer with 'binary' in it is wrong." },
                    { id: "M05-02-29", question: "29. A computer message 3B4 is.", options: ["a) Octal.", "b) binary.", "c) hexadecimal."], answer: "c", explanation: "Contains letter B, indicating hexadecimal." },
                    { id: "M05-02-30", question: "30. What is 54 octal in hexadecimal?", options: ["a) 2F.", "b) 4F.", "c) 2C."], answer: "c", explanation: "Octal 54 = 44 decimal = 2C hex." },
                    { id: "M05-02-31", question: "31. 2D in decimal is.", options: ["a) 43.", "b) 45.", "c) 41."], answer: "b", explanation: "Aircraft Electricity and Electronics Eismin 5th Edition Page 132." },
                    { id: "M05-02-32", question: "32. 84 decimal in hexadecimal is.", options: ["a) 5f.", "b) f4.", "c) 54."], answer: "c", explanation: "Aircraft Electricity and Electronics Eismin 5th Edition Page 132." },
                    { id: "M05-02-33", question: "33. 16 hexadecimal converted to decimal is equivalent to.", options: ["a) 48.", "b) 38.", "c) 22."], answer: "c", explanation: "Aircraft Electricity and Electronics Eismin 5th Edition Page 132." },
                    { id: "M05-02-34", question: "34. Decimal 10 converted to binary is.", options: ["a) 1111.", "b) 1001.", "c) 1010."], answer: "c", explanation: "Aircraft Electricity and Electronics Eismin 5th Edition Page 128." },
                    { id: "M05-02-35", question: "35. What systems uses base 10?", options: ["a) Octal.", "b) Binary.", "c) Decimal."], answer: "c", explanation: "Aircraft Electricity and Electronics Eismin 5th Edition Page 128." },
                    { id: "M05-02-36", question: "36. What systems use base 16?", options: ["a) BCD.", "b) Octal.", "c) Hexadecimal."], answer: "c", explanation: "Aircraft Electricity and Electronics Eismin 5th Edition Page 132." },
                    { id: "M05-02-37", question: "37. Binary coded decimal (BCD) format has a minimum of.", options: ["a) 2 lots of four.", "b) four.", "c) 3 lots of four."], answer: "b", explanation: "BCD uses groups of four bits." },
                    { id: "M05-02-38", question: "38. What is the Hexadecimal number F86 in Binary?", options: ["a) 111110000001.", "b) 3974.", "c) 111110000110."], answer: "c", explanation: "Convert it to Decimal first = 3974. Since it is an even number, it must be the answer with a zero on the end." },
                    { id: "M05-02-39", question: "39. What is 11000012 - 1011002?", options: ["a) 10001101 Base 2.", "b) 110111 Base 2.", "c) 110101 Base 2."], answer: "c", explanation: "Aircraft Electricity and Electronics Eismin 5th Edition Page 1129." },
                    { id: "M05-02-40", question: "40. What is used for the power of 10?", options: ["a) Digital.", "b) Octal.", "c) Decimal."], answer: "c", explanation: "Decimal is a power of 10 counting system." },
                    { id: "M05-02-41", question: "41. What is 44 in hexadecimal?", options: ["a) 2d.", "b) 2c.", "c) 2F."], answer: "b", explanation: "(2 * 16) + (12 * 1) = 44 (c = 12)." },
                    { id: "M05-02-42", question: "42. What is octal 33 in hexadecimal?", options: ["a) 1b.", "b) 11.", "c) 22."], answer: "a", explanation: "Octal 33 = 27 decimal = 1b hex." },
                    { id: "M05-02-43", question: "43. An octal format hexadecimal number 3F written as binary would be.", options: ["a) 110 111.", "b) 111 111.", "c) 101 011."], answer: "b", explanation: "Hex 3 = 0011, F = 1111." },
                    { id: "M05-02-44", question: "44. What is f86 hex when converted to binary?", options: ["a) 1000010000110.", "b) 111110000110.", "c) 100000000000."], answer: "b", explanation: "F=1111, 8=1000, 6=0110 -> 111110000110." },
                    { id: "M05-02-45", question: "45. In a computer, the address 3B8 is.", options: ["a) hexadecimal.", "b) decimal.", "c) octal."], answer: "a", explanation: "Contains letter B, indicating hexadecimal." },
                    { id: "M05-02-46", question: "46. What is a Grays converter?", options: ["a) Analogue to Analogue.", "b) Analogue to Digital.", "c) Digital to Analogue."], answer: "b", explanation: "Gray code converters transform analog or sensor inputs into digital code." },
                    { id: "M05-02-47", question: "47. What is the hexadecimal number AE5 in octal form?", options: ["a) 5445.", "b) 5340.", "c) 5345."], answer: "c", explanation: "AE5 hex = 2789 decimal = 5345 octal." },
                    { id: "M05-02-48", question: "48. Hexadecimal 5C is what in binary?", options: ["a) 1011111.", "b) 1011100.", "c) 1110100."], answer: "b", explanation: "Hex 5 = 0101, C = 1100 -> 01011100." },
                    { id: "M05-02-49", question: "49. Binary 11001101 converted to octal is.", options: ["a) 12E.", "b) 315.", "c) 205."], answer: "b", explanation: "11 (3) 001 (1) 101 (5) -> 315 octal." },
                    { id: "M05-02-50", question: "50. What is the binary notation for 29?", options: ["a) 0001 0110.", "b) 0010 1001.", "c) 0001 1101."], answer: "c", explanation: "Decimal 29 = 11101 (0001 1101)." },
                    { id: "M05-02-51", question: "51. 101012 + 110012 =.", options: ["a) 462.", "b) 468.", "c) 4610."], answer: "c", explanation: "21 + 25 = 46 decimal." }
                ]
            },
            "M05-03": {
                title: "Data Conversion",
                questions: [
                    { id: "M05-03-01", question: "1. If a signal has quantity in volts and physical position it is.", options: ["a) digital.", "b) synchronous.", "c) analogue."], answer: "c", explanation: "This is the definition of an analogue signal." },
                    { id: "M05-03-02", question: "2. Within a computer controlled flight system, position feedback is converted from.", options: ["a) position feedback to rate feedback.", "b) analogue to digital.", "c) digital to analogue."], answer: "b", explanation: "Position feedback is converted from analogue to digital for computer processing." },
                    { id: "M05-03-03", question: "3. What is serial to parallel and vice-versa called?", options: ["a) Switching.", "b) Multiplex/Demultiplex.", "c) Encoder/Decoder."], answer: "b", explanation: "Multiplex/Demultiplex manages serial and parallel data conversion." },
                    { id: "M05-03-04", question: "4. A thyristor is a device which has.", options: ["a) a positive temperature coefficient.", "b) a negative temperature coefficient.", "c) a temperature coefficient of zero."], answer: "b", explanation: "Thyristors typically exhibit a negative temperature coefficient characteristics." },
                    { id: "M05-03-05", question: "5. Physical variables in quantitative forms, such as voltage or angular rotation of a shaft are.", options: ["a) digital.", "b) analogue.", "c) binary."], answer: "b", explanation: "Continuous physical variables represent analogue signals." },
                    { id: "M05-03-06", question: "6. A D to A converter is required to produce an output range of 0 to 10V. This can be achieved by.", options: ["a) a non inverting op amp connected in series with output.", "b) an inverting op amp connected in series with output.", "c) a differentiator with a 100 Kilohm feedback resistor."], answer: "b", explanation: "An inverting op amp connected in series with output can scale and shift/invert DAC output." },
                    { id: "M05-03-07", question: "7. A D to A converter would use a precision amplifier to.", options: ["a) compensate for the variation of the feedback resistor with temperature.", "b) ensure that the output voltages remain accurate.", "c) ensure that the input voltage remains accurate."], answer: "b", explanation: "Precision amplifiers ensure that output voltages remain accurate." },
                    { id: "M05-03-08", question: "8. A given transducer provides a voltage which corresponds to true heading. This voltage can be converted to 'bits' by using a.", options: ["a) analogue to digital converter.", "b) digital to analogue converter.", "c) commutator."], answer: "a", explanation: "Converting voltage (analogue) to bits (digital) requires an A/D converter." },
                    { id: "M05-03-09", question: "9. An A to D converter uses successive approximation to.", options: ["a) increase resolution.", "b) increase accuracy.", "c) increase speed."], answer: "c", explanation: "Successive approximation is chosen to increase conversion speed compared to simple counters." },
                    { id: "M05-03-10", question: "10. An R-2R D to A converter uses.", options: ["a) two values of resistors whose precision is not important.", "b) two values of precision resistors.", "c) resistors whose values are logarithmic."], answer: "a", explanation: "R-2R 基於分壓原理只要R-2R比例準即可確保轉換的線性度對電阻絕對精度要求低." },
                    { id: "M05-03-11", question: "11. The function of a commutator is to.", options: ["a) convert from analogue to binary form.", "b) provide continuous availability of all parameters connected to the system.", "c) provide a sampling in sequence of a number of parameters."], answer: "c", explanation: "A commutator samples a number of parameters sequentially." },
                    { id: "M05-03-12", question: "12. An encoder using Grey code.", options: ["a) changes analogue to binary.", "b) changes digital to analogue.", "c) changes analogue to digital."], answer: "c", explanation: "Encoders convert physical/analogue shaft positions to digital/Grey code." },
                    { id: "M05-03-13", question: "13. An analogue to digital converter is as accurate as.", options: ["a) the frequency.", "b) the sampling rate.", "c) the amplitude."], answer: "b", explanation: "Sampling rate and quantization steps govern ADC performance." },
                    { id: "M05-03-14", question: "14. A digital to analogue converter that requires the output to range between 0v and -10v would have.", options: ["a) a non-inverting amplifier in line with the output with a resistor to ground.", "b) an inverting amplifier in series with the output line.", "c) a non-inverting amplifier in parallel with the output line."], answer: "b", explanation: "An inverting amplifier in series with the output line scales and inverts the polarity." },
                    { id: "M05-03-15", question: "15. In an analogue to digital converter, the input voltage.", options: ["a) is switched by the digital input.", "b) is intermittent.", "c) stays on constantly."], answer: "c", explanation: "The continuous analogue input voltage stays on constantly for sampling." },
                    { id: "M05-03-16", question: "16. An R-2R Converter has values or resistance.", options: ["a) whose relative precision are accurate.", "b) whose precision are not accurate.", "c) whose precision are accurate."], answer: "b", explanation: "R-2R 基於分壓原理只要R-2R比例準即可確保轉換的線性度對電阻絕對精度要求低." },
                    { id: "M05-03-17", question: "17. What does 1 represent in an analogue system?", options: ["a) High frequency", "b) Switches closed, magnetised", "c) Switches open, unmagnetised"], answer: "b", explanation: "In discrete or relay-based analogue/control analogies, closed switches/magnetisation represent state 1." },
                    { id: "M05-03-18", question: "18. Audio sounds recorded digitally.", options: ["a) are superior quality and greater bandwidth.", "b) are narrow bandwidth.", "c) are not as accurate due to clipping and input errors."], answer: "a", explanation: "Digital recording offers superior fidelity and robust bandwidth." },
                    { id: "M05-03-19", question: "19. An analogue to digital converter where it counts up to binary state equal to the analogue input and then back down when this is reached is a.", options: ["a) a ramp type converter.", "b) successive approximation counter.", "c) flash type converter."], answer: "a", explanation: "Digital Fundamentals T L Floyd page 790: ramp type counter converter." },
                    { id: "M05-03-20", question: "20. Transistors are used in a current triggered D to A device to.", options: ["a) switch off the inputs.", "b) switch on the input.", "c) change the state of the inputs."], answer: "c", explanation: "Transistors switch or change the state of input currents in DAC networks." },
                    { id: "M05-03-21", question: "21. Op amps generally used in ADCs and DACs are normally.", options: ["a) high input impedance, high output impedance.", "b) high input impedance, low output impedance.", "c) low input impedance , how output impedance."], answer: "b", explanation: "Ideal op-amps feature high input impedance and low output impedance." },
                    { id: "M05-03-22", question: "22. Analogue logic 1 is.", options: ["a) closed switch, Logic Q=0.", "b) closed circuit, Logic Q=1.", "c) open circuit."], answer: "b", explanation: "Closed circuit represents active state / logic 1." },
                    { id: "M05-03-23", question: "23. An ADC uses successive approximation to.", options: ["a) increase speed.", "b) increase accuracy.", "c) increase resolution."], answer: "a", explanation: "Successive approximation increases conversion speed." },
                    { id: "M05-03-24", question: "24. A DAC uses a precision amplifier to.", options: ["a) ensure the output voltages remain accurate.", "b) compensates for the variation of the feedback resistor due to temperature.", "c) ensure the input remains accurate."], answer: "a", explanation: "Precision amplifiers ensure accurate output voltage levels." },
                    { id: "M05-03-25", question: "25. A precision op-amp is used in a DAC to.", options: ["a) compensate for temperature variation.", "b) give output at required level.", "c) make output between 0 - 5V."], answer: "b", explanation: "To scale and provide output at the required level." },
                    { id: "M05-03-26", question: "26. In an R-2R ladder converter the values of resistors.", options: ["a) do not need to be of precise values.", "b) only the first resistor need to be precise.", "c) are precise."], answer: "a", explanation: "As noted in variant questions, relative matching matters more than absolute tight tolerance." },
                    { id: "M05-03-27", question: "27. What is the quickest method of analogue to digital conversion?", options: ["a) Voltage to frequency.", "b) Flash converter.", "c) Single ramp method."], answer: "b", explanation: "Flash converters are the fastest type of ADC (Digital Fundamentals by Thomas L Floyd)." },
                    { id: "M05-03-28", question: "28. A charge balancing ADC uses.", options: ["a) successive approximation logic circuit to control the output.", "b) a closed loop system to compare the analogue input to give the required digital output.", "c) a closed loop system to check the analogue input with the input sample."], answer: "b", explanation: "Charge-balancing ADC employs a closed-loop system comparing input to output frequency." },
                    { id: "M05-03-29", question: "29. Sample and hold is a technique used in.", options: ["a) D to A conversion.", "b) Moving coil instruments.", "c) A to D conversion."], answer: "c", explanation: "Sample-and-hold circuits are standard front-ends for A/D conversion." },
                    { id: "M05-03-30", question: "30. An analogue to digital converter (ADC) requires the following.", options: ["a) a reference voltage, an input gate, an internal counter, a comparitor.", "b) a reference voltage, an input gate, a comparator.", "c) a reference voltage, an input gate, an internal counter."], answer: "b", explanation: "Essential core components include a reference voltage, input gate, and comparator." },
                    { id: "M05-03-31", question: "31. What is 'Throughput Rate' for the A/D converter?", options: ["a) Number of complete digital words encoded in a specified unit of time.", "b) None of the above.", "c) Speed of variable resistor which senses the analogue signal."], answer: "a", explanation: "Throughput rate defines complete encoded digital words per unit time." },
                    { id: "M05-03-32", question: "32. What is the Resolution of A/D and D/A converters?", options: ["a) Resolution of the Instrument which displays the values.", "b) Number of discrete values that can be represented by the digital word.", "c) Rate at which data is converted."], answer: "b", explanation: "Resolution is determined by the number of discrete values represented by the digital word bits." },
                    { id: "M05-03-33", question: "33. Digital signals can be represented.", options: ["a) only as a binary value.", "b) by a series of integers.", "c) by real numbers."], answer: "b", explanation: "Digital values correspond to discrete integers." },
                    { id: "M05-03-34", question: "34. When testing EGT probe.", options: ["a) it must be soaked and ambient temperature allowance taken into consideration.", "b) not necessarily soaked but ambient temperature must be taken into consideration.", "c) if its not soaked, a minimum temperature of 20 degrees C taken as OAT."], answer: "a", explanation: "Exhaust Gas Temperature probes require thermal soaking and ambient compensation." },
                    { id: "M05-03-35", question: "35. A Digital to Analogue Converter has a resolution of 0.3 Volts. What will be the analogue output when the digital input is 10110.", options: ["a) 6.6 Volts RMS.", "b) -6.6 Volts DC.", "c) 6.6 Volts DC."], answer: "c", explanation: "Binary 10110 = 22 decimal. 22 * 0.3V = 6.6 Volts DC." },
                    { id: "M05-03-36", question: "36. A number represented as a physical quantity, e.g. voltage or speed of rotation is.", options: ["a) digital.", "b) maximum value.", "c) analogue."], answer: "c", explanation: "Physical quantities representing values continuously are analogue." }
                ]
            },
            "M05-04": {
                title: "Data Buses",
                questions: [
                    { id: "M05-04-01", question: "1. In arinc 629, LRUs are programmed to transmit.", options: ["a) one at a time.", "b) one transmits and one recieves.", "c) all at the same time."], answer: "a", explanation: "ARINC 629 transmits messages one at a time sequentially using scheduled terminal intervals." },
                    { id: "M05-04-02", question: "2. In aircraft use, fibre optic cables should comply with.", options: ["a) ARINC 629 standard.", "b) ARIND 429 standard.", "c) ARIND 636 standard."], answer: "c", explanation: "Fibre optic standards in aircraft systems comply with ARINC 636." },
                    { id: "M05-04-03", question: "3. ARINC 629 databus is.", options: ["a) one cable, bi-directional.", "b) two cables, uni-directional.", "c) two cables, bi directional."], answer: "c", explanation: "ARINC 629 uses two cables providing bi-directional data flow." },
                    { id: "M05-04-04", question: "4. An ARINC 573 data bus is used.", options: ["a) to input into a Digital Flight Data Recorder.", "b) to supply digital inputs from a Symbol Generator to the EADI and EHSI.", "c) to input into a FDR Digital Acquisition Unit."], answer: "a", explanation: "ARINC 573 is primarily used for inputting into a Digital Flight Data Recorder." },
                    { id: "M05-04-05", question: "5. An ARINC 429 bus uses.", options: ["a) a twisted shielded pair of wires.", "b) two bi-directional twin sheathed and earthed wires.", "c) a single twin wire cable for each transmitter."], answer: "a", explanation: "ARINC 429 uses a twisted shielded pair of wires." },
                    { id: "M05-04-06", question: "6. The ARINC 429 data bus word systems use.", options: ["a) binary coded decimal.", "b) decimal numbering.", "c) hexadecimal numbering."], answer: "a", explanation: "ARINC 429 word systems frequently employ binary coded decimal (BCD)." },
                    { id: "M05-04-07", question: "7. ARINC 573 is related to what system?", options: ["a) Weather Radar.", "b) FDR.", "c) INS."], answer: "b", explanation: "ARINC 573 links to Flight Data Recorder (FDR) systems." },
                    { id: "M05-04-08", question: "8. ARINC 629 current mode couplers are.", options: ["a) capacitive.", "b) resistive.", "c) inductive."], answer: "c", explanation: "ARINC 629 couplers use inductive coupling (E-cores)." },
                    { id: "M05-04-09", question: "9. ARINC 629 databus is.", options: ["a) one bus, bi-directional data flow.", "b) two buses, unidirectional.", "c) two buses, bi-directional data flow."], answer: "a", explanation: "ARINC 629 operates as a single bi-directional serial bus structure." },
                    { id: "M05-04-10", question: "10. Normal transmission order of ARINC 629 LRUs in periodic mode is in order of.", options: ["a) shortest to largest TI.", "b) shortest to largest TG.", "c) power up."], answer: "c", explanation: "Periodic mode transmission order is based on power up sequence." },
                    { id: "M05-04-11", question: "11. In an ARINC 429 wordstring, bits 1 to 8 represent the.", options: ["a) destination LRU address.", "b) monitored parameter.", "c) message."], answer: "b", explanation: "Bits 1 to 8 represent the label / monitored parameter." },
                    { id: "M05-04-12", question: "12. ARINC 629 terminal transmit interval is.", options: ["a) common to each terminal.", "b) unique to each terminal.", "c) when all terminals are quiet."], answer: "a", explanation: "The TI (transmit interval) is common across terminals." },
                    { id: "M05-04-13", question: "13. MIL-STD-1533 is a data bus for.", options: ["a) Inertial Reference System.", "b) Flight Data Recorders.", "c) Digital Information Transfer System."], answer: "c", explanation: "MIL-STD-1553/1533 relates to Digital Information Transfer Systems." },
                    { id: "M05-04-14", question: "14. ARINC 629 periodic mode is used for.", options: ["a) transferring data only on events important to aircraft operation.", "b) database loads.", "c) normal operation."], answer: "c", explanation: "Periodic mode is used for normal day-to-day flight operations." },
                    { id: "M05-04-15", question: "15. How is data coupled to an ARINC 629 data bus?", options: ["a) By a resistive pickup.", "b) By an inductive pickup.", "c) By a capacitive pickup."], answer: "b", explanation: "Data is coupled inductively." },
                    { id: "M05-04-16", question: "16. How does MIL-STD-1533 put data onto the databus?", options: ["a) Through the bus controller.", "b) R1 (remote terminal).", "c) SSIFU (sub-system interface unit)."], answer: "a", explanation: "The bus controller manages and puts data onto the MIL-STD bus." },
                    { id: "M05-04-17", question: "17. The parity bit in digital information is used.", options: ["a) to check the validity of data information.", "b) for BITE programs.", "c) to check the status of the system."], answer: "a", explanation: "Parity bits verify data validity and check for transmission errors." },
                    { id: "M05-04-18", question: "18. ARINC 429 SDI word format is at bits.", options: ["a) 32.", "b) 1-8.", "c) 9-10."], answer: "c", explanation: "Source/Destination Identifier (SDI) occupies bits 9 and 10." },
                    { id: "M05-04-19", question: "19. What is the parity bit for on an ARINC 429 bus?", options: ["a) To act as a terminal gap in an emergency.", "b) To delay the signal.", "c) To check for corruption during transmission of a word."], answer: "c", explanation: "Bit 32 is a parity bit checking for word corruption." },
                    { id: "M05-04-20", question: "20. An ARINC 429 word label format is.", options: ["a) hexadecimal.", "b) octal.", "c) binary."], answer: "b", explanation: "ARINC 429 labels are expressed in octal format." },
                    { id: "M05-04-21", question: "21. How many LRUs can be connected to an ARINC 429 data bus?", options: ["a) 120.", "b) 60.", "c) 20."], answer: "c", explanation: "Standard ARINC 429 can connect up to 20 receivers (one transmitter, multiple sinks)." },
                    { id: "M05-04-22", question: "22. ARINC 629 terminal transmit interval is.", options: ["a) common to each terminal.", "b) is when all transmissions are quiet.", "c) unique to each terminal."], answer: "a", explanation: "Transmit interval is common to each terminal." },
                    { id: "M05-04-23", question: "23. An ARINC 429 bus uses.", options: ["a) a twisted shielded pair of wires.", "b) a single twin cable for each transmitter.", "c) two bi-directional twin, sheathed and earthed wires."], answer: "a", explanation: "Twisted shielded pair." },
                    { id: "M05-04-24", question: "24. ARINC 429 data bus systems uses.", options: ["a) hexadecimal numbering.", "b) binary coded decimal.", "c) decimal numbering."], answer: "b", explanation: "Binary Coded Decimal (BCD) format." },
                    { id: "M05-04-25", question: "25. An ARINC 429 Binary Coded Decimal word occupies word bits.", options: ["a) 1-8.", "b) 11-29.", "c) 11-28."], answer: "b", explanation: "BCD occupies bits 11-29." },
                    { id: "M05-04-26", question: "26. An ARINC 429 system uses a.", options: ["a) 20 bit word over a bi-directional bus.", "b) 32 bit word over a twisted pair of wires.", "c) 16 bit word over a twisted pair of wires."], answer: "b", explanation: "32-bit word format transmitted over a twisted pair." },
                    { id: "M05-04-27", question: "27. An ARINC 629 characteristic is.", options: ["a) all LRUs can transmit and receive at the same time.", "b) data can transmit in both directions down the data bus.", "c) all LRUs can transmit at the same time."], answer: "b", explanation: "Bi-directional data flow down the bus." },
                    { id: "M05-04-28", question: "28. What limits the number of ARINC 429 receivers on a bus?", options: ["a) The speed and size.", "b) The weight.", "c) The parallel input impedance."], answer: "c", explanation: "Parallel input impedance restricts receiver loading." },
                    { id: "M05-04-29", question: "29. Data is transferred on the MIL-STD-1553B by.", options: ["a) non return to zero.", "b) Manchester bi-phase.", "c) bi-polar return to zero."], answer: "b", explanation: "Manchester bi-phase encoding is used on MIL-STD-1553B." },
                    { id: "M05-04-30", question: "30. How are engine indications sent to the FDR?", options: ["a) Source isolated.", "b) Via ARINC 629.", "c) Via ARINC 573."], answer: "c", explanation: "Via ARINC 573." },
                    { id: "M05-04-31", question: "31. What system uses base 8?", options: ["a) ARINC 429, in dataword labels only.", "b) ARINC 573.", "c) ARINC 629."], answer: "a", explanation: "ARINC 429 labels use base 8 (octal)." },
                    { id: "M05-04-32", question: "32. On an ARINC 629 data bus, the maximum amount of current-mode couplers per data bus is.", options: ["a) 46.", "b) 120.", "c) 64."], answer: "b", explanation: "Maximum limit is 120 LRUs/couplers." },
                    { id: "M05-04-33", question: "33. To connect an LRU to the data bus.", options: ["a) a terminal controller and interface module only is required.", "b) current mode coupler, terminal controller and a production break is required.", "c) a current mode coupler, serial interface module and terminal controller is required."], answer: "c", explanation: "Requires coupler, SIM, and terminal controller." },
                    { id: "M05-04-34", question: "34. A current-mode coupler contains an E-Core assembly. The purpose of the E-Core is to provide effective screening of the signal through the.", options: ["a) current-mode coupler.", "b) couple the signal to the data bus.", "c) enable easy access for monitoring of the signal."], answer: "b", explanation: "Coupling the signal to the data bus." },
                    { id: "M05-04-35", question: "35. The ARINC 429 low rate of transmission is.", options: ["a) 100 kbits/second with high of 12-14 Mbits/second.", "b) 12-14 Kbits/second with high of 100 kBits/second.", "c) 12-14 Mbits/second with high of 100 Mbits/secon."], answer: "b", explanation: "Low speed is ~12-14 kbps, high speed is 100 kbps." },
                    { id: "M05-04-36", question: "36. An ARINC 629 bus cable is a twisted pair of wires with.", options: ["a) a 130 ohm resistor at one end.", "b) a 130 ohm resistor at both ends.", "c) a 230 ohm resistor at one end."], answer: "b", explanation: "Terminated with 130 ohm resistors at both ends." },
                    { id: "M05-04-37", question: "37. An ARINC 629 stub cable.", options: ["a) connects single directional data between the LRU and current mode coupler.", "b) connects bi-directional data between the LRU and current mode coupler.", "c) connects bi-directional data between two LRUs."], answer: "b", explanation: "Bi-directional stub connection between LRU and coupler." },
                    { id: "M05-04-38", question: "38. Care must be taken when installing ARINC 629 cables into bus panels, damage to cables can cause.", options: ["a) corrosion of the conductor.", "b) arcing of high voltage signals.", "c) standing waves."], answer: "a", explanation: "Conductor corrosion risk." },
                    { id: "M05-04-39", question: "39. An aircraft databus system.", options: ["a) can use both ARINC 629 and ARINC 429 as they are compatible.", "b) can use both systems, ARINC 629 and ARINC 429 via system card files and signal gateways.", "c) cannot use both ARINC 629 and ARINC 429 data buses."], answer: "b", explanation: "Mixed usage enabled via system card files and gateways." },
                    { id: "M05-04-40", question: "40. ARINC 629 is used for.", options: ["a) emergency only.", "b) a backup to ARINC 429.", "c) normal flight."], answer: "c", explanation: "Used for normal flight data exchange." },
                    { id: "M05-04-41", question: "41. Once an ARINC 629 LRU has transmitted a message it will wait how long before transmitting again?", options: ["a) Until the end of the synchronization gap.", "b) Until the start of the terminal gap.", "c) Until the end of the transmit interval"], answer: "c", explanation: "Wait until the end of the transmit interval (TI)." },
                    { id: "M05-04-42", question: "42. How is the word label 206 written in ARINC 429?", options: ["a) Decimal 206.", "b) Octal 01100001.", "c) Binary 11000110."], answer: "b", explanation: "Octal label representation (reversed bit order MSB to right)." },
                    { id: "M05-04-43", question: "43. What is ARINC 561 used for?", options: ["a) Fly by Wire systems.", "b) Flight Data Recorder systems.", "c) Inertial Navigation Systems."], answer: "c", explanation: "ARINC 561 specifies Inertial Navigation Systems." },
                    { id: "M05-04-44", question: "44. An ARINC data word is bits 11-29, if bits 11-18 are patched which of the following would be the LSB bit?", options: ["a) 19.", "b) 29.", "c) 21."], answer: "a", explanation: "Bit 19 becomes the LSB." },
                    { id: "M05-04-45", question: "45. Fibreoptic databus links are.", options: ["a) simplex.", "b) bi-directional.", "c) one way data buses."], answer: "b", explanation: "Bi-directional links." },
                    { id: "M05-04-46", question: "46. ARINC 629 is.", options: ["a) half duplex.", "b) full duplex.", "c) simplex."], answer: "a", explanation: "Half duplex communication." },
                    { id: "M05-04-47", question: "47. A signal in an ARINC 629 system uses.", options: ["a) a pair of wires per transmitter unit.", "b) a single wire.", "c) a twisted pair of wires or fibre optics."], answer: "c", explanation: "Twisted pair or fibre optics." },
                    { id: "M05-04-48", question: "48. An in-series ARINC 429 system transmits using.", options: ["a) encoder.", "b) time division multiplexing.", "c) wave division multiplexing."], answer: "b", explanation: "Time division multiplexing (TDM)." },
                    { id: "M05-04-49", question: "49. A terminal controller.", options: ["a) is repetitive transmitting.", "b) will transmit only once during each transmit interval.", "c) transmits only when addressed."], answer: "b", explanation: "Transmits once per transmit interval." },
                    { id: "M05-04-50", question: "50. The number of LRUs which transmit/receive on ARINC-429 is dependent upon.", options: ["a) speed of transmission & size of aircraft systems.", "b) parallel input impedance.", "c) size of S.D.I."], answer: "b", explanation: "Parallel input impedance." },
                    { id: "M05-04-51", question: "51. One of the ARINC 429 formats is.", options: ["a) BCD.", "b) octal.", "c) hexadecimal."], answer: "a", explanation: "Binary Coded Decimal (BCD)." },
                    { id: "M05-04-52", question: "52. A group of bits transmitted at the same time is.", options: ["a) parallel data.", "b) a clock signal.", "c) serial data."], answer: "a", explanation: "Parallel data transmission." },
                    { id: "M05-04-53", question: "53. The ARINC 429 system uses which of the following system to transfer data?", options: ["a) Non return to zero.", "b) Harvard bi phase.", "c) Bi-directional return to zero."], answer: "c", explanation: "Bipolar / bi-directional return to zero (BBRZ)." },
                    { id: "M05-04-54", question: "54. Which of the following ARINCs is bidirectional?", options: ["a) 629.", "b) 429.", "c) 573."], answer: "a", explanation: "ARINC 629 is inherently bi-directional on a shared bus." },
                    { id: "M05-04-55", question: "55. Data is transferred on the MIL-STD-1553B by using.", options: ["a) non return to zero.", "b) Manchester bi-phase.", "c) bipolar return to zero."], answer: "b", explanation: "Manchester bi-phase." },
                    { id: "M05-04-56", question: "56. The general arrangement of ARINC 629 includes.", options: ["a) databus cable, current mode coupler, stub cable.", "b) current mode coupler, databus cable only.", "c) databus cable, stub cable, voltage mode coupler."], answer: "a", explanation: "Bus cable, coupler, stub cable." },
                    { id: "M05-04-57", question: "57. ARINC 629 Databus cables are terminated using.", options: ["a) 100 ohms resistor.", "b) 130 ohms resistor.", "c) 25 ohms resistor."], answer: "b", explanation: "130 ohm terminating resistors." },
                    { id: "M05-04-58", question: "58. In ARINC 429 data field is bits 11 to 28. If the bits 11 to 18 had pad bits, the L.S.B. Of the data would be.", options: ["a) bit 11.", "b) bit 28.", "c) bit 19."], answer: "c", explanation: "Bit 19." },
                    { id: "M05-04-59", question: "59. The BCD data field of ARINC 429 is contained within bits.", options: ["a) 11-29.", "b) 11-28.", "c) 1-8."], answer: "a", explanation: "Bits 11-29 for BCD." },
                    { id: "M05-04-60", question: "60. ARINC 629 is transmitted using.", options: ["a) single wire for each transmitter.", "b) fibre optics or twisted pair of wires.", "c) SWG 28 wire."], answer: "b", explanation: "Fibre optics or twisted pair." },
                    { id: "M05-04-61", question: "61. A simplex system has.", options: ["a) 1 transmitter and multiple receivers.", "b) 1 bus controller and 1 remote terminal.", "c) 1 bus controller and multiple receivers."], answer: "a", explanation: "1 transmitter to multiple receivers." },
                    { id: "M05-04-62", question: "62. To create a bi-directional communications link within an ARINC 429 system.", options: ["a) four databuses are required.", "b) only one databus is required.", "c) two databuses are required."], answer: "c", explanation: "Two buses are needed for two-way communication." },
                    { id: "M05-04-63", question: "63. Why does an ARINC databus system send data to LRUs in series?", options: ["a) Saves weight.", "b) More information can be sent.", "c) Takes less time."], answer: "a", explanation: "Saves aircraft wiring weight." },
                    { id: "M05-04-64", question: "64. Can an LRU transmit and receive on more than one 629 bus?", options: ["a) Yes.", "b) Only if paralleled.", "c) No."], answer: "a", explanation: "Yes, LRUs can interface with multiple buses." },
                    { id: "M05-04-65", question: "65. ARINC 629 LRUs transmit.", options: ["a) when addressed.", "b) when signal gap is sensed.", "c) when terminal gap is sensed."], answer: "c", explanation: "Terminal gap timing controls transmission." },
                    { id: "M05-04-66", question: "66. An ARINC 429 BCD word occupies bits 11-29, if 11-15 are filled with padders then the LSB of the word will be.", options: ["a) 11.", "b) 16.", "c) 29."], answer: "b", explanation: "Bit 16." },
                    { id: "M05-04-67", question: "67. A simplex system has.", options: ["a) one transmitter, many receivers.", "b) a bus controller and separate controller.", "c) one transmitter, one receiver."], answer: "a", explanation: "One transmitter, many receivers." },
                    { id: "M05-04-68", question: "68. In an Arinc 429 Word label-representing heading is 320, this is represented in bits 1- 8 as.", options: ["a) 01011001.", "b) 00001011.", "c) 01101000."], answer: "b", explanation: "Octal 320 converted and reversed." },
                    { id: "M05-04-69", question: "69. In ARINC 629 aperiodic mode, LRUs transmit in order of.", options: ["a) longest terminal gap to shortest terminal gap.", "b) power up.", "c) shortest terminal gap to longest terminal gap."], answer: "c", explanation: "Shortest to longest terminal gap." },
                    { id: "M05-04-70", question: "70. ARINC 629, aperiodic mode is used.", options: ["a) for landing and approach operation.", "b) for normal operation.", "c) for database loads."], answer: "c", explanation: "Used for software and database loads." },
                    { id: "M05-04-71", question: "71. How is ARINC 429 bi-directional data transfer achieved?", options: ["a) Via a current mode coupler.", "b) Using two data buses.", "c) Via a twisted pair of shielded cables."], answer: "b", explanation: "Using two separate data buses." },
                    { id: "M05-04-72", question: "72. The data format use to transmit signal to flight data recorder.", options: ["a) Harvard bi-phase 12 bit.", "b) Bi-Polar RZ 12 bit.", "c) Manchester 2 bi-phase 12 bit."], answer: "a", explanation: "Harvard bi-phase 12 bit format." },
                    { id: "M05-04-73", question: "73. The output voltage of ARINC 429 signal is.", options: ["a) +5v.", "b) +10v to -10v.", "c) -5v."], answer: "b", explanation: "+10V to -10V swing." },
                    { id: "M05-04-74", question: "74. An ARINC 629 label word is.", options: ["a) 10 bits.", "b) 12 bits.", "c) 8 bits."], answer: "b", explanation: "12-bit label field." },
                    { id: "M05-04-75", question: "75. The T/R of ARINC 629 is.", options: ["a) Encoder / decoder.", "b) Multiplex / demultiplex.", "c) switching."], answer: "b", explanation: "Multiplex / demultiplex." },
                    { id: "M05-04-76", question: "76. Terminal gap in ARINC 629 is.", options: ["a) always the same period.", "b) flexible.", "c) can be changed by adjusting the rx/tx software."], answer: "c", explanation: "Configured via software settings." },
                    { id: "M05-04-77", question: "77. How does ARINC 629 bus transmit and receive information?", options: ["a) Sockets and pins.", "b) Inductive coupling.", "c) Optical coupling."], answer: "b", explanation: "Inductive coupling." },
                    { id: "M05-04-78", question: "78. What is ARINC 561 used for?", options: ["a) To specify LRU pin-outs.", "b) To specify Radio Comms data bus.", "c) To specify Flight Data Recorder data bus."], answer: "b", explanation: "ARINC radio communication specification." },
                    { id: "M05-04-79", question: "79. What is the purpose of the parity bit on an ARINC 429 bus?", options: ["a) To indicate if the data is analogue.", "b) To indicate that the data is digital.", "c) To indicate to the receiver that the data is valid."], answer: "c", explanation: "Indicates data validity." },
                    { id: "M05-04-80", question: "80. ARINC 429 is.", options: ["a) Single Source Multiple Sink System.", "b) Multiple Source Multiple Sink system.", "c) Single Source Single Sink system."], answer: "a", explanation: "One transmitter (source) to multiple receivers (sinks)." },
                    { id: "M05-04-81", question: "81. What is the purpose of intermediate production breaks in ARINC 429 or 629 Data cables?", options: ["a) Cables are only manufactured 40 feet long.", "b) To allow maintenance personnel to divide the right and left system buses into two parts for easy removal and installation.", "c) To allow connection of new cables to the existing ones in case of a modification."], answer: "b", explanation: "Facilitates maintenance and bus separation." },
                    { id: "M05-04-82", question: "82. Where is the parity bit installed in a data word?", options: ["a) Front.", "b) End MSB.", "c) Middle."], answer: "b", explanation: "Bit 32 (most significant bit position at end)." },
                    { id: "M05-04-83", question: "83. RZ bi-polar modulation consists of bits which are one of __________ states?", options: ["a) Eight.", "b) Two.", "c) Three."], answer: "c", explanation: "Three states (+V, 0V, -V)." },
                    { id: "M05-04-84", question: "84. In the ARINC 429 digital information transfer system, data may travel in:.", options: ["a) both directions on the same bus simultaneously.", "b) one direction only.", "c) both directions on the same bus sequentially by time multiplexing."], answer: "b", explanation: "Travels in one direction only per bus." },
                    { id: "M05-04-85", question: "85. An ARINC 629 data word.", options: ["a) includes an 8 bit label and a 16 bit data field.", "b) has only 20 bits.", "c) comprises up to 256 data bits."], answer: "b", explanation: "Comprises 20 bits (12-bit label, etc.)." },
                    { id: "M05-04-86", question: "86. In an ARINC 429 digital word bit number 32 is used for.", options: ["a) terminating the data field.", "b) checking parity.", "c) identifying word type."], answer: "b", explanation: "Parity checking." },
                    { id: "M05-04-87", question: "87. What connects an LRU to the Bus Coupler in an ARINC 629 Data Bus?", options: ["a) Patch Cord.", "b) Stub Cable.", "c) Interconnect Cable."], answer: "b", explanation: "Stub cable." }
                ]
            },
            "M05-05": {
                title: "Logic Circuits",
                questions: [
                    { id: "M05-05-01", question: "1. A NOR gate with both inputs inverted becomes a.", options: ["a) NAND gate.", "b) AND gate.", "c) OR gate."], answer: "b", explanation: "By De Morgan's laws, inverting inputs of a NOR gate yields an AND gate." },
                    { id: "M05-05-02", question: "2. Adding invertors to the two inputs of an AND gate makes a.", options: ["a) OR gate.", "b) NOR gate.", "c) NAND gate."], answer: "b", explanation: "Inverting AND inputs creates a NOR gate operation." },
                    { id: "M05-05-03", question: "3. This truth table is for a.", options: ["a) OR gate.", "b) AND gate.", "c) NAND gate."], answer: "b", image: "image_bbcac0.jpg", explanation: "The truth table outputs 1 only when both A and B are 1, representing an AND gate." },
                    { id: "M05-05-04", question: "4. Which logic gate can be represented as a parallel circuit?", options: ["a) OR gate.", "b) Exclusive OR gate.", "c) NAND gate."], answer: "a", explanation: "Parallel switches correspond to an OR gate function." },
                    { id: "M05-05-05", question: "5. Making an inverter from a NAND or NOR gate is achieved by.", options: ["a) connecting the inputs.", "b) inverting the input.", "c) connecting two in series."], answer: "a", explanation: "Tied inputs on NAND/NOR gate function as a NOT gate (inverter)." },
                    { id: "M05-05-06", question: "6. An AND gate output is 1 when inputs are.", options: ["a) both 1.", "b) both 0.", "c) 1 and 0."], answer: "a", explanation: "AND gate requires all inputs high (1) for a high output." },
                    { id: "M05-05-07", question: "7. What sort of gate requires two positive voltages to operate?", options: ["a) AND.", "b) OR.", "c) NOT."], answer: "a", explanation: "AND gate requires both inputs at high / positive voltage level." },
                    { id: "M05-05-08", question: "8. When will a NAND gate give logic 0 at the output?", options: ["a) When both inputs are at 1.", "b) When the inputs are different.", "c) When both inputs are at 0."], answer: "a", explanation: "NAND output is 0 only when all inputs are 1." },
                    { id: "M05-05-09", question: "9. Which logic gate has this truth table?", options: ["a) NOT.", "b) NAND.", "c) Exclusive OR."], answer: "c", image: "image_bbcd85.jpg", explanation: "Outputs 1 when inputs are different (Exclusive OR)." },
                    { id: "M05-05-10", question: "10. Which logic gate can be represented as a parallel circuit?", options: ["a) Exclusive OR.", "b) NAND.", "c) OR."], answer: "c", explanation: "OR gate corresponds to parallel switch circuits." },
                    { id: "M05-05-11", question: "11. What sort of gate is this?", options: ["a) NOT gate.", "b) NOR gate.", "c) OR gate."], answer: "b", image: "image_bbcde0.png", explanation: "NOR gate truth table (output 1 only when both inputs are 0)." },
                    { id: "M05-05-12", question: "12. The output of a NOT gate is logic 1. The input is.", options: ["a) logic 0.", "b) logic 1.", "c) both logic 1."], answer: "a", explanation: "NOT gate inverts logic state 0 to 1." },
                    { id: "M05-05-13", question: "13. When the voltage that represents a logic 1 state is less than the voltage that represents a logic 0 state, the logic being used is.", options: ["a) either positive or negative.", "b) positive.", "c) negative."], answer: "c", explanation: "Definition of negative (active-low/negative) logic." },
                    { id: "M05-05-14", question: "14. The output of an AND gate having two inputs A and B is logic 1. The two inputs will have the logic states of.", options: ["a) A = 0, B = 0.", "b) A = 1, B = 0.", "c) A = 1, B = 1."], answer: "c", explanation: "AND gate output is 1 when both inputs are 1." },
                    { id: "M05-05-15", question: "15. The output of an OR gate having two inputs A and B is logic 0. The two inputs will have the logic states of.", options: ["a) A = 1, B = 0.", "b) A = 0, B = 1.", "c) A = 0, B = 0."], answer: "c", explanation: "OR gate output is 0 only when all inputs are 0." },
                    { id: "M05-05-16", question: "16. What is this symbol?", options: ["a) Exclusive AND gate.", "b) Exclusive NOR gate.", "c) Exclusive OR gate."], answer: "c", image: "image_bbd8c7.jpg", explanation: "Exclusive OR (XOR) gate symbol." },
                    { id: "M05-05-17", question: "17. What Logic Gate does this switch circuit indicate?", options: ["a) NOR gate.", "b) AND gate.", "c) OR gate."], answer: "c", image: "image_bbd8ed.jpg", explanation: "Parallel switch arrangement represents an OR gate." },
                    { id: "M05-05-18", question: "18. Which logic gate has both inputs high to get an output?", options: ["a) AND gate.", "b) OR gate.", "c) NAND gate."], answer: "a", explanation: "AND gate." },
                    { id: "M05-05-19", question: "19. A NAND and NOR to become a NOT gate have.", options: ["a) inputs inverted.", "b) outputs inverted.", "c) inputs connected together."], answer: "c", explanation: "Connecting inputs together converts NAND/NOR into an inverter." },
                    { id: "M05-05-20", question: "20. An AND gate with inverted inputs and an inverted output is equivalent to.", options: ["a) an AND gate.", "b) a NOR gate.", "c) an OR gate."], answer: "c", explanation: "Inverting AND inputs and output results in an OR gate." },
                    { id: "M05-05-21", question: "21. Logic gates internal operating mechanisms are produced from.", options: ["a) thin film resistors.", "b) transistors.", "c) diodes."], answer: "b", explanation: "Modern logic gates use transistors internally." },
                    { id: "M05-05-22", question: "22. A logic 1 may be represented in an analogue system by (where Q is an output of a latch / flip-flop).", options: ["a) switch closed / light off / Not Q.", "b) positive / magnetised / Q.", "c) switch open / light on / Q."], answer: "b", explanation: "Positive voltage / magnetised state represents logic 1." },
                    { id: "M05-05-23", question: "23. To get logic 1 using this gate.", options: ["a) A and B = 0.", "b) A or B = 1.", "c) A and B = 1."], answer: "a", image: "image_bbd925.jpg", explanation: "For a NOR gate, output is 1 when both inputs are 0." },
                    { id: "M05-05-24", question: "24. What logic gate would this circuit represent?", options: ["a) NAND Gate.", "b) NOR gate.", "c) AND gate."], answer: "c", image: "image_bbd942.jpg", explanation: "Series switches represent an AND gate." },
                    { id: "M05-05-25", question: "25. What type of gate is this?", options: ["a) NAND.", "b) NOT.", "c) E-OR."], answer: "c", image: "image_bbd965.jpg", explanation: "Exclusive-OR gate symbol." },
                    { id: "M05-05-26", question: "26. What sort of gate requires two negative input voltages to operate?", options: ["a) OR.", "b) NAND.", "c) NOT."], answer: "b", explanation: "NAND logic principles in specific negative/active-low configurations." },
                    { id: "M05-05-27", question: "27. In Positive Logic representation.", options: ["a) both states have same positive voltages but stage 1 has more current.", "b) state 1 is more positive than state 0.", "c) state 0 is more positive than state 1."], answer: "b", explanation: "In positive logic, higher/more positive voltage represents logic 1." },
                    { id: "M05-05-28", question: "28. Switching within logic gates is normally achieved with the use of.", options: ["a) BTB's.", "b) relays.", "c) diodes."], answer: "c", explanation: "Diode-transistor / diode logic fundamentals." },
                    { id: "M05-05-29", question: "29. The truth table of A =0011 B=0101 and =0110 indicates that the logic device is.", options: ["a) an ECLUSIVE OR gate.", "b) a NOR gate.", "c) an AND gate."], answer: "a", explanation: "Truth table corresponds to Exclusive OR." },
                    { id: "M05-05-30", question: "30. What input is required to activate the relay shown?", options: ["a) A=0 B=1.", "b) A=1 B=0.", "c) A=1 B=1."], answer: "c", image: "image_bbd981.png", explanation: "Series switches require both A and B to be closed (1)." },
                    { id: "M05-05-31", question: "31. A NAND gate has inputs A and B and output C. If the output (c) was zero, what are the inputs?", options: ["a) A=1 B=1.", "b) A=0 B=0.", "c) A=1 B=0."], answer: "a", explanation: "NAND output is 0 only when all inputs are 1." },
                    { id: "M05-05-32", question: "32. The 'fan-in' in a gate is the.", options: ["a) number of inputs to a gate.", "b) number of outputs from a gate.", "c) number of inputs and outputs of a gate."], answer: "a", explanation: "Fan-in defines the number of inputs a logic gate can accept." },
                    { id: "M05-05-33", question: "33. What does the logic circuit shown represent?", options: ["a) Full Adder Circuit.", "b) Half adder circuit.", "c) Multi-bit adder."], answer: "a", image: "image_bbd99f.png", explanation: "Circuit diagram represents a Full Adder Circuit." },
                    { id: "M05-05-34", question: "34. Tristate devices are found.", options: ["a) on input circuits.", "b) on output circuits.", "c) on both input and output circuits."], answer: "a", explanation: "Input / buffer structures." },
                    { id: "M05-05-35", question: "35. A full adder has.", options: ["a) three inputs and two outputs.", "b) two inputs and one output.", "c) three inputs and one output."], answer: "a", explanation: "A full adder takes 3 inputs (A, B, Cin) and produces 2 outputs (Sum, Cout)." }
                ]
            },
            "M05-06": {
                title: "Basic Computer Structure",
                questions: [
                    { id: "M05-06-01", question: "1. In a computer memory device, which one of these has the slowest access time?", options: ["a) floppy disk.", "b) magnetic tape.", "c) 8mm video tape."], answer: "b", explanation: "8mm video tape is not (and never has been) a computer memory device." },
                    { id: "M05-06-02", question: "2. The advantage of DRAM over SRAM is.", options: ["a) are cheaper to manufacture.", "b) has a larger storage capacity per chip area.", "c) they operate slower."], answer: "b", explanation: "DRAM offers higher storage density and larger capacity per chip area compared to SRAM." },
                    { id: "M05-06-03", question: "3. A BYTE is usually.", options: ["a) an 8 bit word.", "b) a six bit word.", "c) a 12 bit word."], answer: "a", explanation: "A standard byte consists of 8 bits." },
                    { id: "M05-06-04", question: "4. What is the definition of baud rate?", options: ["a) 1 word per second.", "b) 1 byte per second.", "c) 1 bit per second."], answer: "c", explanation: "Baud rate measures symbol/bit transmission speed per second." },
                    { id: "M05-06-05", question: "5. Which would have the least components?", options: ["a) ALU.", "b) CPU.", "c) LSI."], answer: "a", explanation: "The Arithmetic Logic Unit (ALU) is a core component containing fewer total elements than a full CPU or LSI package." },
                    { id: "M05-06-06", question: "6. What is a baud?", options: ["a) A bit of data.", "b) A block of data.", "c) A byte of data."], answer: "a", explanation: "A baud represents a signal unit / bit of data transmission speed." },
                    { id: "M05-06-07", question: "7. In a bi-stable memory circuit.", options: ["a) the memory is retained indefinably.", "b) the memory is lost as soon as power is removed.", "c) the memory needs to be refreshed constantly, even when power is on."], answer: "b", explanation: "Volatile bi-stable latches lose memory immediately when power is removed." },
                    { id: "M05-06-08", question: "8. What is the advantage of series over parallel message sending?", options: ["a) Only one pair of conductors.", "b) More information sent.", "c) Quicker."], answer: "a", explanation: "Series communication requires fewer wires (only one pair of conductors)." },
                    { id: "M05-06-09", question: "9. A typical example of a mass storage memory device which is also WORM (Write Once Read Many) is.", options: ["a) an IC.", "b) a magnetic tape.", "c) a CD Rom."], answer: "c", explanation: "Standard CD-ROMs are WORM media." },
                    { id: "M05-06-10", question: "10. A computer using RAM would utilize.", options: ["a) magnetic tape.", "b) a compact disc.", "c) an integrated circuit (chip)."], answer: "c", explanation: "RAM is implemented using semiconductor integrated circuits." },
                    { id: "M05-06-11", question: "11. Magnetic materials are used in.", options: ["a) ROMs only.", "b) some RAMs.", "c) EPROM."], answer: "b", explanation: "Certain types of computer memory leverage magnetic principles (e.g., core memory or magnetic RAM variants)." },
                    { id: "M05-06-12", question: "12. A typical example of a mass storage device is.", options: ["a) IC.", "b) magnetic tape.", "c) CD."], answer: "c", explanation: "CDs serve as typical mass storage devices." },
                    { id: "M05-06-13", question: "13. What is EPROM?", options: ["a) Enhanced programmable read only memory.", "b) Erasable programmable read only memory.", "c) Erasable programming read only module."], answer: "b", explanation: "EPROM stands for Erasable Programmable Read-Only Memory." },
                    { id: "M05-06-14", question: "14. How many bytes can be carried in a 32bit word?", options: ["a) 8 bytes.", "b) 4 bytes.", "c) 2 bytes."], answer: "b", explanation: "32 bits divided by 8 bits per byte equals 4 bytes." },
                    { id: "M05-06-15", question: "15. A common used material in computer manufacturing is.", options: ["a) ferrite material.", "b) permeamag material.", "c) ferromagnetic material."], answer: "c", explanation: "Ferromagnetic material is used in hard drives and floppy drives." },
                    { id: "M05-06-16", question: "16. Ferrite medium is used for computer memory because.", options: ["a) data is stored after the power is removed.", "b) it is light.", "c) it has low eddy current losses."], answer: "a", explanation: "Ferrite core memory is non-volatile and retains data after power removal." },
                    { id: "M05-06-17", question: "17. Registers are used in digital computers to.", options: ["a) store bits of information in a permanent memory.", "b) store a limited amount of information on a temporary basis.", "c) keep a count of operations completed."], answer: "b", explanation: "Registers provide temporary high-speed data storage inside the CPU." },
                    { id: "M05-06-18", question: "18. A computer consist of at least the C.P.U and.", options: ["a) memory and input & output port.", "b) memory, ALU, input & output port.", "c) register section, ALU, timing and control section."], answer: "a", explanation: "A minimal computer architecture requires a CPU, memory, and I/O ports." },
                    { id: "M05-06-19", question: "19. A basic computer would consist of.", options: ["a) register section, ALU and timing and control section.", "b) memory, input/output ports and CPU.", "c) RAM/ROM and input/output ports."], answer: "b", explanation: "Basic computer systems comprise memory, I/O ports, and a CPU." },
                    { id: "M05-06-20", question: "20. DRAM.", options: ["a) requires a refreshing charge.", "b) memory is stored when power supply is removed.", "c) it does not require a refreshing charge."], answer: "a", explanation: "Dynamic RAM (DRAM) requires periodic electrical refreshing to maintain its charge." },
                    { id: "M05-06-21", question: "21. Bubble memory stores data on.", options: ["a) magnetic tape.", "b) semiconductor material.", "c) ferrite core."], answer: "b", explanation: "Magnetic bubble memory utilizes thin magnetic films on a semiconductor/non-magnetic substrate." },
                    { id: "M05-06-22", question: "22. An EPROM.", options: ["a) is non-volatile memory.", "b) requires constant refreshing.", "c) is erased after reading."], answer: "a", explanation: "EPROM is non-volatile and retains data without power." },
                    { id: "M05-06-23", question: "23. A computer requires to operate, a.", options: ["a) address bus, a data bus only.", "b) data bus, a control bus, a address bus.", "c) data bus, a control bus only."], answer: "b", explanation: "A complete computer system architecture utilizes data, control, and address buses." },
                    { id: "M05-06-24", question: "24. Which RAM type is faster and more expensive?", options: ["a) DRAM.", "b) SRAM.", "c) RAM."], answer: "b", explanation: "SRAM (Static RAM) is significantly faster and more costly than DRAM." },
                    { id: "M05-06-25", question: "25. A computer is acting in real time when.", options: ["a) the CPU requires a clock pulse.", "b) the output is equal to the input of data.", "c) the time to access memory is equal to the data speed in."], answer: "b", explanation: "Real-time processing responds to inputs and produces outputs instantaneously as data is received." }
                ]
            },
            "M05-10": {
                title: "Fibre Optics",
                questions: [
                    { id: "M05-10-01", question: "1. Some of the advantages of fibre optic cable over copper cables are.", options: ["a) non conductive, easy to manufacture and assemble, more robust, cheap.", "b) smaller in size and weight, non conductive, higher security and higher bandwidth.", "c) non conductive, smaller in size and weight, easy to manufacture and assemble and higher security."], answer: "b", explanation: "Fibre optic cables offer advantages including smaller size/weight, non-conductivity, higher security, and higher bandwidth." },
                    { id: "M05-10-02", question: "2. A fibre optic cable consists of.", options: ["a) a silica glass core with a cladding having a lower refractive index.", "b) a silica glass core with a cladding having a higher refractive index.", "c) a plastic core with a cladding having a higher refractive index."], answer: "a", explanation: "A core of higher refractive index glass is surrounded by cladding with a lower refractive index." },
                    { id: "M05-10-03", question: "3. Fibre optic cables.", options: ["a) are immune to EMI.", "b) attenuate EMI.", "c) are susceptible to EMI."], answer: "a", explanation: "Fibre optic cables carry light rather than electrical signals, making them completely immune to electromagnetic interference (EMI)." },
                    { id: "M05-10-04", question: "4. Two connected fibre optic cable ends are parallel but not quite touching. This is called.", options: ["a) end to end coupling.", "b) lens connector.", "c) end fire coupling."], answer: "a", explanation: "End-to-end coupling refers to aligned adjacent fiber ends that do not physically touch." },
                    { id: "M05-10-05", question: "5. A disadvantage of a fibre optic cable is.", options: ["a) couplings susceptible to ingress of fluid.", "b) end terminals are susceptible to environmental contamination.", "c) shallow bend radius allowed."], answer: "b", explanation: "Fibre end terminals are highly sensitive to dirt, dust, and environmental contamination causing light loss." },
                    { id: "M05-10-06", question: "6. What kind of light is used in a fibre optic systems?", options: ["a) Infrared.", "b) Visible.", "c) Ultraviolet."], answer: "a", explanation: "Infrared light (typically around 850nm or higher) is predominantly used in aviation fibre optic systems due to lower attenuation." },
                    { id: "M05-10-07", question: "7. Fibreoptic data is sent by.", options: ["a) modulating the frequency of a laser beam.", "b) a strobe light.", "c) modulating the frequency of a filament beam."], answer: "b", explanation: "Data is transmitted via optical pulses (strobe/pulsed light modulation)." },
                    { id: "M05-10-08", question: "8. HIRF is prevented from entering a fibre optic cable by.", options: ["a) using an opto-isolator coupling.", "b) grounding the fibre at both ends.", "c) enclosing it in a metal braid."], answer: "a", explanation: "Opto-isolators prevent conducted HIRF from transmitting through source circuitry into the system." },
