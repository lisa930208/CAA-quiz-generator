                    { id: "M05-10-09", question: "9. Continuity of a fibreoptic cable is checked by.", options: ["a) a calibrated light source.", "b) a calibrated light source and an opto-power meter.", "c) a light source and an opto-power meter."], answer: "b", explanation: "A calibrated light source paired with an opto-power meter measures insertion/continuity loss." },
                    { id: "M05-10-10", question: "10. A fibreoptic data bus used on an aircraft.", options: ["a) can send only one message at a time.", "b) can transmit on several channels at the same time.", "c) connects non-essential systems only."], answer: "b", explanation: "Fibre optic links support simultaneous multi-channel / multiplexed data transmission." },
                    { id: "M05-10-11", question: "11. Light travels along a fibre optic by.", options: ["a) refraction.", "b) reflection.", "c) dispersion."], answer: "b", explanation: "Total internal reflection guides light along the core." },
                    { id: "M05-10-12", question: "12. What is the main disadvantage of a fibre optic data bus?", options: ["a) Less strong and durable when compared to twisted pair and coaxial cable.", "b) Expensive to install.", "c) Bend radius and moisture ingress at connections."], answer: "b", explanation: "High initial installation, termination, and specialized tooling costs make it expensive." },
                    { id: "M05-10-13", question: "13. A typical fibre optic connector is.", options: ["a) F-type connector.", "b) coupling type, with lens fitted.", "c) push-pull connector."], answer: "b", explanation: "Aircraft fibre connectors frequently use lens-fitted coupling types to minimize dirt sensitivity." },
                    { id: "M05-10-14", question: "14. Which of the following is an optoelectronic device?", options: ["a) Triac.", "b) Laser Diode.", "c) Thyristor."], answer: "b", explanation: "Laser Diodes convert electrical signals to optical outputs (optoelectronic)." },
                    { id: "M05-10-15", question: "15. What is the advantage of a single mode fibreoptic over ordinary wire?", options: ["a) Not prone to damage.", "b) Large bandwidth.", "c) Small bend radius."], answer: "b", explanation: "Single mode fibres provide massive data bandwidth compared to copper wire." },
                    { id: "M05-10-16", question: "16. A fibreoptic light source is normally.", options: ["a) a strobe light.", "b) a filament lamp.", "c) a laser or LED."], answer: "c", explanation: "Lasers or LEDs serve as standard optical sources." },
                    { id: "M05-10-17", question: "17. The fibreoptic cable can be identified on aircraft by its jacket colour which is.", options: ["a) purple.", "b) yellow.", "c) red."], answer: "a", explanation: "Aviation fibre optic cables are identified by their distinctive purple jacket colour." },
                    { id: "M05-10-18", question: "18. For a fibre optic cable connector that is not regularly disconnected you would use the.", options: ["a) butt type.", "b) ball lens type.", "c) ceramic lens type."], answer: "a", explanation: "Butt-type connectors are suited for permanent or rarely disconnected joints." },
                    { id: "M05-10-19", question: "19. What maintenance problems are associated with fibreoptics?", options: ["a) Corrosion.", "b) Kinking and contamination of connectors.", "c) Earthing faults."], answer: "b", explanation: "Kinking (exceeding bend radius) and connector contamination are primary maintenance issues." },
                    { id: "M05-10-20", question: "20. A fibreoptic data bus.", options: ["a) can transmit several messages simultaneously.", "b) is only used for non essential messages.", "c) can only transmit 1 message at a time."], answer: "a", explanation: "Capable of simultaneous multi-message transmission." },
                    { id: "M05-10-21", question: "21. A fiberoptic cable to LRU connector should be connected.", options: ["a) very carefully to ensure alignment and reduce light loss.", "b) using torque-loaded pliers.", "c) hand tight only."], answer: "a", explanation: "Precise alignment is vital to prevent high insertion loss." },
                    { id: "M05-10-22", question: "22. Some of the advantages of fibreoptic cable over copper cable are.", options: ["a) smaller size and weight, non conductive, more rugged, higher security.", "b) non conductive, easy to manufacture and assemble, higher bandwidth.", "c) non conductive, higher bandwidth, higher security, smaller size and weight."], answer: "c", explanation: "Non-conductive, high bandwidth, high security, and reduced size/weight." },
                    { id: "M05-10-23", question: "23. In a single mode fibreoptic cable.", options: ["a) several waves travel down the cable.", "b) the diameter of the cable is dependent on the wavelength of the light used.", "c) the distortion of the signal is dependent on the length of cable."], answer: "b", explanation: "Core diameter is extremely small and matched to light wavelength." },
                    { id: "M05-10-24", question: "24. A semiconductor which emits photons and releases electrons when stimulated by photons is called.", options: ["a) a photodiode.", "b) a laser diode.", "c) an LED."], answer: "b", explanation: "Laser diode characteristics." },
                    { id: "M05-10-25", question: "25. What does a fibreoptic star connection do?", options: ["a) Provides a continuous loop of fibre interconnecting all nodes.", "b) Provides direct point-to-point services to units on dedicated lines emanating from the central hub.", "c) Shares a common bandwidth of a common cable."], answer: "b", explanation: "Star couplers/connections route point-to-point lines from a central hub." },
                    { id: "M05-10-26", question: "26. A fibreoptic lens type coupling with lens and integral LED compared to an end-fire coupling is.", options: ["a) more efficient.", "b) less efficient.", "c) equally efficient."], answer: "a", explanation: "Lens coupling improves optical efficiency and alignment tolerance." },
                    { id: "M05-10-27", question: "27. Passive sensors in fibreoptics.", options: ["a) process the signal but do not require power.", "b) require power for processing the signal before they send them down the fibre optic.", "c) require no power and they do not process signals."], answer: "a", explanation: "Passive optical sensors modulate light parameters without requiring electrical power at the sensing point." },
                    { id: "M05-10-28", question: "28. Optical fibre losses are due to.", options: ["a) absorption only.", "b) absorption, scattering and reflection.", "c) radiation, absorption and reflection."], answer: "b", explanation: "Losses stem from material absorption, Rayleigh scattering, and reflection." },
                    { id: "M05-10-29", question: "29. The cone of acceptance is measured between.", options: ["a) the two outer angles.", "b) the two outer angles.", "c) longitudinal axis of the core and the outer angle."], answer: "c", explanation: "Acceptance angle cone boundary relative to the core longitudinal axis." },
                    { id: "M05-10-30", question: "30. Fibreoptic cables use.", options: ["a) refractive outer shell.", "b) reflective inner shell.", "c) reflective outer shell."], answer: "a", explanation: "Cladding is a lower-index refractive glass shell providing total internal reflection." },
                    { id: "M05-10-31", question: "31. In fibreoptic cable, signals are separated by.", options: ["a) active optic filter.", "b) low pass filter.", "c) passive optic filter."], answer: "a", explanation: "光纖通訊中，當多個訊號同時在一根光纖中傳輸時，需將它們分離出來，此過程為分波多工/解多工。b為電子濾波器，與光纖分離無關。c雖也可分離不同波長的光，但題庫認為分離需主動控制." },
                    { id: "M05-10-32", question: "32. Most fibreoptic connectors are designed so.", options: ["a) the receptacle has to be torqued to a designated value to ensure correct alignment.", "b) the connectors can not be over tightened.", "c) the connector can not be replaced on the aircraft."], answer: "b", explanation: "Precision stops prevent over-tightening and fiber damage." },
                    { id: "M05-10-33", question: "33. The light source used in fibreoptics is.", options: ["a) visible light.", "b) lower bandwidth than visible light.", "c) higher bandwidth than visible light."], answer: "c", explanation: "High carrier frequency optical light provides vastly superior bandwidth." },
                    { id: "M05-10-34", question: "34. Light transmission in a fibreoptic cable is due to.", options: ["a) repeated internal reflection.", "b) defraction of the light.", "c) refraction of the light."], answer: "a", explanation: "Total internal reflection repeatedly bounces light down the core." },
                    { id: "M05-10-35", question: "35. The name given to the joining of two fibreoptic cables by aligning them carefully and bringing them into close proximity of each other is.", options: ["a) Fusion.", "b) Lens Coupling.", "c) End to end."], answer: "c", explanation: "End-to-end alignment." },
                    { id: "M05-10-36", question: "36. In a fibreoptic cable.", options: ["a) multiple data signals can be sent down it at one time.", "b) data can only be sent in one direction.", "c) only one data signal can be sent down it at any one time."], answer: "a", explanation: "Multiple signals via multiplexing." },
                    { id: "M05-10-37", question: "37. Fibreoptics relies on.", options: ["a) fibre absorbing light.", "b) light escaping cladding.", "c) light reflecting off cladding."], answer: "c", explanation: "Reflection at the core-cladding boundary." },
                    { id: "M05-10-38", question: "38. The 'light' emitted from a LED used within a fibre-optic system will have a wavelength.", options: ["a) slightly shorter then that of visible light.", "b) equal to that of visible light.", "c) slightly longer then that of visible light."], answer: "c", explanation: "Infrared wavelengths (e.g. >800nm) are longer than visible light." },
                    { id: "M05-10-39", question: "39. Sensors in a fibreoptic flight control system.", options: ["a) require processing to give output.", "b) does not require power.", "c) require power for processors."], answer: "c", explanation: "Active processing units require electrical power." },
                    { id: "M05-10-40", question: "40. Fibreoptic systems can transmit data in.", options: ["a) in two directions.", "b) both directions at the same time.", "c) one direction only."], answer: "b", explanation: "Full duplex / simultaneous bidirectional transmission is supported." },
                    { id: "M05-10-41", question: "41. For high bandwidth high-speed fibreoptic transmission what sort of cable would you use?", options: ["a) Step index.", "b) Single mode.", "c) Graded index."], answer: "b", explanation: "Single mode fibre eliminates modal dispersion for ultra-high speed/bandwidth." },
                    { id: "M05-10-42", question: "42. In fibreoptics the wavelength of the light is.", options: ["a) more than visible light.", "b) equal to that of visible light.", "c) less than visible light."], answer: "a", explanation: "Infrared wavelengths exceed visible light range." },
                    { id: "M05-10-43", question: "43. What is the advantage of an ILD over an LED when used as a light source in fibre optics?", options: ["a) Lower frequency range.", "b) Lower intensity.", "c) Higher bandwidth."], answer: "a", explanation: "本題的 frequency range 指的是光源的發射光譜範圍，ILD 的發射光譜比 LED 窄，因此能減少光纖中的色散。雖然 ILD 的資料傳輸頻寬確實比較高，但那是另一項特性，並非本題所問，故請選擇題庫要的答案 a)." },
                    { id: "M05-10-44", question: "44. Speed of light in a fibreoptic fibre.", options: ["a) increases if it passes through material of higher refractive index.", "b) is always the same no matter what material it is.", "c) is never greater then the speed of light in free space."], answer: "c", explanation: "光在介質中的速度為 c/n（真空光速 / 折射率），因此折射率越高速度越慢。真空中的光速是自然界速度上限，因此光在光纖中永遠小於真空光速." },
                    { id: "M05-10-45", question: "45. The angle of incidence of a beam of light in a fibreoptic cable will be.", options: ["a) twice that of the cone of acceptance.", "b) approximately half that of the cone of acceptance.", "c) parallel with the end of the cable."], answer: "b", explanation: "Related to acceptance cone geometry." },
                    { id: "M05-10-46", question: "46. In an optical fibre, the angle of acceptance is.", options: ["a) 1/2 the signal wavelength.", "b) equal to the cone of acceptance.", "c) 1/2 the cone of acceptance."], answer: "c", explanation: "Half-angle definition." },
                    { id: "M05-10-47", question: "47. When using a TDR (time delay reflectometer) the loss value of the cable is.", options: ["a) shown by the curve on the screen.", "b) set on the TDR.", "c) allowed for in the calculation."], answer: "a", explanation: "TDR trace displays reflection and attenuation curves." },
                    { id: "M05-10-48", question: "48. Common aircraft fibreoptics use.", options: ["a) modulating intensity on direct read.", "b) modulating intensity on indirect read.", "c) modulating frequency on direct read."], answer: "a", explanation: "Intensity modulation direct read." },
                    { id: "M05-10-49", question: "49. What is the main cause of attenuation in fibreoptics?", options: ["a) Poor termination.", "b) Refractive index.", "c) Bends in the cable."], answer: "a", explanation: "Improper termination and alignment errors cause the most significant signal loss." },
                    { id: "M05-10-50", question: "50. What is the advantage of a laser diode over an LED?", options: ["a) Greater bandwidth.", "b) Narrower bandwidth.", "c) There are no advantages."], answer: "b", explanation: "Laser diodes emit coherent light with a much narrower spectral bandwidth." },
                    { id: "M05-10-51", question: "51. A 'type A' fibre optic connector.", options: ["a) is used when regular disconnection and re-connection of a cable is required.", "b) produces a larger light loss that a type B connector.", "c) would be used for connections not regularly disconnected."], answer: "c", explanation: "Type A connectors are intended for fixed, infrequent disconnections." }
                ]
            },
            "M05-11": {
                title: "Electronic Displays",
                questions: [
                    { id: "M05-11-01", question: "1. The inside of a CRT consists of.", options: ["a) an oxide coating and rare mercury gas.", "b) a phosphor coating and rare mercury gas.", "c) iodine and rare mercury gas."], answer: "b", explanation: "CRT inner faceplates are coated with phosphor." },
                    { id: "M05-11-02", question: "2. CRT horizontal beam control is achieved by a.", options: ["a) sinusoidal wave.", "b) square wave.", "c) sawtooth wave."], answer: "c", explanation: "Sawtooth waveforms sweep the electron beam horizontally across the CRT." },
                    { id: "M05-11-03", question: "3. In a CRT, if the magnetic field is parallel to the Y plates, what will be the direction of the electron beam movement?", options: ["a) Horizontal.", "b) Vertical.", "c) No movement."], answer: "b", explanation: "Y plates control vertical deflection." },
                    { id: "M05-11-04", question: "4. Primary colours of a CRT are.", options: ["a) red, green and yellow.", "b) red, blue and yellow.", "c) red, green and blue."], answer: "c", explanation: "Additive RGB primary colors." },
                    { id: "M05-11-05", question: "5. What are the effects of the X and Y plates on a CRT?", options: ["a) Y plates move the beam vertically, X plates move the beam horizontally.", "b) X plates move the beam vertically, Y plates move the beam horizontally.", "c) X and Y plates can move the beam in either direction."], answer: "a", explanation: "X = horizontal deflection, Y = vertical deflection." },
                    { id: "M05-11-06", question: "6. EADI sky and ground display is provided by.", options: ["a) synthetic TV signals.", "b) stroke pulse.", "c) raster scan."], answer: "c", explanation: "Raster scanning fills backgrounds (sky/ground shading)." },
                    { id: "M05-11-07", question: "7. What frequency creates the raster effect on a CRT?", options: ["a) 50/60 Hz.", "b) 250Hz.", "c) 400 Hz."], answer: "a", explanation: "Standard line/frame refresh rates (50/60 Hz)." },
                    { id: "M05-11-08", question: "8. The sweep waveform used on a electromagnetic CRT is.", options: ["a) trapezoidal.", "b) sinusoidal.", "c) sawtooth."], answer: "a", explanation: "Electromagnetic deflection coils require trapezoidal waveforms to overcome inductive impedance." },
                    { id: "M05-11-09", question: "9. What shape does the waveform take to counter the impedance effect of the coils in an electromagnetic controlled CRT?", options: ["a) Sawtooth.", "b) Rectangular.", "c) Trapezoid."], answer: "c", explanation: "Trapezoidal current waveform." },
                    { id: "M05-11-10", question: "10. Magnetic deflection in a CRT is achieved by.", options: ["a) a sawtooth waveform.", "b) a trapezoidal waveform.", "c) a sinusoidal voltage."], answer: "b", explanation: "Trapezoidal waveform for magnetic coils." },
                    { id: "M05-11-11", question: "11. The timebase in a CRT consists of.", options: ["a) an amplifier and an oscillator.", "b) an oscillator only.", "c) an amplifier only."], answer: "a", explanation: "Timebase generator combines an oscillator and sweep amplifier." },
                    { id: "M05-11-12", question: "12. What creates the raster effect on a CRT?", options: ["a) Sawtooth frequency.", "b) Trapezoidal frequency.", "c) Sinusoidal frequency."], answer: "a", explanation: "Sawtooth sweep." },
                    { id: "M05-11-13", question: "13. LCD screens are driven by.", options: ["a) AC voltage.", "b) variable current DC voltage.", "c) fixed current DC voltage."], answer: "a", explanation: "Liquid crystals degrade under DC and require AC drive voltage." },
                    { id: "M05-11-14", question: "14. A Liquid Crystal Display (LCD) has the advantage over a CRT that.", options: ["a) it requires no cooling.", "b) it displays more colours.", "c) it requires less servicing."], answer: "a", explanation: "LCDs generate vastly less heat and require no bulky high-voltage cooling systems compared to CRTs." },
                    { id: "M05-11-15", question: "15. The release of a photon by another photon is the principle of.", options: ["a) a photo diode.", "b) a zener diode.", "c) an LED."], answer: "c", explanation: "Electroluminescence / LED principles." },
                    { id: "M05-11-16", question: "16. If a magnetic field is parallel to the X plates in a CRT, which way will the beam move?", options: ["a) Vertically.", "b) Horizontally.", "c) Diagonally."], answer: "b", explanation: "X-axis alignment." },
                    { id: "M05-11-17", question: "17. An LED display is.", options: ["a) monochrome only.", "b) red and green.", "c) high definition."], answer: "a", explanation: "Traditional discrete aviation LED segments are monochrome (typically red/green)." },
                    { id: "M05-11-18", question: "18. An LCD display uses what type of power supply?", options: ["a) DC voltage.", "b) Continuous AC.", "c) Variable level DC voltage."], answer: "b", explanation: "Continuous AC drive signals." },
                    { id: "M05-11-19", question: "19. A beam deflection on EFIS displays are.", options: ["a) electrostatic.", "b) electromagnetic.", "c) solid state."], answer: "b", explanation: "EFIS CRTs predominantly use electromagnetic deflection." },
                    { id: "M05-11-20", question: "20. The supply to an LCD is.", options: ["a) AC.", "b) current restricted DC.", "c) voltage restricted DC."], answer: "a", explanation: "AC drive." },
                    { id: "M05-11-21", question: "21. An LED will emit light when.", options: ["a) it is reverse biased.", "b) either forward or reverse biased if a sufficient level of", "c) it is forward biased."], answer: "c", explanation: "Forward biasing a P-N junction LED causes photon emission." },
                    { id: "M05-11-22", question: "22. A CRT display has the advantage over an LCD display of a.", options: ["a) brighter clearer output.", "b) more energy efficient.", "c) large viewing angle."], answer: "c", explanation: "CRTs maintain excellent contrast across wide viewing angles." },
                    { id: "M05-11-23", question: "23. To display a circle on a CRT you use.", options: ["a) 2 square wave 90 degrees out of phase.", "b) 2 sine waves 180 degrees out of phase.", "c) 2 sine waves 90 degrees out of phase."], answer: "c", explanation: "Quadrature sine waves (90 deg phase shift) generate circular Lissajous figures." },
                    { id: "M05-11-24", question: "24. To deflect the beam of a CRT horizontally, coils are placed on the neck of the tube.", options: ["a) each side.", "b) top and bottom.", "c) one on the side, one at the bottom."], answer: "b", explanation: "Top and bottom magnetic coils deflect beam horizontally." },
                    { id: "M05-11-25", question: "25. If the magnetic deflection plates produce a magnetic field which is parallel to the horizontal then the trace is deflected in.", options: ["a) circular motion.", "b) horizontal axis.", "c) vertical axis."], answer: "c", explanation: "Perpendicular deflection principle." },
                    { id: "M05-11-26", question: "26. The most common CRT control for an EFIS system screen is.", options: ["a) a combined system.", "b) an electrostatic system.", "c) an electromagnetic system."], answer: "a", explanation: "Combined magnetic deflection and electrostatic focus control." },
                    { id: "M05-11-27", question: "27. L.E.D.s can give.", options: ["a) high definition displays.", "b) monochrome displays only.", "c) red and green displays only."], answer: "b", explanation: "Monochrome character/segment formats." },
                    { id: "M05-11-28", question: "28. At low ambient temperatures, an LCD screen.", options: ["a) is slower to update as data changes.", "b) viewing angle becomes larger.", "c) loses contrast."], answer: "a", explanation: "Viscosity increases in liquid crystals at low temperatures, slowing refresh response." },
                    { id: "M05-11-29", question: "29. Colour CRT shadow mask screen resolution is.", options: ["a) 400 lines per square inch.", "b) 84 triads.", "c) 600 lines per scan."], answer: "b", explanation: "Triad spacing definition." },
                    { id: "M05-11-30", question: "30. An LCD display.", options: ["a) has three colours only.", "b) is monochrome.", "c) has infinite colours."], answer: "a", explanation: "RGB subpixel filter structure." },
                    { id: "M05-11-31", question: "31. A segmented configuration for the display of alphanumeric data requires.", options: ["a) the starburst display for numbers and lower case letters only.", "b) 16 segments to display the full range of capital letters and numerals.", "c) at least 13 segments for all upper and lower case letters."], answer: "b", explanation: "16-segment displays support full alphanumeric capitals and numbers." },
                    { id: "M05-11-32", question: "32. Electronic CRT beam display is used typically in.", options: ["a) weather radar indicators.", "b) IRU control display units.", "c) distance measuring indicators; digital counters."], answer: "a", explanation: "Weather radar PPI displays." },
                    { id: "M05-11-33", question: "33. In a colour cathode ray tube, how is the phosphor arranged in the tube.", options: ["a) A single phosphor layer containing red, green and blue.", "b) A red layer on the front with two green layers behind it.", "c) Layers of red, blue and green."], answer: "a", explanation: "Dot or stripe triad phosphor arrangements." },
                    { id: "M05-11-34", question: "34. A colour LCD which is back lit has.", options: ["a) three colours.", "b) monochrome.", "c) an infinite amount of colours."], answer: "a", explanation: "RGB backlight / filter design." },
                    { id: "M05-11-35", question: "35. A dot matrix/LED construction is.", options: ["a) 4*7 or a 9*5 rolling end display.", "b) 5*9 or a 4*7 rolling end display.", "c) 4*7 or a 5*7 rolling end display."], answer: "a" },
                    { id: "M05-11-36", question: "36. What are the advantages of an LCD display over an LED?", options: ["a) It is brighter.", "b) It uses less current.", "c) There are no advantages."], answer: "b", explanation: "Low power consumption." },
                    { id: "M05-11-37", question: "37. A seven segment display is used to.", options: ["a) display alpha-numeric characters.", "b) display octal and decimal numbers only.", "c) display octal and binary numbers only."], answer: "b", explanation: "Numerals 0-9." },
                    { id: "M05-11-38", question: "38. How are Alphanumeric Displays produced on a CRT?", options: ["a) By Stroke pulse.", "b) Raster scanning.", "c) by the use of X & Y EM Coils."], answer: "a", explanation: "Stroke/vector writing generates sharp alphanumeric text." },
                    { id: "M05-11-39", question: "39. The Shorter lead near the Flat portion of an LED is the.", options: ["a) Cathode.", "b) Anode.", "c) Gate."], answer: "a", explanation: "Cathode lead identification." },
                    { id: "M05-11-40", question: "40. Submarining' is.", options: ["a) caused by the inability of some LCD screens to respond to fast moving images on screen.", "b) a CRT screen defect which can usually be remedied by degaussing the screen.", "c) the process used to form liquid crystals into a flat screen"], answer: "a", explanation: "Motion blur / lagging response on slow LCD panels." }
                ]
            },
            "M05-12": {
                title: "Electrostatic Sensitive Devices",
                questions: [
                    { id: "M05-12-01", question: "1. ESDS bags are sealed by.", options: ["a) ESDS labels.", "b) zip locks.", "c) twine (100% cotton)."], answer: "c", explanation: "Boeing standard maintenance manuals specify 100% cotton twine or approved ESDS sealing." },
                    { id: "M05-12-02", question: "2. What precautions are required when removing ESDS equipment?", options: ["a) Wear a wrist strap connected to an approved ground point.", "b) No special precautions are required.", "c) Keep one hand on the airframe."], answer: "a", explanation: "ESD wrist straps connected to airframe/bench ground are mandatory." },
                    { id: "M05-12-03", question: "3. A flight deck CRT LRU is being replaced. What does the ESDS label indicate?", options: ["a) Wrist straps should be worn.", "b) Do not touch plug pins or leave them exposed.", "c) Remove power before connecting."], answer: "b", explanation: "Protect exposed connector pins from static discharge." },
                    { id: "M05-12-04", question: "4. During an EFIS screen fit.", options: ["a) dont touch terminals.", "b) no tooling is required.", "c) use bonding strap."], answer: "a", explanation: "Avoid touching sensitive connector pins." },
                    { id: "M05-12-05", question: "5. With a relative humidity of 10% to 20%, if you walked over a carpet what electrostatic voltage value would you expect to see?", options: ["a) 35,000 volts.", "b) 6,000 volts.", "c) 12,000 volts."], answer: "a", explanation: "Low humidity combined with friction generates extreme static voltages up to 35kV." },
                    { id: "M05-12-06", question: "6. Before fitting a Printed Circuit Board you should check the.", options: ["a) resistance between skin and strap end plug is less than 10 megohms.", "b) resistance between skin and strap end plug is more than 1 megohms.", "c) resistance between strap and strap end plug is less than 1 megohms."], answer: "b", explanation: "Safety resistance limits ensure protection against live shorts." },
                    { id: "M05-12-07", question: "7. The resistance of the wrist strap used as part of anti static precautions should be.", options: ["a) 0 - 200 ohm.", "b) 20 megohm - 200 megohm.", "c) 250 kilohm - 1.5 megohm."], answer: "c", explanation: "Standard wrist strap built-in safety resistor ranges between 250 kΩ and 1.5 MΩ." },
                    { id: "M05-12-08", question: "8. When handling PCB's labelled ESDS, what precaution are taken?", options: ["a) Do not touch its pins as copper contamination can occur.", "b) Isolate electrical power before installing on Aircraft.", "c) First earth with aircraft then to it."], answer: "b", explanation: "Power must be isolated before installing or removing LRUs/PCBs." },
                    { id: "M05-12-09", question: "9. After attaching a wrist strap to your wrist (which is connected to aircraft ground), prior to removal of ESDS equipment, the resistance measured.", options: ["a) between your skin and the pin ground must be >1 megohms.", "b) between the strap and the pin ground must be <1 megohms.", "c) between the strap and the pin ground must be >1 Megohms."], answer: "c", explanation: "Ensures protective personnel grounding resistance." },
                    { id: "M05-12-10", question: "10. Which of the following ESDS devices can withstand higher static electricity voltage?", options: ["a) MOSFET.", "b) SCR.", "c) ECL."], answer: "b", explanation: "Silicon Controlled Rectifiers (SCR) generally exhibit higher static resilience than delicate gate oxides in MOSFETs." },
                    { id: "M05-12-11", question: "11. A wrist band must be worn when working with ESDS devices.", options: ["a) to dissipate and prevent static build-up on the operator.", "b) to prevent the operator from getting an electric shock.", "c) to dissipate static charge on the device."], answer: "a", explanation: "Prevents body static accumulation." },
                    { id: "M05-12-12", question: "12. A humid atmosphere.", options: ["a) reduces static charge.", "b) eliminates static charge.", "c) has no effect on the level of charge."], answer: "a", explanation: "Higher humidity aids surface leakage and reduces static build-up." },
                    { id: "M05-12-13", question: "13. Electrostatic discharge occurs when.", options: ["a) the ground lead on a wrist strap touches the skin.", "b) materials are rubbed together or pulled apart.", "c) materials of different potential are brought in close proximity to each other."], answer: "c", explanation: "Potential difference breakdown." },
                    { id: "M05-12-14", question: "14. Before removing an assembly from an aircraft, with regards to HIRF, you must first ensure that there is minimum current flow between.", options: ["a) the assembly and the aircraft.", "b) you and the assembly.", "c) you and the aircraft."], answer: "b", explanation: "Equalize potential between personnel and hardware." },
                    { id: "M05-12-15", question: "15. When removing a PC card from an ESDS assembly ensure a low current path between.", options: ["a) aircraft and ground.", "b) you and the assembly.", "c) you and the aircraft."], answer: "c", explanation: "Equipotential bonding." }
                ]
            },
            "M05-13": {
                title: "Software Management Control",
                questions: [
                    { id: "M05-13-01", question: "1. An aircraft system that, should it fail due to a software error, would cause a significant reduction in safety margins may also cause.", options: ["a) no injuries to occupants.", "b) injuries to some occupants.", "c) the loss of the aircraft."], answer: "b", explanation: "Major failure condition (Level B) results in injury to some occupants and reduction in safety." },
                    { id: "M05-13-02", question: "2. An aircraft system allocated a software level of C that, should it fail due to a software error, may cause.", options: ["a) injuries to some occupants.", "b) injuries to a large proportion of occupants.", "c) no injuries to occupants."], answer: "a", explanation: "Level C software failure corresponds to major effects / injuries to some occupants." },
                    { id: "M05-13-03", question: "3. An aircraft system allocated a Criticality Category of Level of Hazardous has a Software.", options: ["a) A.", "b) B.", "c) C."], answer: "b", explanation: "Criticality mapping." },
                    { id: "M05-13-04", question: "4. An aircraft system that, should it fail due to a software error, would cause a slight increase in crew workload, has a software level of.", options: ["a) D.", "b) B.", "c) C."], answer: "a", explanation: "Level D corresponds to minor failure conditions (slight workload increase, no injury)." },
                    { id: "M05-13-05", question: "5. An aircraft system with a software level of D, should it fail due to a software error, may cause the aircraft safety margin to be.", options: ["a) slightly decreased.", "b) slightly increased.", "c) significantly decreased."], answer: "a", explanation: "Minor reduction in safety margins." },
                    { id: "M05-13-06", question: "6. If due to a software error in an aircraft system that would cause injuries to some of the occupants, the system has a software criticality category of.", options: ["a) major effect.", "b) hazardous effect.", "c) minor effect."], answer: "a", explanation: "Major effect category." },
                    { id: "M05-13-07", question: "7. An aircraft system that, should it fail due to a software error, would cause no injuries to occupants, has a criticality category of.", options: ["a) major effect.", "b) minor effect.", "c) hazardous effect."], answer: "b", explanation: "Minor effect." },
                    { id: "M05-13-08", question: "8. Requirements for software control can be found in.", options: ["a) JAR AWO.", "b) AWN 43.", "c) JAR OPS."], answer: "b", explanation: "Airworthiness Notice (AWN) 43 governs aircraft software modification and control." },
                    { id: "M05-13-09", question: "9. Software can be modified by.", options: ["a) the manufacturer.", "b) using the same rules as apply as to modifications to hardware.", "c) licensed avionics engineers."], answer: "b", explanation: "Software changes follow controlled hardware modification disciplines." },
                    { id: "M05-13-10", question: "10. Who is responsible for producing the operational program of the FMS?", options: ["a) The manufacturer.", "b) The pilot.", "c) The engineer."], answer: "a", explanation: "The equipment manufacturer / design organization." },
                    { id: "M05-13-11", question: "11. Software documentation procedures are laid down in.", options: ["a) MOE.", "b) JAA Ops.", "c) AWN (45)."], answer: "c", explanation: "AWN 45 covers software documentation and approval." },
                    { id: "M05-13-12", question: "12. Control of software is carried out by.", options: ["a) the aircraft manufacturers.", "b) a licensed engineer.", "c) the National Aviation Authority."], answer: "c", explanation: "National Aviation Authorities (NAA) oversee compliance." },
                    { id: "M05-13-13", question: "13. What is the definition of level one software?", options: ["a) Non-essential.", "b) Essential.", "c) Critical."], answer: "c", explanation: "Level 1 (Level A) software is catastrophic / critical." },
                    { id: "M05-13-14", question: "14. Who can sign for a software update?", options: ["a) Design organization or the aircraft manufacturer.", "b) Engineer.", "c) Chief pilot."], answer: "b", explanation: "Licensed certifying engineers sign release documentation per approved maintenance data." },
                    { id: "M05-13-15", question: "15. What is the effect of a level 1 software failure?", options: ["a) Significant reduction in safety margins.", "b) Large reduction in safety margins.", "c) Loss of aircraft and / or fatalities."], answer: "c", explanation: "Catastrophic failure / loss of aircraft." },
                    { id: "M05-13-16", question: "16. Software changes come under the responsibility of.", options: ["a) the engineer.", "b) the national aviation authority.", "c) the aircraft constructor."], answer: "c", explanation: "Manufacturer constructor control." },
                    { id: "M05-13-17", question: "17. Who can design new software?", options: ["a) BCAR section A8 approved company.", "b) BCAR section A1 approved company.", "c) The CAA."], answer: "a", explanation: "Approved design organizations." },
                    { id: "M05-13-18", question: "18. As far as a software product is concerned.", options: ["a) the 'Software Release' phase is the same as the 'Finished Product' phase.", "b) the 'Validation' phase is done to the software rather than to the component.", "c) the 'Verification' phase includes performance testing a programmed EPROM."], answer: "c", explanation: "Verification testing confirms programmed hardware/EPROM meets specification." },
                    { id: "M05-13-19", question: "19. AWN 43 requires that.", options: ["a) the aircraft operator be responsible for software assessment.", "b) the CAA be responsible for software assessment.", "c) the aircraft constructors be responsible for software assessment."], answer: "c", explanation: "Constructor responsibility." },
                    { id: "M05-13-20", question: "20. Level 1 software failure.", options: ["a) is defined as essential and will reduce safety margins.", "b) is defined as essential and may have a minor effect.", "c) is defined as critical and can lead to loss of aircraft."], answer: "c", explanation: "Critical definition." },
                    { id: "M05-13-21", question: "21. Requirements for configuration management of software can be found in.", options: ["a) AWN 43.", "b) JAR Ops (M).", "c) ATA Chapter 46, Information Systems."], answer: "a", explanation: "AWN 43." },
                    { id: "M05-13-22", question: "22. Where would you find the rules regarding upgrade of software?", options: ["a) JAR OPS.", "b) The aircraft manufacturer.", "c) AWN 43."], answer: "c", explanation: "AWN 43." }
                ]
            },
            "M05-14": {
                title: "Electromagnetic Environment",
                questions: [
                    { id: "M05-14-01", question: "1. In order to maintain HIRF protection, bonding checks between airframe and electrical components carrying voltages greater than 50 volts RMS or DC or main earth return should not exceed.", options: ["a) 0.05 ohm.", "b) 1 ohm.", "c) 1 megohm."], answer: "b", explanation: "Bonding resistance for standard major airframe returns should not exceed 1 ohm (or 50 milliohms depending on specific critical bonding zones)." },
                    { id: "M05-14-02", question: "2. Ribbon cables effected by mutual impedance and current loop leakage should be protected by.", options: ["a) earthing each alternative conductor to separate point.", "b) connecting all conductors to a common earth.", "c) shielding each individual conductor."], answer: "a", explanation: "Alternating conductor grounding reduces crosstalk and mutual impedance." },
                    { id: "M05-14-03", question: "3. To shield a fibre optic from EMI you must.", options: ["a) earth both transducer and couplings.", "b) shield it with a braided shield.", "c) use an opto-isolator."], answer: "c", explanation: "Fibre optics are inherently immune to EMI; opto-isolators prevent conducted electrical transients." },
                    { id: "M05-14-04", question: "4. Manufacturers of aircraft can ensure HIRF protection by.", options: ["a) advising operators of all points susceptible to deterioration due to corrosion, moisture ingress, flexing etc.", "b) designing specific avionic areas that are shielded against HIRF.", "c) ensuring all single wires are shielded with metal conduit."], answer: "b", explanation: "Designated Faraday cage / shielded avionic bays." },
                    { id: "M05-14-05", question: "5. Which of the following could be a primary cause of HIRF protection failure?", options: ["a) Broken or missing static wicks.", "b) Corrosion on bonding leads.", "c) Unserviceable radio filters."], answer: "c", explanation: "Radio/EMI filter degradation allows high-frequency energy penetration." },
                    { id: "M05-14-06", question: "6. Manufacturers of aircraft can ensure HIRF protection.", options: ["a) by designing specific avionic areas that are shielded against HIRF.", "b) by ensuring all single wires are shielded with metal conduit.", "c) by advising the operator of parts of the aircraft susceptible to degradation due to corrosion, moisture ingress, flexing etc."], answer: "a", explanation: "Shielded avionic zones." },
                    { id: "M05-14-07", question: "7. HIRF protection of LRUs is provided by.", options: ["a) internally shielded cables.", "b) built in filters and overvoltage circuits.", "c) built in filters only."], answer: "b", explanation: "Internal transient suppression filters and overvoltage protection circuits." },
                    { id: "M05-14-08", question: "8. To stop earth loops forming, you would.", options: ["a) earth both ends of the cable screen.", "b) leave both ends of the cable screen open circuit.", "c) earth only one end of the cable screen."], answer: "c", explanation: "Single-end screen grounding prevents circulating ground loops." },
                    { id: "M05-14-09", question: "9. An aircraft may have been HIRF affected.", options: ["a) A bonding load check is required.", "b) A static wick check is required.", "c) Test all radio frequencies for interference."], answer: "b", explanation: "Static wicks dissipate static charge and protect against discharge phenomena." },
                    { id: "M05-14-10", question: "10. Testing of HIRF on aircraft systems is done.", options: ["a) by periodically listening for interference on all systems.", "b) at and during production and testing (initial certification).", "c) only after a report of radio interference."], answer: "b", explanation: "High Intensity Radiated Field compliance is verified during initial aircraft type certification testing." },
                    { id: "M05-14-11", question: "11. When carrying out a bonding check on a surface protected by anodic film.", options: ["a) the film is conductive so no preparations are required.", "b) the anodic film should be removed locally to ensure a good contact.", "c) add a bonding factor to the result of the test to account for the resistance of the anodic film."], answer: "b", explanation: "Anodizing is an insulator; local film removal is necessary for low-resistance metal-to-metal bonding." },
                    { id: "M05-14-12", question: "12. When carrying cable looms containing co-axial cables.", options: ["a) avoid distortion to the co-axial cable to maintain the dielectric constant.", "b) the clamps must be no more than 1 metre apart.", "c) distortion of the outer sheath is allowed providing the inner cable is not affected."], answer: "a", explanation: "Deforming coaxial cable changes its characteristic impedance and dielectric geometry." },
                    { id: "M05-14-13", question: "13. When incorporating an aerial cable it must be.", options: ["a) in the centre of the other wires.", "b) outside the other wires for easy access.", "c) positioned separately from the loom."], answer: "c", explanation: "Antenna/coaxial RF cables are routed separately to prevent signal coupling." },
                    { id: "M05-14-14", question: "14. When carrying out airframe bonding checks as part of a program of HIRF prevention the airframe bonding resistance should be less than.", options: ["a) 100 milliohms.", "b) 1 ohm.", "c) 50 milliohms."], answer: "c", explanation: "CAAIP / airframe standards require bonding resistance under 50 milliohms (0.05 ohm)." },
                    { id: "M05-14-15", question: "15. Electromagnetic compatibility is achieved by.", options: ["a) shielding, screening, earthing, bonding and interference filters.", "b) coating in a conductive paint.", "c) enclosing the system with same frequency and strength of which screening is done."], answer: "a", explanation: "EMC is accomplished through comprehensive shielding, grounding, bonding, and filtering." },
                    { id: "M05-14-16", question: "16. To reduce HIRF on radio equipment.", options: ["a) ensure all static wicks are in place.", "b) periodically check bonding leads for condition.", "c) transmit on all radio frequencies to determine which frequencies are causing the interference."], answer: "a", explanation: "Static wicks play a role in discharging static electricity and maintaining airframe static balance." },
                    { id: "M05-14-17", question: "17. For braided cables, the amount of braiding.", options: ["a) must conform to the requirement for the shielding to cover at least 50% of the surface of the cable.", "b) keeps radiated power inside the emitting assembly or away from the susceptible circuit.", "c) is a trade-off design feature."], answer: "b", explanation: "Shielding braid contains internal radiation and blocks external interference." },
                    { id: "M05-14-18", question: "18. HIRF is acronym for.", options: ["a) Heavily Ionised Radio Frequencies.", "b) High Intensity Radiated Field.", "c) High Intensity Radio Frequencies."], answer: "b", explanation: "High Intensity Radiated Field (HIRF)." },
                    { id: "M05-14-19", question: "19. HF aerials are protected against lightning strike by.", options: ["a) current mode coupler.", "b) bus terminal.", "c) spark gap."], answer: "c", explanation: "Static dischargers / spark gaps protect antenna feeds against high-voltage surges." }
                ]
            },
            "M05-15": {
                title: "Typical Electronic/Digital Aircraft Systems",
                questions: [
                    { id: "M05-15-01", question: "1. An FMS system, besides controlling navigation, thrust and auto-nav, also provides.", options: ["a) GPWS warnings.", "b) dedicated status and warnings.", "c) take-off and landing warnings."], answer: "b", explanation: "FMS provides dedicated status and performance computations/warnings (not takeoff/landing or GPWS)." },
                    { id: "M05-15-02", question: "2. The minimum standards for aircraft instrumentation is set by.", options: ["a) CAA.", "b) ICAO.", "c) JAA."], answer: "c", explanation: "JAA / EASA standards govern airworthiness and instrumentation minimum requirements." },
                    { id: "M05-15-03", question: "3. EADI sky and ground display is provided by.", options: ["a) raster scan.", "b) stroke pulse.", "c) synthetic TV signals."], answer: "a", explanation: "Raster scan fills the background sky and ground colors on the EADI." },
                    { id: "M05-15-04", question: "4. HSI heading is valid if the heading flag is.", options: ["a) in view.", "b) green.", "c) out of view."], answer: "c", explanation: "Warning flags out of view indicate valid data; flags in view indicate failure." },
                    { id: "M05-15-05", question: "5. MFD is the abbreviation for.", options: ["a) Multi function display.", "b) Mandatory flight display.", "c) Master flight display."], answer: "a", explanation: "Multi-Function Display." },
                    { id: "M05-15-06", question: "6. A TCAS uses the radar mile definition in its calculations, which is.", options: ["a) 12.36 microsecond.", "b) 6.18 microsecond.", "c) 24.72 microsecond."], answer: "a", explanation: "One radar mile equals approximately 12.36 microseconds (round trip time)." },
                    { id: "M05-15-07", question: "7. GPS navigation uses a constellation of satellites that is made up of.", options: ["a) 21 active and 3 spare.", "b) 28 active and 7 spare.", "c) 23 active and 5 spare."], answer: "a", explanation: "Standard GPS constellation features 21 active satellites plus 3 active spares." },
                    { id: "M05-15-08", question: "8. An IRS is only certifed for alingment up to.", options: ["a) +88.45 and -88.45 degrees.", "b) +78.25 and -78.25 degrees.", "c) +60 and -60 degrees."], answer: "b", explanation: "Standard inertial reference systems align up to roughly 78.25 degrees latitude." },
                    { id: "M05-15-09", question: "9. The command bars on an ADI relate to.", options: ["a) roll indications.", "b) path being followed.", "c) path required."], answer: "c", explanation: "Flight director command bars show the required flight path." },
                    { id: "M05-15-10", question: "10. ECAM has at its heart.", options: ["a) a multi function symbol generator.", "b) a central maintenance computer.", "c) ACARS."], answer: "a", explanation: "Multi-function symbol generators drive ECAM displays." },
                    { id: "M05-15-11", question: "11. The recording medium in an FDR is.", options: ["a) copper foil coated with ferrite.", "b) a high density floppy disc.", "c) magnetic tape coated with ferrite."], answer: "c", explanation: "Ferrite-coated magnetic tape or solid-state memory." },
                    { id: "M05-15-12", question: "12. An FMS databank memory is updated.", options: ["a) every 365 days.", "b) every 28 days.", "c) every 32 days."], answer: "b", explanation: "AIRAC cycle navigation databases update every 28 days." },
                    { id: "M05-15-13", question: "13. What does the CADC feed?", options: ["a) cabin pressure controller sensor / machmeter / altimeter.", "b) Altimeter / FMS / secondary radar.", "c) standby altimeter / machmeter."], answer: "a", explanation: "Central Air Data Computer feeds cabin pressure, machmeter, altimeter, and displays." },
                    { id: "M05-15-14", question: "14. In a Flight Management System (FMS), data is input manually to the computing system through the.", options: ["a) Data Acquisition Unit.", "b) Electronic Centralised Aircraft Monitoring control panel.", "c) Control and Display Unit."], answer: "c", explanation: "Control and Display Unit (CDU)." },
                    { id: "M05-15-15", question: "15. In a Global Positioning System (GPS), the number of satellites required to achieve a 3 dimensional fix is.", options: ["a) 2.", "b) 3.", "c) 4."], answer: "c", explanation: "4 satellites are required for 3D position and clock bias correction." },
                    { id: "M05-15-16", question: "16. In a Global Positioning System (GPS), each satellite transmission identifies the satellite using a.", options: ["a) different channel frequency.", "b) pseudo random code.", "c) whisper shout method."], answer: "b", explanation: "Code Division Multiple Access (CDMA) uses unique pseudo-random noise (PRN) codes." },
                    { id: "M05-15-17", question: "17. In a Global Positioning System (GPS) satellites below the Mask Angle are ignored as these may cause.", options: ["a) range errors.", "b) clock errors.", "c) ephemeris errors."], answer: "a", explanation: "Low-elevation satellites suffer excessive atmospheric refraction causing range errors." },
                    { id: "M05-15-18", question: "18. Information required by a Flight Management System (FMS) to function correctly is indicated on the display by.", options: ["a) dashes.", "b) a flashing cursor.", "c) boxes."], answer: "c", explanation: "Mandatory FMS data entry fields are boxed (____)." },
                    { id: "M05-15-19", question: "19. A flight data recorder can obtain information from aircraft instruments.", options: ["a) provided there is adequate damping.", "b) provided there is adequate isolation.", "c) by direct connection to the instruments."], answer: "b", explanation: "Source isolation prevents FDR faults from affecting aircraft instruments." },
                    { id: "M05-15-20", question: "20. The inputs and outputs of a CADC are.", options: ["a) pitot and static in; altitude, attitude, CAS and VS out.", "b) pitot and static in; altitude, CAS, mach and VS out.", "c) pitot in; static, altitude, mach, CAS and VS out."], answer: "b", explanation: "Inputs: pitot/static. Outputs: pressure altitude, calibrated airspeed, Mach, vertical speed." },
                    { id: "M05-15-21", question: "21. EICAS provides the following:.", options: ["a) Engine parameters and engine warnings only.", "b) Engine parameters and system warnings only.", "c) Engine parameters only."], answer: "b", explanation: "Engine parameters and system caution/warning alerts." },
                    { id: "M05-15-22", question: "22. A central maintenance computer provides.", options: ["a) ground and flight monitoring and testing on an on-board computer.", "b) ground and BITE testing using a portable control panel.", "c) display of system warnings and cautions."], answer: "a", explanation: "On-board computer for central fault recording and monitoring." },
                    { id: "M05-15-23", question: "23. The rising runway is positioned from information derived from.", options: ["a) barometric height.", "b) radio altimeter.", "c) vertical speed."], answer: "b", explanation: "Radio altimeter feeds precision height for the rising runway display during landing." },
                    { id: "M05-15-24", question: "24. Where are the Digital Flight Data Recorder outputs supplied to?", options: ["a) The recording unit.", "b) There are no outputs.", "c) Flight instruments."], answer: "b", explanation: "DFDR data is sealed/stored internally and retrieved via ground readout." },
                    { id: "M05-15-25", question: "25. FMS failure and warnings are.", options: ["a) EFIS warnings only.", "b) displayed on EICAS.", "c) engine warnings only."], answer: "b", explanation: "FMS alerts are routed and displayed on EICAS/ECAM." },
                    { id: "M05-15-26", question: "26. Flight director command bars are moved to the correct position by.", options: ["a) calibration.", "b) position feedback.", "c) amplifier gain."], answer: "b", explanation: "Servo position feedback loops drive flight director bars." },
                    { id: "M05-15-27", question: "27. What information is required before completion of the alignment of an Inertial Navigation System?", options: ["a) Aircraft present position.", "b) Heading and attitude.", "c) Aircraft present position and heading."], answer: "a", explanation: "Initial present position (latitude/longitude) must be entered." },
                    { id: "M05-15-28", question: "28. IRS accelerometers are mounted.", options: ["a) 90° to each other.", "b) 45° to each other.", "c) 60° to each other."], answer: "a", explanation: "Orthogonal mounting at 90 degrees." },
                    { id: "M05-15-29", question: "29. An FMS navigation database is updated.", options: ["a) once a month.", "b) every 28 days.", "c) at the operators request."], answer: "b", explanation: "Every 28 days (AIRAC cycle)." },
                    { id: "M05-15-30", question: "30. A single failure of a fly-by-wire system.", options: ["a) will reduce operational heights and speeds.", "b) will limit the flight profile.", "c) has no effect on aircraft operation."], answer: "c", explanation: "Multi-channel redundant FBW systems tolerate single failures seamlessly." },
                    { id: "M05-15-31", question: "31. Fly-by-wire load alleviation function in turbulent conditions will result in.", options: ["a) spoilers moving symmetrically upwards.", "b) ailerons moving symmetrically upwards.", "c) ailerons and spoilers moving symmetrically upwards."], answer: "c", explanation: "Gust/load alleviation deploys ailerons and spoilers symmetrically." },
                    { id: "M05-15-32", question: "32. Fly-by-wire roll control is achieved by.", options: ["a) spoilers and ailerons.", "b) ailerons.", "c) spoilers."], answer: "a", explanation: "Roll control combines aileron and spoiler actuation." },
                    { id: "M05-15-33", question: "33. The movement of fly-by-wire control surfaces are.", options: ["a) hydraulically controlled and electrically actuated.", "b) both electrically controlled and electrically actuated.", "c) electrically controlled and hydraulically actuated."], answer: "c", explanation: "Electrical signaling with hydraulic power actuators." },
                    { id: "M05-15-34", question: "34. An FMS system, besides controlling navigation, thrust and auto-nav, also provides.", options: ["a) dedicated status warnings.", "b) take-off and landing warnings.", "c) GPWS warnings."], answer: "a", explanation: "Dedicated status and performance warnings." },
                    { id: "M05-15-35", question: "35. If an EFIS has 3 symbol generators. What is the purpose of the 3rd symbol generator?", options: ["a) Comparison with No.1 symbol generator.", "b) Parity function.", "c) Standby."], answer: "c", explanation: "Hot-standby redundant third symbol generator." },
                    { id: "M05-15-36", question: "36. FMS operational program is updated every.", options: ["a) 90 days.", "b) 28 days.", "c) 7 days."], answer: "b", explanation: "28-day cycle." },
                    { id: "M05-15-37", question: "37. An FDR fitted to a helicopter begins recording.", options: ["a) when power is applied to the aircraft.", "b) on take-off.", "c) on engine start-up."], answer: "c", explanation: "Recording initiates upon engine start." },
                    { id: "M05-15-38", question: "38. The FMS databases consist of.", options: ["a) one navigation and one performance database.", "b) one performance and two navigation databases.", "c) two performance and one navigation database."], answer: "b", explanation: "Performance database and dual navigation databases." },
                    { id: "M05-15-39", question: "39. The FMS can update the IRS position outputs by using information from either.", options: ["a) VOR and DME only.", "b) GPS, DME, LOC and VOR.", "c) DME and GPS only."], answer: "b", explanation: "Multi-sensor position updating (GPS, DME/DME, VOR/DME, LOC)." },
                    { id: "M05-15-40", question: "40. The accepted error from INS/IRS is.", options: ["a) 3 miles / hour + 3 miles.", "b) 2 miles per hour + 3 miles.", "c) 1 mile/hour+3 miles."], answer: "a", explanation: "Standard drift rate specification (~3 nm/hr)." },
                    { id: "M05-15-41", question: "41. Before an IRS can complete the alignment sequence.", options: ["a) the current present position must be entered.", "b) either the last or current position must be entered.", "c) the shutdown present position must be entered."], answer: "a", explanation: "Current present position entry required." },
                    { id: "M05-15-42", question: "42. What warnings can an FMS provide?", options: ["a) Discrete warnings.", "b) Spurious faults.", "c) Ground faults only."], answer: "a", explanation: "Discrete system warnings." },
                    { id: "M05-15-43", question: "43. Electronic Centralised Aircraft Monitoring System.", options: ["a) performs in-flight and ground tests of aircraft systems by carrying out a BITE interrogation.", "b) performs in-flight BITE interrogation only.", "c) give red warnings and amber cautions to display system status."], answer: "c", explanation: "Displays red warnings and amber cautions." },
                    { id: "M05-15-44", question: "44. The control of the speed or rate that the flight director command bars move can be controlled by.", options: ["a) position feedback.", "b) rate or velocity feedback.", "c) amplifier gain."], answer: "b", explanation: "Rate / velocity damping feedback." },
                    { id: "M05-15-45", question: "45. The Centralised Aircraft Monitoring System uses the maintenance mode of operation.", options: ["a) on the ground only.", "b) in the air only.", "c) either in the air or on the ground."], answer: "a", explanation: "Maintenance mode is restricted to ground operations." },
                    { id: "M05-15-46", question: "46. The third EFIS Symbol Generator is operated.", options: ["a) in an emergency.", "b) with EICAS.", "c) as a standby to the No1 and No2 system."], answer: "c", explanation: "Standby SG role." },
                    { id: "M05-15-47", question: "47. EFIS displays of the right hand and left hand displays are compared by comparators in the.", options: ["a) FMS.", "b) EICAS.", "c) Symbol Generators."], answer: "c", explanation: "Symbol Generators run comparison monitors." },
                    { id: "M05-15-48", question: "48. What is the approximate earth rate?", options: ["a) 10°/hour.", "b) 5°/hour.", "c) 15°/hour."], answer: "c", explanation: "Earth rotation rate is 15 degrees per hour." },
                    { id: "M05-15-49", question: "49. An IRS has.", options: ["a) two or three accelerometers depending on the system.", "b) three accelerometers.", "c) two accelerometers."], answer: "b", explanation: "Three orthogonal accelerometers." },
                    { id: "M05-15-50", question: "50. IRS Laser Ring Gyros provide.", options: ["a) rate of movement about an axis.", "b) displacement about an axis.", "c) both rate and displacement about an axis."], answer: "a", explanation: "Rate gyros measure angular rotation rate." },
                    { id: "M05-15-51", question: "51. What are the outputs of a Digital ADC?", options: ["a) TAS, MACH, Altitude and TAT.", "b) TAS, MACH, Altitude, TAT and SAT.", "c) TAS, MACH and Altitude."], answer: "b", explanation: "Total Air Temperature (TAT) and Static Air Temperature (SAT) along with airspeeds and altitude." },
                    { id: "M05-15-52", question: "52. Fly By Wire systems in the fully active mode, the actuators will.", options: ["a) both be active.", "b) both be in damping mode, awaiting control inputs.", "c) one in active mode, one in damping mode."], answer: "a", explanation: "All primary control actuators operate in active redundant mode." },
                    { id: "M05-15-53", question: "53. On a Fly By Wire system, what controls the stab trim?", options: ["a) ELAC and SEC.", "b) SEC.", "c) ELAC."], answer: "a", explanation: "ELAC and SEC computers manage stabilizer and control surface positioning." },
                    { id: "M05-15-54", question: "54. The minimum requirement for a cockpit voice recorder to begin operating is.", options: ["a) on engine start-up.", "b) on commencing the takeoff roll.", "c) once established in the en-route climb."], answer: "a", explanation: "CVR starts upon engine start." },
                    { id: "M05-15-55", question: "55. Aircraft Communications Addressing and Reporting Systems is used to.", options: ["a) download aircraft status reports.", "b) make telephone calls.", "c) allow the pilot of an aircraft to talk to base."], answer: "a", explanation: "ACARS downlinks digital operational and maintenance reports." },
                    { id: "M05-15-56", question: "56. B-RNAV system must be capable of.", options: ["a) holding six waypoints.", "b) displaying distance and bearing to waypoint.", "c) reversing the waypoints for."], answer: "b", explanation: "Basic RNAV navigation display requirements." },
                    { id: "M05-15-57", question: "57. The basic principle of radar is based upon.", options: ["a) the amount of power in the signal returned.", "b) the time delay between outward and returning pulse.", "c) ultrasonic wave propagation."], answer: "b", explanation: "Pulse transit time delay determines range." },
                    { id: "M05-15-58", question: "58. What systems does the ADC feed?", options: ["a) Altimeter / FMS / secondary radar.", "b) Cabin pressure controller sensor / machmeter / Altimeter.", "c) Standby altimeter/machmeter."], answer: "b", explanation: "Cabin pressure, machmeter, and altimeter." },
                    { id: "M05-15-59", question: "59. Which systems does a modern ADC give information to?", options: ["a) EFIS.", "b) EICAS.", "c) Flight control computer, Air Data Instrument, Engine systems."], answer: "c", explanation: "Feeds flight controls, instruments, and engine systems." },
                    { id: "M05-15-60", question: "60. Where do the outputs from a DADC go?", options: ["a) EHSI.", "b) EADI.", "c) IRMP: Inertial Reference Mode Panel."], answer: "b", explanation: "Air data feeds primary flight displays (EADI/PFD)." },
                    { id: "M05-15-61", question: "61. How many satellite signals are required to achieve precise 3D positioning?", options: ["a) 4.", "b) 5.", "c) 6."], answer: "a", explanation: "4 satellites for 3D position." },
                    { id: "M05-15-62", question: "62. The minimum requirement for an aeroplane CVR is.", options: ["a) from power on.", "b) from engine start.", "c) from beginning of take off roll."], answer: "b", explanation: "From engine start." },
                    { id: "M05-15-63", question: "63. An Inertial Navigation System (INS/IRS) computes distance from acceleration by.", options: ["a) two successive integrations.", "b) a simple integration.", "c) a differentiation followed by an integration."], answer: "a", explanation: "Acceleration integrated once gives velocity, twice gives distance." },
                    { id: "M05-15-64", question: "64. Before the aircraft is moved from the loading pier the pilot must.", options: ["a) insert the longitude and latitude of the first waypoint into the INS.", "b) set the altitude to be fed into the INS.", "c) insert the latitude and longitude of the pier into the IRS."], answer: "c", explanation: "Enter gate/pier present position coordinates into IRS." },
                    { id: "M05-15-65", question: "65. An IRS has.", options: ["a) accelerometers and gyros fixed to a the airframe.", "b) accelerometers fixed to the airframe and gyros on a stable platform.", "c) accelerometers on a stable platform and gyros fixed to the airframe."], answer: "a", explanation: "Strapdown IRS has gyros and accelerometers rigidly fixed to the airframe structure." },
                    { id: "M05-15-66", question: "66. An IRS system requires data for wind computation from.", options: ["a) Doppler System.", "b) satellites.", "c) central Air Data Computer."], answer: "c", explanation: "Air Data Computer provides airspeed/temperature for true air vector and wind calculation." },
                    { id: "M05-15-67", question: "67. The FMS carries out a Rho/Theta navigation function, the purpose of this is to.", options: ["a) update the IRS system with an accurate position fix of latitude and longitude.", "b) to update the VOR and DME systems with an accurate position fix.", "c) to update the EMS with the new lateral flight profile for the flight plan."], answer: "a", explanation: "Rho-Theta (distance and bearing from VOR/DME) updates inertial position." },
                    { id: "M05-15-68", question: "68. The FMS is updated.", options: ["a) automatically by update data from the ACARS.", "b) by an aircraft engineer updating the system either by a magnetic tape or floppy disc.", "c) by the aircrew by reference to the Tech Log."], answer: "b", explanation: "Database updates loaded via data loader / media by maintenance personnel." },
                    { id: "M05-15-69", question: "69. Pitch Control of a fly by wire system is achieved by.", options: ["a) stabilizer only.", "b) elevators only.", "c) stabilizer and elevator."], answer: "c", explanation: "Combined stabiliser and elevator control." },
                    { id: "M05-15-70", question: "70. In a fly by wire system, if the pilot control input is derived from a side stick controller:.", options: ["a) there is no control surface feedback to the side stick.", "b) control surface feedback is fed to the side stick.", "c) there will be only control surface feedback to the side stick after a computer failure."], answer: "a", explanation: "Passive side sticks provide no mechanical feedback." },
                    { id: "M05-15-71", question: "71. A basic IRS platform has.", options: ["a) 3 accelerometers and 2 laser gyros.", "b) 2 Accelerometers and 3 laser gyros.", "c) 3 accelerometers and 3 laser gyros."], answer: "c", explanation: "3 accelerometers and 3 laser gyros (triaxial setup)." },
                    { id: "M05-15-72", question: "72. What must be entered into the IRS before the aircraft can be moved?", options: ["a) Flight plan.", "b) Present position.", "c) Cruise height."], answer: "b", explanation: "Present position." },
                    { id: "M05-15-73", question: "73. The FMS Operational Database is.", options: ["a) updated once a month.", "b) is fed with information on aircraft weight, cruise altitude and cost index before take off.", "c) needs no update information."], answer: "b", explanation: "Flight-specific performance data (weight, cost index, cruise altitude)." },
                    { id: "M05-15-74", question: "74. Control surface feedback is fed back to.", options: ["a) the Flight Control Computer only.", "b) the side stick controller only.", "c) the Flight Control Computer and side stick controller."], answer: "a", explanation: "Flight Control Computers monitor surface position feedback." },
                    { id: "M05-15-75", question: "75. The accelerometer output in an INS/IRS is.", options: ["a) integrated once to give distance.", "b) integrated twice to give velocity.", "c) integrated twice to give distance."], answer: "c", explanation: "Twice integrated to give distance." },
                    { id: "M05-15-76", question: "76. An INS/IRS Battery Unit provides.", options: ["a) standby power only whilst in flight.", "b) standby power when airborne and on the ground.", "c) standby power only on the ground."], answer: "b", explanation: "Uninterruptible emergency battery backup for alignment and flight." },
                    { id: "M05-15-77", question: "77. If a fly by wire actuator loses hydraulic power the control surface will.", options: ["a) automatically move back to the neutral position.", "b) remain rigid in the failure position.", "c) remain in the failure position but may move due to aerodynamic pressure."], answer: "c", explanation: "Damping mode allows free float against aerodynamic loads." },
                    { id: "M05-15-78", question: "78. IRS alignment.", options: ["a) takes up to 10 minutes and the present position can be entered at any time during alignment.", "b) takes up to 10 minutes and present position must be entered before alignment.", "c) takes up to 10 minutes and the previous flight shut down present position is used for the alignment."], answer: "a", explanation: "課本指出只要在對準期間輸入即可，不需要在對準之前，也不可使用上次位置，需輸入或確認當前位置." },
                    { id: "M05-15-79", question: "79. A fault light appears on the IRS Mode Selector Unit during the alignment sequence. The correct action is.", options: ["a) immediately switch off and select the standby system.", "b) select HDG/STS on the Inertial System Display Unit (ISDU), observe the action code in the right alpha/numeric display.", "c) refer to the warning display on the EICAS/ECAM system."], answer: "b", explanation: "Check ISDU action / fault codes." },
                    { id: "M05-15-80", question: "80. A FMS has a total of how many Databases.", options: ["a) 2.", "b) 4.", "c) 1."], answer: "a", explanation: "Navigation and Performance databases." },
                    { id: "M05-15-81", question: "81. Fly by wire High Speed protection is.", options: ["a) to prevent tuck under.", "b) to increase the pitch angle as speed increases.", "c) to prevent high speed stall."], answer: "a", explanation: "Prevents excessive Mach/speed tuck under and overspeed." },
                    { id: "M05-15-82", question: "82. An IRS Laser gyro provides.", options: ["a) detection of the rate of movement about an aircraft axis.", "b) detection of the earths gravitational force to establish true north.", "c) detection of the earths rotation to establish true north."], answer: "a", explanation: "Rotation rate detection." },
                    { id: "M05-15-83", question: "83. The left and right cockpit displays.", options: ["a) are supplied from separate Symbol Generators at all times.", "b) are supplied from the same Symbol Generator.", "c) will only be supplied from the same symbol generator when all other symbol generators have failed."], answer: "c", explanation: "Automatic reconfiguration utilizes remaining SGs upon failure." },
                    { id: "M05-15-84", question: "84. A single failure of a fly by wire control surface computer will.", options: ["a) cause the system to revert to an alternate law of operation.", "b) not have any operational effect on the system.", "c) cause the system to revert to a direct law of operation."], answer: "b", explanation: "Redundant channels ensure fault tolerance without operational loss." },
                    { id: "M05-15-85", question: "85. What are the outputs from digital clocks used for?", options: ["a) Flight data acquisition unit, Flight management computer and Voice recorder.", "b) VOR, ILS and DME.", "c) Weather radar, TCAS and ACARS."], answer: "a", explanation: "Real-time GMT timestamping for FDAU, FMC, and CVR." },
                    { id: "M05-15-86", question: "86. A full operation system BITE check will carry out a internal system test that ensures the system meets design requirements and is operational.", options: ["a) but will not move the controls.", "b) as well as checking full system and will move the controls to their stops.", "c) as well as checking full system but will not move the controls to their stops."], answer: "c", explanation: "BITE exercises logic and performance without driving surfaces against mechanical stops." },
                    { id: "M05-15-87", question: "87. If on a flight deck EFIS system all the displays were missing one bit of information. This is most likely to be.", options: ["a) the input sensor bus and display controller.", "b) the symbol generator and display.", "c) the display controller and symbol generator."], answer: "c", explanation: "Display controller and symbol generator coordination failure." },
                    { id: "M05-15-88", question: "88. A centralised monitoring computer system is used.", options: ["a) to test system during flight and for BITE test of systems on the ground using a carry on control unit.", "b) to test systems in flight and on the ground using a centralised on board control unit.", "c) testing systems on the ground only."], answer: "b", explanation: "Centralized on-board computer monitoring in flight and ground." },
                    { id: "M05-15-89", question: "89. In an EFIS display, the lines, scales, indicator and synoptic are generated by.", options: ["a) raster scan.", "b) synoptic scan.", "c) stroke pulse."], answer: "c", explanation: "Stroke generator creates sharp vector lines and characters." },
                    { id: "M05-15-90", question: "90. The method of producing (white) lines for aircraft symbols, V/S scale etc. on an EADI is by.", options: ["a) raster scan.", "b) trapezoidal input.", "c) stroke pulse."], answer: "c", explanation: "Stroke writing." },
                    { id: "M05-15-91", question: "91. In modern aircraft, the output from the clock is used.", options: ["a) to synchronise the signals on the control bus.", "b) to provide a clock pulse for CRT.", "c) to give GMT details to the flight recorder and other systems."], answer: "c", explanation: "GMT time synchronization." },
                    { id: "M05-15-92", question: "92. As a minimum requirement, when must a cockpit voice recorder start recording?", options: ["a) From the start of the aircraft take off run.", "b) After take off when airborne.", "c) On first engine start."], answer: "c", explanation: "Engine start." },
                    { id: "M05-15-93", question: "93. The operational database of the FMS may have to be modified in flight.", options: ["a) It cannot be modified in flight.", "b) by the pilot.", "c) automatically by the DADC."], answer: "a", explanation: "Operational navigation databases are fixed during flight." },
                    { id: "M05-15-94", question: "94. CADC outputs are.", options: ["a) altitude, vertical speed, IAS, mach no.", "b) altitude, vertical speed, TAS, CAS, mach no, SAT, TAT.", "c) altitude ,vertical speed, angle of attack, TAT, SAT."], answer: "b", explanation: "Comprehensive air data outputs." },
                    { id: "M05-15-95", question: "95. If one EICAS CRT fails.", options: ["a) the FMS CDU will display the failed CRT data.", "b) the remaining CRT will display primary EICAS data.", "c) the standby CRT will automatically take over."], answer: "b", explanation: "Reversionary display modes consolidate critical engine parameters onto the remaining active screen." },
                    { id: "M05-15-96", question: "96. Variations in light on EFIS displays are compensated for by.", options: ["a) An external light dependant resistor mounted on the flight deck compensating for all displays in a parallel-parallel format.", "b) manual adjustment by flight crew on EFIS controller.", "c) integrated light dependant resistors in the display compensating for each display individual."], answer: "a", explanation: "Flight deck ambient light sensors adjust display brightness." },
                    { id: "M05-15-97", question: "97. A method used in modern aircraft for reporting in flight faults to an engineering and monitoring ground station is.", options: ["a) TCAS II.", "b) ACARS.", "c) TAWS."], answer: "b", explanation: "ACARS fault reporting." },
                    { id: "M05-15-98", question: "98. The self test function on an EFIS system can be tested.", options: ["a) on the ground only.", "b) in the air only.", "c) in the air and on the ground."], answer: "c", explanation: "Self-test available across operational phases." },
                    { id: "M05-15-99", question: "99. Each of the symbol generator outputs in an EFIS system can be.", options: ["a) displayed on each individual display.", "b) only no. 2 can be displayed on the no.1.", "c) can not be interchanged."], answer: "a", explanation: "Symbol generator switching allows cross-display output." },
                    { id: "M05-15-100", question: "100. BITE tests are inhibited for ground use during.", options: ["a) forward motion.", "b) gear retraction.", "c) take-off."], answer: "c", explanation: "Inhibited during takeoff / critical phases." },
                    { id: "M05-15-101", question: "101. Modern aircraft with electronic displays would display information on airframe and engine on which system?", options: ["a) Electronic centralised aircraft monitoring system (ECAM).", "b) Flight management system.", "c) EADI."], answer: "a", explanation: "ECAM / EICAS." },
                    { id: "M05-15-102", question: "102. The Flight data recorder starts recording.", options: ["a) after take off.", "b) on aircraft roll out from stand.", "c) after the first engine has started."], answer: "c", explanation: "First engine start." },
                    { id: "M05-15-103", question: "103. Data to flight data recorder can be taken from a communal data bus if.", options: ["a) the power is within flight data recorder limits.", "b) it goes directly to it.", "c) source isolation has been considered."], answer: "c", explanation: "Source isolation." },
