        // 當前狀態變數
        let currentModuleKey = "M05-01";
        let currentIndex = 0;
        let score = 0;
        let userAnswers = {};

        // 初始化使用者答案記錄結構
        function initUserAnswers() {
            for (let key in allQuestionBanks) {
                userAnswers[key] = new Array(allQuestionBanks[key].questions.length).fill(null);
            }
        }
        initUserAnswers();

        // DOM 元素對應
        const moduleSelect = document.getElementById("module-select");
        const moduleBadge = document.getElementById("module-badge");
        const moduleTitle = document.getElementById("module-title");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const explanationBox = document.getElementById("explanation-box");
        const explanationText = document.getElementById("explanation-text");
        const currentIdxEl = document.getElementById("current-idx");
        const totalCntEl = document.getElementById("total-cnt");
        const quizContainer = document.getElementById("quiz-container");
        const resultContainer = document.getElementById("result-container");
        const scoreText = document.getElementById("score-text");
        const resultTotal = document.getElementById("result-total");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");

        function getCurrentQuestions() {
            return allQuestionBanks[currentModuleKey].questions;
        }

        function loadQuestion() {
            const questions = getCurrentQuestions();
            const q = questions[currentIndex];
            const currentAnswers = userAnswers[currentModuleKey];

            moduleBadge.textContent = currentModuleKey;
            moduleTitle.textContent = allQuestionBanks[currentModuleKey].title;
            currentIdxEl.textContent = currentIndex + 1;
            totalCntEl.textContent = questions.length;
            questionText.textContent = q.question;
            optionsContainer.innerHTML = "";

            q.options.forEach((opt) => {
                const optionLetter = opt.charAt(0).toLowerCase();
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt;

                if (currentAnswers[currentIndex] !== null) {
                    btn.disabled = true;
                    if (optionLetter === q.answer.toLowerCase()) {
                        btn.classList.add("correct");
                    } else if (optionLetter === currentAnswers[currentIndex]) {
                        btn.classList.add("wrong");
                    }
                } else {
                    btn.onclick = () => selectOption(optionLetter, q.answer.toLowerCase());
                }
                optionsContainer.appendChild(btn);
            });

            if (currentAnswers[currentIndex] !== null) {
                explanationText.textContent = q.explanation || "暫無解析說明。";
                explanationBox.classList.remove("hidden");
            } else {
                explanationBox.classList.add("hidden");
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.textContent = currentIndex === questions.length - 1 ? "查看成績" : "下一題";
        }

        function selectOption(selected, correct) {
            const currentAnswers = userAnswers[currentModuleKey];
            currentAnswers[currentIndex] = selected;
            loadQuestion();
        }

        function nextQuestion() {
            const questions = getCurrentQuestions();
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                // 計算總得分
                let currentScore = 0;
                const currentAnswers = userAnswers[currentModuleKey];
                questions.forEach((q, idx) => {
                    if (currentAnswers[idx] === q.answer.toLowerCase()) {
                        currentScore++;
                    }
                });

                quizContainer.classList.add("hidden");
                resultContainer.classList.remove("hidden");
                scoreText.textContent = currentScore;
                resultTotal.textContent = questions.length;
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function switchModule(moduleKey) {
            currentModuleKey = moduleKey;
            currentIndex = 0;
            resultContainer.classList.add("hidden");
            quizContainer.classList.remove("hidden");
            loadQuestion();
        }

        function restartQuiz() {
            userAnswers[currentModuleKey] = new Array(getCurrentQuestions().length).fill(null);
            currentIndex = 0;
            resultContainer.classList.add("hidden");
            quizContainer.classList.remove("hidden");
            loadQuestion();
        }

        // 初始化首次載入
        loadQuestion();
    </script>
