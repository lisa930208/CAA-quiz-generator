                    { id: "M05-15-104", question: "104. A central fault display system should be available through.", options: ["a) a bite test.", "b) a central bite test box with clear LED indications.", "c) a easily accessible multifunction control display unit."], answer: "c", explanation: "MCDU / CMC interface." },
                    { id: "M05-15-105", question: "105. A flight data recorder should be capable of recording.", options: ["a) the last 25 hours.", "b) the last 25 hours of aircraft flight.", "c) the last 25 hours with engines running."], answer: "c", explanation: "25 hours continuous recording capacity." },
                    { id: "M05-15-106", question: "106. BITE for ground use only is switched off.", options: ["a) on take-off.", "b) when brakes are released.", "c) when undercarriage up."], answer: "a", explanation: "Takeoff inhibition." },
                    { id: "M05-15-107", question: "107. During normal functioning of an ECAM system the engine data shown on the Engine/Warning display comes from the.", options: ["a) EFIS channel of DMC3.", "b) ECAM channel of DMC1.", "c) ECAM channel of DMC3."], answer: "c", explanation: "Display Management Computer (DMC) architecture." },
                    { id: "M05-15-108", question: "108. Using I.N.S. an aircraft flies.", options: ["a) rhumb line.", "b) course directed by ground station.", "c) great circle route."], answer: "c", explanation: "Inertial navigation computes great circle routes." },
                    { id: "M05-15-109", question: "109. What warnings can an FMS provide?", options: ["a) Ground faults only.", "b) Discrete warnings.", "c) Spurious faults."], answer: "b", explanation: "Discrete warnings." },
                    { id: "M05-15-110", question: "110. Aircraft heading (HDG) is.", options: ["a) the angle between True North and the longitudinal axis of the aircraft.", "b) the angle between True North and the actual track.", "c) the angle between True North and the desired track."], answer: "a", explanation: "Definition of heading relative to longitudinal axis." },
                    { id: "M05-15-111", question: "111. For an IRS System to pass the Alignment System Performance Test, the latitude entered must be within given limits of the.", options: ["a) latitude computed by IRU.", "b) entered present latitude and longitude must agree with the latitude and longitude at last power down.", "c) the No 1 and No 2 must both have the same latitude and longitude present position entered."], answer: "a", explanation: "Comparison against computed IRU limits." },
                    { id: "M05-15-112", question: "112. Control Display Unit (CDU ) selection of TKE (Track Angle Error), displays.", options: ["a) difference in degrees that the aircraft is to the right or left of the desired track.", "b) distance perpendicular from the selected track.", "c) difference in degrees from True North in a clockwise direction from the desired track."], answer: "a", explanation: "Track Angle Error angle." },
                    { id: "M05-15-113", question: "113. In the EICAS system, when is the maintenance mode available?", options: ["a) Lower screen only - only available on the ground.", "b) In flight.", "c) On the upper and lower screens - only available on the ground."], answer: "a", explanation: "Lower screen ground maintenance pages." },
                    { id: "M05-15-114", question: "114. On a modern aircraft when are BITE checks carried out?", options: ["a) Continuously when system is in use.", "b) After engine shut down.", "c) Only when BITE selected."], answer: "a", explanation: "Continuous background BITE monitoring." },
                    { id: "M05-15-115", question: "115. In an IN system, the purpose of the stable platform is to.", options: ["a) provide attitude reference.", "b) prevent unwanted acceleration affecting the accelerometers.", "c) stop the gyros from toppling."], answer: "b", explanation: "Isolate accelerometers from aircraft tilting/accelerations (g-command isolation)." },
                    { id: "M05-15-116", question: "116. An IN system requires data from the.", options: ["a) Doppler system.", "b) airdata computer.", "c) satellites."], answer: "b", explanation: "Air Data Computer inputs." },
                    { id: "M05-15-117", question: "117. TK (cross track) is the.", options: ["a) actual track across the earths surface.", "b) angle in degrees that the aircraft track is left or right of desired track.", "c) perpendicular distance from the desired track."], answer: "c", explanation: "Cross-track error distance." },
                    { id: "M05-15-118", question: "118. The output of an INS can be fed to the.", options: ["a) attitude indicators.", "b) altimeters.", "c) vertical speed indicators."], answer: "a", explanation: "Attitude and heading references." },
                    { id: "M05-15-119", question: "119. The three accelerometers on a strapdown system are mounted.", options: ["a) 90° to each other.", "b) parallel to each other.", "c) 120° apart."], answer: "a", explanation: "90 degrees orthogonal." },
                    { id: "M05-15-120", question: "120. Gyro-compassing is the term used for.", options: ["a) self-alignment in the vertical.", "b) use of the gyro-magnetic compass system to align the platform.", "c) self-alignment in azimuth."], answer: "c", explanation: "Sensing Earth rotation to find True North in azimuth." },
                    { id: "M05-15-121", question: "121. Electronic Centralized Aircraft Monitoring System operates to.", options: ["a) give red warnings and amber cautions to display system status.", "b) perform in-flight BITE only.", "c) perform in-flight and ground tests of aircraft systems by carrying out a BITE."], answer: "a", explanation: "Alerting status." },
                    { id: "M05-15-122", question: "122. The Centralized Aircraft Monitoring System uses the maintenance mode of operation.", options: ["a) on the ground only.", "b) in the air only.", "c) either ground or air."], answer: "a", explanation: "Ground only." },
                    { id: "M05-15-123", question: "123. If part of a display is lost on a CRT, this could be due to.", options: ["a) an inoperative symbol generator or control panel.", "b) an inoperative symbol generator or input sensor.", "c) loss of power to the CRT."], answer: "b", explanation: "Symbol generator or input sensor failure." },
                    { id: "M05-15-124", question: "124. A cyclic test (watch dog) should be performed for ECAM.", options: ["a) via MCDU.", "b) during power up.", "c) during flight."], answer: "c", explanation: "Continuous watchdog timers and cyclic tests run during flight." },
                    { id: "M05-15-125", question: "125. How does the symbol generator detect a program error?", options: ["a) By looking at the even parity without error.", "b) By looking at the odd parity without error.", "c) By check sum bites for error detect."], answer: "b", explanation: "c通常用於資料傳輸的錯誤偵測，非符號產生器的程式錯誤偵測，通常使用奇同位." },
                    { id: "M05-15-126", question: "126. Relationship of CMCs to BITE systems is best described as.", options: ["a) CMCs replaced but is not related to the older BITE system.", "b) CMCs monitors the individual BITE systems and presents data.", "c) CMCs modifies and upgrades BITE systems."], answer: "b", explanation: "Central Maintenance Computer aggregates individual system BITE data." },
                    { id: "M05-15-127", question: "127. An IRU interface test is carried out.", options: ["a) in the air.", "b) only on the ground.", "c) on the ground or in the air."], answer: "b", explanation: "Ground testing." },
                    { id: "M05-15-128", question: "128. FMS system gives warning indications for.", options: ["a) take off and landings only.", "b) any flight phase.", "c) cruise."], answer: "c", explanation: "a起飛及降落通常依賴其他系統，FMS警告非此階段主焦點。b描述太廣泛。c訊號階段為飛行中最長階段，FMS持續監控，若有問題，會發出警告。." },
                    { id: "M05-15-129", question: "129. FMS CDU warnings are.", options: ["a) fail and MSG.", "b) OFST and Fail.", "c) MSG, fail and OFST."], answer: "c", explanation: "Message, fail, and offset alerts." },
                    { id: "M05-15-130", question: "130. CMC (central maintenance computer) works to.", options: ["a) perform in-flight bite and ground tests of aircraft systems, i.e. BITE.", "b) give red warnings and amber cautions to display in accordance with system status.", "c) perform in-flight bite only."], answer: "a", explanation: "Centralized BITE management." },
                    { id: "M05-15-131", question: "131. BITE test carried out on input sensors and actuators performs.", options: ["a) validation of the information of the LRU.", "b) a performance test of the system.", "c) a test of the LRU."], answer: "b", explanation: "System performance verification." },
                    { id: "M05-15-132", question: "132. A BITE check for automatic performance and fault monitoring is carried out when?", options: ["a) Power-up self test.", "b) For in-flight monitoring.", "c) To check the performance of the LRU."], answer: "a", explanation: "Power-up self test." },
                    { id: "M05-15-133", question: "133. In which of the following does TCAS II advise the pilot to make a maneouvre?", options: ["a) RA.", "b) TA.", "c) either RA or TA."], answer: "a", explanation: "Resolution Advisory (RA) issues vertical evasion guidance maneuvers." },
                    { id: "M05-15-134", question: "134. What are the shapes of traffic shown on a TCAS display?", options: ["a) White circles, red diamonds and amber squares.", "b) White diamonds, red squares and amber circles.", "c) White squares, red diamonds and amber circles."], answer: "b", explanation: "Standard TCAS symbol colors and shapes (diamonds = other traffic, circles = TA, squares = RA)." },
                    { id: "M05-15-135", question: "135. If a display shows a red cross only, it is due to.", options: ["a) Symbol Generator failure.", "b) CRT failure.", "c) Altimeter failure."], answer: "a", explanation: "Symbol generator failure causes red cross flags on EFIS screens." },
                    { id: "M05-15-136", question: "136. ACARS is an acronym for.", options: ["a) ARINC Communicating Addressing and Reporting System.", "b) Airborne Communicating Addressing and Reporting System.", "c) Aircraft Communicating Addressing and Reporting System."], answer: "c", explanation: "Aircraft Communications Addressing and Reporting System." },
                    { id: "M05-15-137", question: "137. When does the flight data recorder start recording ?", options: ["a) Undercarriage up.", "b) Parking brake released.", "c) When the first engine starts."], answer: "c", explanation: "First engine start." },
                    { id: "M05-15-138", question: "138. Brake temperature displayed on a flight deck CRT has.", options: ["a) a master warning light.", "b) same colour throughout.", "c) different colour for different temperatures."], answer: "c", explanation: "Color coding changes (e.g. green to amber/red) based on brake thermal limits." },
                    { id: "M05-15-139", question: "139. When performing test on Electronic Displays using the Built In Test system.", options: ["a) CRT continues to display current data while the SGs and Display are internally tested.", "b) SG injects a test signal into the display system and the word TEST appears on the screen.", "c) displays cannot be tested it is only SG which are tested by BITE."], answer: "b", explanation: "SG test pattern injection." },
                    { id: "M05-15-140", question: "140. Heading reference required to establish initial heading during alignment sequence comes from.", options: ["a) FMS which gathers data from other Radio devices.", "b) Magnetic compass installed on the airplane.", "c) Earths Rotation."], answer: "c", explanation: "Earth's rotation rate sensing (gyro-compassing)." },
                    { id: "M05-15-141", question: "141. What is primary mode of navigation on a modern", options: ["a) Both GPS and IRS.", "b) Only IRS.", "c) Inch precise GPS."], answer: "b", explanation: "IRS serves as primary inertial backbone." },
                    { id: "M05-15-142", question: "142. In a flight director, how are small deviations corrected?", options: ["a) Pilot input.", "b) Instrument is calibrated at fitment to remove any possible error.", "c) Instrument feedback."], answer: "a", explanation: "Pilot flies the flight director bars." },
                    { id: "M05-15-143", question: "143. For a 3 dimensional fix in a Global Positioning System.", options: ["a) Minimum of 3 satellites must be in view.", "b) Minimum of 2 satellites must be in view and altitude used to simulate a 3rd satellite.", "c) Minimum of 4 satellites must be in view."], answer: "c", explanation: "Minimum 4 satellites." },
                    { id: "M05-15-144", question: "144. In an aircraft equipped with TCAS II and EFIS.", options: ["a) RA pitch command is shown on the EHSI and TA/RA traffic on the EADI.", "b) RA pitch command is shown on the VSI and TA/RA traffic on the EHSI.", "c) RA pitch command is shown on the EADI and TA/RA traffic on the EHSI."], answer: "c", explanation: "RA pitch cues on EADI / PFD, traffic targets on EHSI / Navigation display." },
                    { id: "M05-15-145", question: "145. The BITE indicator on a DFDR shows Yellow colour. This indicates.", options: ["a) power is ON but DFDR is not recording data.", "b) power is ON and DFDR is recording data.", "c) power is OFF or DFDR is at Fault."], answer: "c", explanation: "Fault / unpowered indicator." },
                    { id: "M05-15-146", question: "146. In a typical 'Glass Cockpit' EICAS provides the following.", options: ["a) engine parameters and system warnings only.", "b) engine parameters and engine warnings only.", "c) engine warnings only."], answer: "a", explanation: "Engine parameters and system warnings." },
                    { id: "M05-15-147", question: "147. What is the minimum requirement for CVR to operate?", options: ["a) BEFORE take-off.", "b) BEFORE engine start.", "c) at any time the manufacturer decides."], answer: "a", explanation: "Before takeoff (at engine start)." },
                    { id: "M05-15-148", question: "148. ECAM system was adopted for.", options: ["a) Airbus A310.", "b) both Boeing and Airbus aircraft.", "c) Boeing 757 and 767 aircraft."], answer: "a", explanation: "Airbus EFIS electronic centralized monitoring." },
                    { id: "M05-15-149", question: "149. A modern electromagnetic Flight Data Recorder, for recording data, could use:.", options: ["a) a floppy disk.", "b) a plastic tape coated in ferrite.", "c) a copper oxide string."], answer: "b", explanation: "Ferrite-coated plastic tape." },
                    { id: "M05-15-150", question: "150. What is the minimum requirement for a CVR to start recording?", options: ["a) When parking brake is released.", "b) On commencement of flight.", "c) When aircraft is capable of moving under its own power."], answer: "c", explanation: "Capable of moving under its own power (engine start)." },
                    { id: "M05-15-151", question: "151. As a minimum requirement when must a cockpit voice recorder start recording?", options: ["a) Once airborne after take off.", "b) Before engine start.", "c) Once aircraft is ready to move under its own power."], answer: "c", explanation: "Ready to move under own power." }
                ]
            },
            // === ICAT M5 完整單元題庫 ===
            "M5-01": {
                title: "ICAT 5.1 - Electronic Instrument Systems",
                questions: [
                    { id: "M5-01-01", question: "1. The minimum standards for aircraft instrumentation is set by:", options: ["a) The Civil Aviation Authority (CAA)", "b) The Joint Aviation Authorities (JAA)", "c) International Civil Aviation Organization"], answer: "c", explanation: "ICAO sets the international minimum standards for aircraft instrumentation." },
                    { id: "M5-01-02", question: "2. In the figure, place the correct instrument in its proper position in the basic ‘T’:", options: ["a) Refer to diagram reference", "b) Refer to diagram reference", "c) Refer to diagram reference"], answer: "a", image: "IMG_3779.jpeg", explanation: "Classic 'T' layout includes Airspeed Indicator, Artificial Horizon, Altimeter, and Direction Indicator." },
                    { id: "M5-01-03", question: "3. When flying a four (4) engine, analogue aircraft, there must be a minimum crew of:", options: ["a) Two (2) pilots & One (1) Flight Engineer", "b) Two (2) pilots", "c) Two (2) pilots & Two (2) Flight Engineers"], answer: "a", explanation: "Traditional four-engine analogue flight deck requirements typically include two pilots and a flight engineer." },
                    { id: "M5-01-04", question: "4. Match the following screen names to their allotted position below.", options: ["a) Refer to diagram reference", "b) Refer to diagram reference", "c) Refer to diagram reference"], answer: "a", image: "IMG_3780.jpeg", explanation: "Glass cockpit screen layout matching Co-pilot PFD, EICAS, Pilot ND, etc." },
                    { id: "M5-01-05", question: "5. On EFIS displays, cautionary messages are shown in:", options: ["a) Cyan", "b) Red", "c) Yellow/amber"], answer: "c", explanation: "Cautionary messages are displayed in yellow/amber." },
                    { id: "M5-01-06", question: "6. On EFIS displays failure warnings are shown:", options: ["a) As a steady red symbol", "b) As a flashing red symbol", "c) As a flashing yellow symbol"], answer: "b", explanation: "Failure warnings are typically flashed in red." },
                    { id: "M5-01-07", question: "7. The letters ‘PFD’ are an abbreviation for:", options: ["a) Primary Flight Display", "b) Pilot’s Flight Display", "c) Pilot’s First Display"], answer: "a", explanation: "PFD = Primary Flight Display." },
                    { id: "M5-01-08", question: "8. The letters ‘MFD’ are an abbreviation for:", options: ["a) Multi-Function Display", "b) Master Flight Display", "c) Mandatory Flight Display"], answer: "a", explanation: "MFD = Multi-Function Display." }
                ]
            },
            "M5-02": {
                title: "ICAT 5.2 - Numbering Systems",
                questions: [
                    { id: "M5-02-01", question: "1. The decimal number 286 is represented by the binary number:", options: ["a) 100011110", "b) 010101110", "c) 011100001"], answer: "a", explanation: "286 in decimal converts to binary 100011110." },
                    { id: "M5-02-02", question: "2. The binary code 101001011 represents the decimal number:", options: ["a) 350", "b) 331", "c) 194"], answer: "b", explanation: "Binary 101001011 = 256 + 64 + 8 + 2 + 1 = 331." },
                    { id: "M5-02-03", question: "3. The decimal number 84.35 is represented by the binary number:", options: ["a) 10001000.00111010", "b) 1110101.10011001", "c) 1010100.01011000"], answer: "c", explanation: "84 in binary is 1010100, and fractional part .35 converts to .01011000." },
                    { id: "M5-02-04", question: "4. The binary number 1011.011 is represented by the decimal number:", options: ["a) 11.375", "b) 10.35", "c) 13.575"], answer: "a", explanation: "1011 = 11; .011 = 1/4 + 1/8 = 0.25 + 0.125 = 0.375 -> 11.375." },
                    { id: "M5-02-05", question: "5. The decimal number 37 is represented by the octal number:", options: ["a) 45", "b) 37", "c) 54"], answer: "a", explanation: "37 / 8 = 4 remainder 5 -> 45 octal." },
                    { id: "M5-02-06", question: "6. The hexadecimal number A5 represents the decimal number:", options: ["a) 115", "b) 165", "c) 95"], answer: "b", explanation: "A (10) * 16 + 5 = 165." },
                    { id: "M5-02-07", question: "7. The BCD data string of 1001 0011 0100 . 0101 represents a DME distance of:", options: ["a) 543.8 Nautical Miles", "b) 723.4 Nautical Miles", "c) 934.5 Nautical Miles"], answer: "c", explanation: "1001=9, 0011=3, 0100=4, .0101=.5 -> 934.5 NM." }
                ]
            },
            "M5-03": {
                title: "ICAT 5.3 - Data Conversion",
                questions: [
                    { id: "M5-03-01", question: "1. In an air data computer, if an analogue signal represents 0.25 Volts/20 kts then an airspeed of 150 kts will be represented by a voltage of:", options: ["a) 1.675 V", "b) 1.875 V", "c) 2.0 V"], answer: "b", explanation: "(150 / 20) * 0.25 = 7.5 * 0.25 = 1.875 V." },
                    { id: "M5-03-02", question: "2. In A/D conversion, a signal’s bandwidth represents:", options: ["a) The maximum frequency range occupied by a signal", "b) The minimum frequency range occupied by a signal", "c) The frequency of a signal"], answer: "a", explanation: "Bandwidth defines the frequency spectrum range occupied by the signal." },
                    { id: "M5-03-03", question: "3. For ease in conversion to binary form, the number of levels used in sampling is usually a power of:", options: ["a) 2", "b) 8", "c) 16"], answer: "a", explanation: "Powers of 2 align directly with binary digital encoding." },
                    { id: "M5-03-04", question: "4. The resolution of A/D conversion depends on the input voltage range and:", options: ["a) The number of signals being converted", "b) The number of samples taken", "c) The number of bits used in the conversion"], answer: "c", explanation: "Resolution = Voltage Range / (2^n - 1), where n is the number of bits." },
                    { id: "M5-03-05", question: "5. A 5-bit D/A converter produces VOUT 0.2 V for a digital input of 1. Find the value of VOUT for a 11111 input.", options: ["a) 1 Volt", "b) 3.1 Volts", "c) 6.2 Volts"], answer: "c", explanation: "Binary 11111 = 31 in decimal. 31 * 0.2V = 6.2 Volts." },
                    { id: "M5-03-06", question: "6. A 10-bit D/A converter has a step size of 10 mV. Determine the full-scale output voltage and the percentage resolution:", options: ["a) 10.23V and 0.1%", "b) 5.11mV and 0.2%", "c) 5.11mV and 0.1%"], answer: "a", explanation: "Full scale for 10 bits is 2^10 - 1 = 1023 steps. 1023 * 10mV = 10.23V; resolution = 1/1023 ≈ 0.1%." }
                ]
            },
            "M5-04": {
                title: "ICAT 5.4 - Digital Databuses",
                questions: [
                    { id: "M5-04-01", question: "1. Manchester II encodes logic ‘1’ with a voltage transition from:", options: ["a) A high to low state", "b) A low to high state", "c) A specific voltage value"], answer: "a", explanation: "Manchester II logic 1 is represented by a high-to-low mid-bit transition." },
                    { id: "M5-04-02", question: "2. With asynchronous transmission:", options: ["a) The Transmitter and Receiver clocks are synchronised", "b) The Transmitter and Receiver clocks are not synchronised", "c) The Transmitter and Receiver use the same clocks"], answer: "b", explanation: "Asynchronous systems do not share a continuous common clock." },
                    { id: "M5-04-03", question: "3. The ARINC 429 Data word is:", options: ["a) 32 bits long", "b) 16 bits long", "c) 64 bits long"], answer: "a", explanation: "ARINC 429 standard words consist of 32 bits." },
                    { id: "M5-04-04", question: "4. The ARINC 429 standard uses:", options: ["a) No parity checking", "b) Odd parity checking", "c) Even parity checking"], answer: "b", explanation: "Bit 32 is checked using odd parity." },
                    { id: "M5-04-05", question: "5. The ARINC 429 databus uses:", options: ["a) RZ Unipolar modulation", "b) RZ Bipolar modulation", "c) NRZ Bipolar modulation"], answer: "b", explanation: "Bipolar Return-to-Zero (BRZ / BPRZ)." },
                    { id: "M5-04-06", question: "6. The ARINC 429 standard address label uses:", options: ["a) Octal representation", "b) Binary representation", "c) Hexadecimal representation"], answer: "a", explanation: "Labels are expressed in Octal (base 8)." },
                    { id: "M5-04-07", question: "7. Put the following words in their correct position in this figure (ARINC 429 Word Format):", options: ["a) Refer to diagram reference", "b) Refer to diagram reference", "c) Refer to diagram reference"], answer: "a", image: "IMG_3781.jpeg", explanation: "Label (Bits 1-8), SDI (9-10), Data (11-28/29), SSM (29-31), Parity (Bit 32)." },
                    { id: "M5-04-08", question: "8. As read on an oscilloscope, the first 10 bits of an ARINC 429 word are 1011001111; its address label is:", options: ["a) 363 Octal", "b) 437 Octal", "c) 317 Octal"], answer: "c", explanation: "Bit order reversal yields octal 317." },
                    { id: "M5-04-09", question: "9. ARINC 429 can run at a baud rate of 12.5 k and:", options: ["a) 100 (kB)", "b) 50 (kB)", "c) 14.5 (kB)"], answer: "a", explanation: "Low speed (12.5 kbps) and High speed (100 kbps)." },
                    { id: "M5-04-10", question: "10. ARINC 629 is:", options: ["a) A broadcast databus", "b) A bi-directional databus", "c) A unidirectional bus"], answer: "b", explanation: "ARINC 629 is a bi-directional serial bus." },
                    { id: "M5-04-11", question: "11. ARINC 629 runs at a baud rate of:", options: ["a) 100 kBaud", "b) 2000 kBaud", "c) 50 kBaud"], answer: "b", explanation: "High speed 2 Mbps (2000 kBaud)." },
                    { id: "M5-04-12", question: "12. ARINC 629 LRUs connect to the databus using:", options: ["a) Direct crimp connection", "b) Terminal blocks", "c) Current Mode Couplers"], answer: "c", explanation: "Inductive Current Mode Couplers." },
                    { id: "M5-04-13", question: "13. With ARINC 629 each LRU is assigned a unique:", options: ["a) Terminal Interrupt (TI)", "b) Terminal Gap (TG)", "c) Synchronisation Gap (SG)"], answer: "b", explanation: "Terminal Gap (TG) provides unique scheduling." },
                    { id: "M5-04-14", question: "14. Each time a LRU transmits data it can transmit again:", options: ["a) Only when its TI, TG and SG timers have expired", "b) When just its TG timer has expired", "c) When its TG and SG timers have expired"], answer: "a", explanation: "Must wait through TI, TG, and SG intervals." },
                    { id: "M5-04-15", question: "15. CSDB can run at a baud rate of 12.5 kBaud and:", options: ["a) 100 kBaud", "b) 50 kBaud", "c) 14.5 kBaud"], answer: "b", explanation: "CSDB standard speeds include 12.5 and 50 kBaud." },
                    { id: "M5-04-16", question: "16. A CSDB Message block can have:", options: ["a) 6 or 7 bytes", "b) 5 or 7 bytes", "c) 6 or 8 bytes"], answer: "c", explanation: "6 or 8 bytes block structures." },
                    { id: "M5-04-17", question: "17. CSDB has a special ‘burst’ mode when data is transmitted:", options: ["a) Every 50 milli-seconds for 16 times", "b) Every 16 milli-seconds for 50 times", "c) Every 35 milli-seconds for 16 times"], answer: "a", explanation: "Burst mode timing: every 50 ms for 16 times." },
                    { id: "M5-04-18", question: "18. ASCB data transmission is:", options: ["a) Bi-directional full duplex", "b) Broadcast in one direction only", "c) Bi-directional half duplex"], answer: "c", explanation: "Avionics Standard Communication Bus operates bi-directionally half-duplex." },
                    { id: "M5-04-19", question: "19. ASCB can be used with a maximum of:", options: ["a) 48 users", "b) 24 users", "c) 36 users"], answer: "a", explanation: "Up to 48 terminals/users." },
                    { id: "M5-04-20", question: "20. An ASCB data frame is:", options: ["a) 25 milli-seconds long", "b) 50 milli-seconds long", "c) 75 milli-seconds long"], answer: "a", explanation: "25 ms frame length." },
                    { id: "M5-04-21", question: "21. An Ethernet Frame format contains a “Preamble” which consists of:", options: ["a) a single byte...", "b) seven bytes, which allow the receiver's clock to be synchronised with the sender's.", "c) a single byte..."], answer: "b", explanation: "7 bytes for clock synchronization." },
                    { id: "M5-04-22", question: "22. Ethernet protocol expects a minimum data length of:", options: ["a) 46 bytes", "b) 56 bytes", "c) 66 bytes"], answer: "a", explanation: "Minimum payload/data field is 46 bytes." },
                    { id: "M5-04-23", question: "23. The final field in an Ethernet Frame format contains the:", options: ["a) Frame Check Sequence (FCS)", "b) address of the source", "c) address of the destination"], answer: "a", explanation: "FCS / CRC at the frame tail." },
                    { id: "M5-04-24", question: "24. Which of the following statements is correct regarding an Ethernet frame Cyclic Redundancy Check (CRC):", options: ["a) The CRC is part of the Preamble...", "b) The CRC is part of the Start of Frame...", "c) The CRC is part of the Frame Check Sequence (FCS), and is used for error detection and recovery"], answer: "c", explanation: "CRC is part of FCS for error detection." },
                    { id: "M5-04-25", question: "25. An Ethernet frame Start of Frame Delimiter (SOF), consists of:", options: ["a) seven bytes...", "b) seven bytes, all of the form...", "c) a single byte, the last two bits are both binary 1, used to indicate the start of the frame"], answer: "c", explanation: "Single byte SOF delimiter." }
                ]
            },
            "M5-05": {
                title: "ICAT 5.5 - Logic Circuits",
                questions: [
                    { id: "M5-05-01", question: "1. For an AND gate with three (3) inputs, in order to get a logic 1 output:", options: ["a) At least two inputs must be at logic 1", "b) At least one input must be at logic 1", "c) At least three inputs must be at logic 1"], answer: "c", explanation: "All inputs must be 1 for an AND gate output." },
                    { id: "M5-05-02", question: "2. For the OR gate in the figure below, there will be an output at O:", options: ["a) Only at time T1 and T5", "b) Only at time T3 and T5", "c) Only at time T1, T3 and T5"], answer: "c", image: "IMG_3782.jpeg", explanation: "OR gate outputs high whenever input A or B is high." },

        let currentModuleKey = "M05-01";
        let currentIndex = 0;
        let userAnswers = {};

        function initApp() {
            for (let key in allQuestionBanks) {
                userAnswers[key] = new Array(allQuestionBanks[key].questions.length).fill(null);
            }
            
            document.getElementById("module-select").addEventListener("change", function(e) {
                switchModule(e.target.value);
            });
            document.getElementById("prev-btn").addEventListener("click", prevQuestion);
            document.getElementById("next-btn").addEventListener("click", nextQuestion);
            document.getElementById("restart-btn").addEventListener("click", restartQuiz);

            loadQuestion();
        }

        function getCurrentQuestions() {
            return allQuestionBanks[currentModuleKey].questions;
        }

        function loadQuestion() {
            const questions = getCurrentQuestions();
            const q = questions[currentIndex];
            const currentAnswers = userAnswers[currentModuleKey];

            document.getElementById("module-badge").textContent = currentModuleKey;
            document.getElementById("module-title").textContent = allQuestionBanks[currentModuleKey].title;
            document.getElementById("current-idx").textContent = currentIndex + 1;
            document.getElementById("total-cnt").textContent = questions.length;
            
            const percent = ((currentIndex + 1) / questions.length) * 100;
            document.getElementById("progress-bar").style.width = `${percent}%`;

            document.getElementById("question-text").textContent = q.question;

            // 處理圖片顯示
            const imgContainer = document.getElementById("image-container");
            const imgElement = document.getElementById("question-image");
            if (q.image) {
                imgElement.src = q.image;
                imgContainer.classList.remove("hidden");
            } else {
                imgContainer.classList.add("hidden");
                imgElement.src = "";
            }

            const container = document.getElementById("options-container");
            container.innerHTML = "";

            q.options.forEach((opt) => {
                const letter = opt.charAt(0).toLowerCase();
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-4 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 transition flex items-center justify-between text-slate-700 text-sm md:text-base font-medium shadow-sm";
                btn.innerHTML = `<span>${opt}</span>`;

                if (currentAnswers[currentIndex] !== null) {
                    btn.disabled = true;
                    if (letter === q.answer.toLowerCase()) {
                        btn.className = "w-full text-left p-4 rounded-xl bg-emerald-50 border-2 border-emerald-500 text-emerald-800 font-bold flex items-center justify-between text-sm md:text-base shadow-sm";
                    } else if (letter === currentAnswers[currentIndex]) {
                        btn.className = "w-full text-left p-4 rounded-xl bg-rose-50 border-2 border-rose-500 text-rose-800 font-bold flex items-center justify-between text-sm md:text-base shadow-sm";
                    }
                } else {
                    btn.onclick = () => selectOption(letter);
                }
                container.appendChild(btn);
            });

            const expBox = document.getElementById("explanation-box");
            if (currentAnswers[currentIndex] !== null) {
                document.getElementById("explanation-text").textContent = q.explanation || "暫無詳細解析。";
                expBox.classList.remove("hidden");
            } else {
                expBox.classList.add("hidden");
            }

            document.getElementById("prev-btn").disabled = currentIndex === 0;
            document.getElementById("next-btn").querySelector("span").textContent = currentIndex === questions.length - 1 ? "查看結果" : "下一題";
        }

        function selectOption(letter) {
            userAnswers[currentModuleKey][currentIndex] = letter;
            loadQuestion();
        }

        function nextQuestion() {
            const questions = getCurrentQuestions();
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                showResult();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function showResult() {
            const questions = getCurrentQuestions();
            const answers = userAnswers[currentModuleKey];
            let score = 0;
            questions.forEach((q, idx) => {
                if (answers[idx] === q.answer.toLowerCase()) score++;
            });

            document.getElementById("quiz-container").classList.add("hidden");
            document.getElementById("result-container").classList.remove("hidden");
            document.getElementById("score-text").textContent = score;
            document.getElementById("result-total").textContent = questions.length;
        }

        function switchModule(key) {
            currentModuleKey = key;
            currentIndex = 0;
            document.getElementById("result-container").classList.add("hidden");
            document.getElementById("quiz-container").classList.remove("hidden");
            loadQuestion();
        }

        function restartQuiz() {
            userAnswers[currentModuleKey] = new Array(getCurrentQuestions().length).fill(null);
            currentIndex = 0;
            document.getElementById("result-container").classList.add("hidden");
            document.getElementById("quiz-container").classList.remove("hidden");
            loadQuestion();
        }

        window.onload = initApp;
    </script>
